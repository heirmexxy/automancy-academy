<header class="lh">
  <div>
    <span class="eyebrow">Track 7 · CRM Implementation specialisation · Lesson 7.2</span>
    <h1>Solution Design: Objects, Pipelines, Teams and Permissions</h1>
    <div class="kicker"><span class="pill">≈ 2.5 hours</span><span class="pill">100 XP</span><span class="pill">Guides: Echo and Sage</span><span class="pill">Tools: HubSpot (trial or developer test account) or Zoho CRM trial, Google Sheets, Excalidraw</span></div>
  </div>
  <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#echo"/></svg>
</header>
<p class="lede">The requirements say what Kora needs. The solution design says exactly how the CRM will hold it: which records exist and how they link, which fields each record has, how many pipelines and stages, who owns what, and who can see what. It's the blueprint you build from, the document the client signs before you configure anything, and the first thing the next consultant will read.</p>
<div class="outcomes">
  <div><b>01</b><span>Model a business in standard and custom objects with the right associations.</span></div>
  <div><b>02</b><span>Design properties with naming rules, types and required fields.</span></div>
  <div><b>03</b><span>Decide when one pipeline is enough and when a business needs several.</span></div>
  <div><b>04</b><span>Design teams, roles and permissions so people see what their job needs.</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 55 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Standard objects first, custom objects only when needed</h3>
    <p>Every CRM ships with contacts, companies, deals and activities (and usually tickets for service). Use them wherever they fit: reports, integrations and the mobile app all understand them. Create a <b>custom object</b> only for a thing the business manages that is none of these and has its own records, fields and relationships.</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Business</th><th>Thing</th><th>Where it lives</th></tr></thead>
      <tbody>
        <tr><td>Estate agency</td><td>Property (address, type, bedrooms, price, status, landlord)</td><td>Custom object "Property"</td></tr>
        <tr><td>Training school</td><td>Cohort or class</td><td>Custom object, or a property on the deal if it's just a label</td></tr>
        <tr><td>Car dealer</td><td>Vehicle in stock</td><td>Custom object (or the CRM's product library)</td></tr>
        <tr><td>Produce supplier</td><td>Product (tomatoes, eggs)</td><td>Product library and line items, not a custom object</td></tr>
      </tbody>
    </table></div>
    <div class="vocab">
      <div><b>Know where custom objects are allowed</b>In HubSpot, custom objects need an Enterprise subscription. On lower tiers, a common workaround is to store the property as a deal property set or use the product library; in Zoho CRM, custom modules are available on paid editions (limits rise with the edition). Check the vendor's current plan page.</div>
      <div><b>Associations with labels</b>Links between records can carry a label: a contact is the <i>landlord</i> of one property and an <i>interested buyer</i> on another. Labels let reports and workflows tell the difference.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Properties: naming, types and the data dictionary</h3>
    <p>Every field you create becomes a column in every export, a filter in every report and a thing someone must fill in. Design them in a <b>data dictionary</b> before you create any.</p>
<pre class="codebox">Data dictionary (one row per field)
object  | label           | internal name        | type       | values / rule                   | required at
deal    | Deal type       | kora_deal_type       | dropdown   | Sale · Rental · Short-let       | create
deal    | Budget (NGN)    | kora_budget_ngn      | number     | whole naira, > 0                | Viewing booked
deal    | Lost reason     | kora_lost_reason     | dropdown   | Price · Location · Chose other  | Closed lost
contact | Lead source     | kora_lead_source     | dropdown   | PropertyPro · NPC · Instagram…  | create
contact | Consent to mkt  | kora_mkt_consent     | dropdown   | yes · no · unknown (+ date)     | create
property| Status          | kora_status          | dropdown   | Available · Under offer · Let…  | create</pre>
    <div class="vocab">
      <div><b>Internal names never change</b>Labels can be renamed; internal names are what integrations and the API use. Prefix custom ones (<code>kora_</code>) so they never clash with the vendor's own.</div>
      <div><b>Types decide reports</b>Use dropdowns for anything you'll filter on, numbers for money, dates for dates. A budget stored as text ("₦45m-ish") can't be summed or filtered.</div>
      <div><b>Required at a stage</b>Make fields required when they become knowable: budget when a viewing is booked, lost reason when a deal is lost. Required-at-create forms full of guesses produce junk.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Pipelines lab: one, or several?</h3>
    <p>Use a separate pipeline when a process has <i>different stages</i>, not just a different label. Decide for each situation.</p>
    <script type="application/json" id="pk-7-2">{"opts":[["same","Same pipeline (use a property to tell them apart)"],["separate","Separate pipeline"],["notdeal","Not a deal pipeline at all"]],
     "items":[
      {"t":"Property sales: enquiry → viewing → offer → offer accepted → solicitors → completed.","best":"separate","why":"Sales have their own stages (offers, solicitors, completion). They need a Sales pipeline."},
      {"t":"Rentals: enquiry → viewing → application → references checked → tenancy signed.","best":"separate","why":"Different stages and exit rules from sales: references and a tenancy, not offers and solicitors. A Lettings pipeline."},
      {"t":"Sales in Lekki and sales in Ibadan, same steps.","best":"same","why":"Same stages, different office. Use an Office property and team permissions, not a second pipeline."},
      {"t":"Luxury sales over ₦500m, same steps but handled by senior agents.","best":"same","why":"Same process. Route them to senior agents with a rule on Budget; don't duplicate the pipeline."},
      {"t":"A tenant reports a broken water heater.","best":"notdeal","why":"That's a service request, not a sale. Use tickets (a help-desk pipeline) so maintenance doesn't pollute sales reports."},
      {"t":"Landlords who want Kora to manage their property: approach → valuation → management agreement.","best":"separate","why":"Winning a landlord is a different sale with its own stages. A small Landlord acquisition pipeline."}],
     "ok":"✓ Right. New pipeline for a different process; a property and permissions for the same process in another place.",
     "bad":"Ask: do the stages differ? Same stages means one pipeline plus a property. Service requests belong in tickets."}</script>
    <div class="ident" data-pick="pk-7-2">
      <div data-o="items" style="display:grid;gap:8px"></div>
      <p class="mgoal" data-o="verdict" aria-live="polite"></p>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Owners, teams and permissions</h3>
    <div class="vocab">
      <div><b>Owner</b>Every contact, deal and ticket has one named owner, the person responsible for the next step. Never a shared "sales" user.</div>
      <div><b>Teams</b>Group users by office or function (Lekki sales, Ibadan sales, Lettings). Reports and permissions use teams.</div>
      <div><b>Permission levels</b>Usually three for records: <i>everything</i>, <i>team's records</i>, <i>own records only</i>, set separately for viewing and editing. Agents: view and edit own; office managers: their team; owner and admin: everything.</div>
      <div><b>Sensitive fields</b>Some fields (commission, landlord bank details, ID numbers) shouldn't be in the CRM at all, or only visible to a few people where the plan supports field-level permissions. When in doubt, keep them out.</div>
      <div><b>Least privilege</b>Start everyone with the least access their job needs. It's easy to give more and awkward to take away.</div>
    </div>
<pre class="codebox">Permission matrix (Kora)
role             | contacts      | deals         | properties | settings | export
agent            | own (edit)    | own (edit)    | all (view) | none     | no
office manager   | team (edit)   | team (edit)   | all (edit) | none     | team
owner / admin    | all           | all           | all        | all      | yes
marketing intern | all (view)    | none          | all (view) | none     | no</pre>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>The solution design document</h3>
    <p>Everything above, on as few pages as possible, signed before you build. It also becomes the handover document in 7.6.</p>
<pre class="codebox">Solution design · contents
1. Objects and associations (diagram + association labels)
2. Data dictionary (every custom property; ≤ the plan's limits)
3. Pipelines: stages, exit rules, win chance, required fields per stage
4. Users, teams, roles and the permission matrix
5. Record ownership and assignment rules (who owns new leads)
6. Naming conventions (kora_ prefix, deal names "Address · Buyer")
7. What stays outside the CRM (commissions, ID documents) and why
8. Open questions and decisions, with dates</pre>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> A good test: could another consultant rebuild this CRM from the document alone? If not, something important is only in your head.</div></div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 50 MIN</span><h2>Solved problem: Kora's solution design</h2></div>
  <div class="prose"><p><b>The goal.</b> A signed design that covers every must-have from 7.1, fits the chosen plan's limits, and that the build in 7.3–7.5 can follow without guessing. (The steps use HubSpot names; Zoho equivalents are in brackets.)</p></div>
  <div class="steps">
    <div class="step"><div>
      <h4>Draw the model</h4>
<pre class="codebox">Contact ──(landlord of)──────── Property ──(listed in)── Deal
   │      ──(interested in)──┘                            │
   └──────────(buyer / tenant on)─────────────────────────┘
Company: only for corporate clients (relocating staff, developers)
Ticket:  tenant maintenance requests, linked to Property and Contact</pre>
      <p>Kora's chosen plan includes custom objects, so Property is a custom object (Zoho: a custom module). On a plan without them, the fallback would be the product library plus a few deal properties, which the design would note as a limitation.</p>
    </div></div>
    <div class="step"><div>
      <h4>Write the data dictionary</h4>
      <p>27 custom properties across contacts (6), deals (9), properties (12). Every dropdown's values listed. Each required field has the stage it becomes required at. Internal names use the <code>kora_</code> prefix.</p>
    </div></div>
    <div class="step"><div>
      <h4>Pipelines with exit rules</h4>
<pre class="codebox">Sales:     New enquiry → Viewing booked → Viewed → Offer made →
           Offer accepted → Legal and payment → Completed / Lost
Lettings:  New enquiry → Viewing booked → Viewed → Application →
           References checked → Tenancy signed / Lost
Landlords: Approached → Valuation done → Agreement sent → Signed / Lost
Tickets:   New → Contractor booked → Fixed → Closed</pre>
    </div></div>
    <div class="step"><div>
      <h4>Teams, roles and permissions</h4>
      <p>Teams: Lekki sales, Ibadan sales, Lettings. Roles from the matrix in Card 4. Commission stays in the finance sheet; landlord bank details and ID documents stay out of the CRM. Only the owner and admin can export.</p>
    </div></div>
    <div class="step"><div>
      <h4>Assignment and naming rules</h4>
      <p>New portal and website enquiries: round-robin among available agents in the office whose area matches the property (built in 7.4). Deal name: <code>Property address · Buyer surname</code>. Every deal needs an owner and a next-step date.</p>
    </div></div>
    <div class="step"><div>
      <h4>Review and sign</h4>
      <p>A 45-minute walkthrough with Mrs Adeyemi and both office managers using two real recent deals as examples. They catch one gap (short-lets), which goes to the Lettings pipeline with a Deal type property. Signed.</p>
      <div class="stats">
        <div class="stat"><b>4</b><span>pipelines (3 deal + tickets)</span></div>
        <div class="stat"><b>27</b><span>custom properties, all documented</span></div>
        <div class="stat"><b>4</b><span>roles in the permission matrix</span></div>
      </div>
    </div></div>
  </div>
  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Standard objects wherever they fit; one custom object where they don't.</li><li>Every field documented before it exists.</li><li>Pipelines split only where stages differ.</li><li>Least-privilege permissions agents can trust.</li><li>Sensitive data kept out on purpose.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Creating fields on the fly during the build.</li><li>A pipeline per office or per agent.</li><li>Text fields for money, dates and sources.</li><li>Everyone as super admin "for now".</li><li>Storing ID documents and bank details in the CRM.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I designed while building. Much faster.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What Glitch built</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Properties stored as companies, so "3-bed flat, Admiralty Way" appears in the company list next to real businesses.</td></tr>
        <tr><td>B</td><td>Fields named "Budget", "budget2", "Client budget (new)" and "BUDGET NGN", all text.</td></tr>
        <tr><td>C</td><td>A separate pipeline for every agent, "so they feel ownership".</td></tr>
        <tr><td>D</td><td>All 12 agents are super admins.</td></tr>
        <tr><td>E</td><td>Landlords' bank details and ID card photos attached to contacts.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> a property is its own thing. Use a custom object where the plan allows, or the documented fallback; never disguise it as a company.</li>
        <li><b>B:</b> no data dictionary. One number field, <code>kora_budget_ngn</code>; migrate the values and delete the others.</li>
        <li><b>C:</b> pipelines are for processes, not people. Use one pipeline with owners and a "My deals" view.</li>
        <li><b>D:</b> anyone can change settings, delete data or export the whole client list. Least privilege: agents edit their own records.</li>
        <li><b>E:</b> sensitive data with no business need in the CRM. Remove it, keep it in the secure system it belongs in, and record the decision.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ MISSIONS ============ -->
<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">PART 6 · 20 MIN+</span><h2>Missions</h2></div>
  <div class="mission">
    <span class="tier t-b">BRONZE · +25 XP</span>
    <h4>Model a business</h4>
    <ul><li>For a business you know, draw its objects and associations and list every pipeline with stages and exit rules.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>Every custom object is justified (it isn't a contact, company, deal, ticket or product), and each pipeline's stages differ from the others.</li></ul>
  </div>
  <div class="mission">
    <span class="tier t-s">SILVER · +50 XP</span>
    <h4>Write the full solution design</h4>
    <ul><li>All eight sections from Card 5, including a data dictionary and a permission matrix, within your chosen plan's limits.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>Every custom field has an internal name, type, values and when it's required, and someone else could build from the document alone.</li></ul>
  </div>
  <div class="mission">
    <span class="tier t-g">GOLD · +100 XP</span>
    <h4>Design and configure for a real client</h4>
    <ul><li>Get a real client's design signed, then configure objects, properties, pipelines, teams and permissions in a trial or sandbox.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>Two test users with different roles see only what the matrix says, shown in screenshots.</li></ul>
  </div>
</section>

<!-- ============ QUIZ ============ -->
<section class="part" style="--c:#D4DDE3">
  <div class="part-h"><span class="tag">PART 7 · 5 MIN</span><h2>Checkpoint quiz</h2></div>
  <div class="quiz">
    <div class="q" data-ans="b"><p>1. When is a custom object the right choice?</p><div class="opts">
      <button type="button" data-opt="a">Whenever the client asks for a new list</button><button type="button" data-opt="b">For a thing with its own records and links that isn't a contact, company, deal, ticket or product</button><button type="button" data-opt="c">For every important field</button><button type="button" data-opt="d">Never</button></div>
      <p class="fb" hidden data-why="Standard objects first; a custom object for something like a Property."></p></div>
    <div class="q" data-ans="d"><p>2. Why prefix internal property names (e.g. kora_)?</p><div class="opts">
      <button type="button" data-opt="a">It looks professional</button><button type="button" data-opt="b">The CRM requires it</button><button type="button" data-opt="c">To hide them from users</button><button type="button" data-opt="d">So custom fields never clash with the vendor's and are easy to find in the API</button></div>
      <p class="fb" hidden data-why="Integrations use internal names; they should be stable and unambiguous."></p></div>
    <div class="q" data-ans="a"><p>3. Sales in two offices follow the same steps. How many pipelines?</p><div class="opts">
      <button type="button" data-opt="a">One, with an Office property and team permissions</button><button type="button" data-opt="b">Two, one per office</button><button type="button" data-opt="c">One per agent</button><button type="button" data-opt="d">None</button></div>
      <p class="fb" hidden data-why="Separate pipelines are for different processes, not different places."></p></div>
    <div class="q" data-ans="c"><p>4. What's the safest starting permission for an agent?</p><div class="opts">
      <button type="button" data-opt="a">Super admin, to avoid support requests</button><button type="button" data-opt="b">View everything, edit everything</button><button type="button" data-opt="c">View and edit their own records; view shared listings</button><button type="button" data-opt="d">No access</button></div>
      <p class="fb" hidden data-why="Least privilege: easy to give more later."></p></div>
    <div class="q" data-ans="b"><p>5. When should "Budget" become a required field on a sales deal?</p><div class="opts">

    <h3>Remember this</h3>
    <ol>
      <li>Standard objects first; a custom object only for a real, separate thing (and only on a plan that allows it).</li>
      <li>Every field goes in the data dictionary before it goes in the CRM.</li>
      <li>A new pipeline for a different process; a property for the same process elsewhere.</li>
      <li>Owners, teams and least-privilege permissions make agents trust the system.</li>
      <li>Keep sensitive data out unless there's a clear need and a secure place for it.</li>

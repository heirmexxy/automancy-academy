  <div>
    <span class="eyebrow">Track 2 · The Weave Workshop (Make) · Lesson 2.6</span>
    <h1>Error Handling &amp; Reliability</h1>
    <div class="kicker"><span class="pill">≈ 100 minutes</span><span class="pill">100 XP</span><span class="pill">Guides: Weave and Glitch</span><span class="pill">Tools: Make, webhook.site</span></div>
  </div>
  <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#glitch"/></svg>
</header>
<p class="lede">Everything fails sometimes: a courier's server goes down, a weather service times out, one order has no address. Amateurs' automations stop silently. Professionals' automations retry, skip, substitute or shout, on purpose. This module is where Glitch stops being a villain and becomes your sparring partner.</p>
<div class="outcomes">
  <div><b>01</b><span>Explain the five error handlers and choose the right one per module.</span></div>
  <div><b>02</b><span>Set up automatic retries with incomplete executions.</span></div>
  <div><b>03</b><span>Build error routes that tell a person exactly what broke.</span></div>
  <div><b>04</b><span>Test failure on purpose, before it happens for real.</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 20 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>What happens without a plan</h3>
    <p>When a module errors and has no error handler, Make stops that run with an error. Bundles still waiting are not processed. If a scheduled scenario keeps failing, Make can switch it off automatically (the number of consecutive errors allowed is in the scenario's settings). Make labels errors by type, such as connection, runtime, data and rate-limit errors, which helps you choose a response.</p>
    <div class="analogy"><b>The big idea:</b> decide in advance, module by module, what should happen when it fails. An error handler is a small route attached to a module (right-click → Add error handler), ending in a <b>directive</b> that tells Make what to do next.</div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>The five directives</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Directive</th><th>What happens</th><th>Run status</th><th>Use when</th></tr></thead>
      <tbody>
        <tr><td><b>Ignore</b></td><td>Skips the failed bundle; other bundles carry on</td><td>Success</td><td>One bad item shouldn't stop the rest (and you've logged it)</td></tr>
        <tr><td><b>Resume</b></td><td>Substitutes output you define and continues as if it worked</td><td>Success</td><td>A sensible default exists (rain chance "unknown")</td></tr>
        <tr><td><b>Break</b></td><td>Stores the run as an incomplete execution to finish later, manually or with automatic retries</td><td>Warning</td><td>The step must eventually happen (courier booking)</td></tr>
        <tr><td><b>Commit</b></td><td>Stops the run, keeps what's done, skips remaining bundles</td><td>Success</td><td>Stop cleanly, nothing left worth doing</td></tr>
        <tr><td><b>Rollback</b></td><td>Stops and tries to undo changes made by modules that support it</td><td>Error</td><td>All-or-nothing changes (works only with modules that support transactions, such as data stores)</td></tr>
      </tbody>
    </table></div>
    <p style="font-size:.88rem;color:var(--muted)">Statuses as described by Make. Google Sheets and email can't be "undone", so Rollback won't reverse them.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Break and automatic retries</h3>
    <p>To use Break, turn on <b>storing of incomplete executions</b> in the scenario settings. Then, in the Break handler, enable automatic completion and set the number of attempts and the interval. The failed run waits, and Make retries it from the failed module.</p>
    <figure class="fig"><svg viewBox="0 0 620 140" role="img" aria-label="Retry timeline: attempt at 8:00 p.m. fails with 503, retry at 8:15 fails, retry at 8:30 succeeds and the booking is made.">
      <line x1="20" y1="70" x2="600" y2="70" stroke="var(--line)" stroke-width="4"/>
      <g font-family="JetBrains Mono,monospace" font-size="11" text-anchor="middle">
        <circle cx="80" cy="70" r="16" fill="var(--glitch)" stroke="var(--ink)" stroke-width="2"/><text x="80" y="74" fill="#fff">✕</text><text x="80" y="40" fill="var(--ink)">20:00</text><text x="80" y="108" fill="var(--muted)">503</text>
        <circle cx="260" cy="70" r="16" fill="var(--glitch)" stroke="var(--ink)" stroke-width="2"/><text x="260" y="74" fill="#fff">✕</text><text x="260" y="40" fill="var(--ink)">20:15</text><text x="260" y="108" fill="var(--muted)">retry 1 · 503</text>
        <circle cx="440" cy="70" r="16" fill="var(--volt)" stroke="var(--ink)" stroke-width="2"/><text x="440" y="74" fill="#13233A">✓</text><text x="440" y="40" fill="var(--ink)">20:30</text><text x="440" y="108" fill="var(--muted)">retry 2 · 201 booked</text>
      </g>
      <text x="560" y="74" font-family="Atkinson Hyperlegible,sans-serif" font-size="12" fill="var(--ink)">done</text>
    </svg><figcaption>Retries handle short outages. Set a limit, and alert a person if the last retry fails too.</figcaption></figure>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><div class="bubble"><b>Nodo:</b> Retry only things that can succeed later: timeouts, 5xx, rate limits (0.2). A 400 or 401 will fail every time; retrying just wastes credits. Fix those and alert.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Error routes that talk</h3>
    <p>An error handler route can contain modules before its directive. Add a message step so a person knows exactly what failed. Inside the error route, Make provides details about the error (such as its message and type) that you can map.</p>
<pre class="codebox"><span class="c">Error route on "HTTP · Book courier"</span>
Gmail · Send to Tolu
  Subject: Courier booking failed · {{order_id}}
  Body:    {{error.type}}: {{error.message}}
           Order {{order_id}} for {{customer_name}}, {{area}}.
           Make will retry automatically. Check incomplete executions if this repeats.
→ Break (auto-retry 3 times, every 15 minutes)</pre>
    <p style="font-size:.88rem;color:var(--muted)">Map the error fields from the mapping panel inside your error route; exact field names appear there.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Prevent, then handle</h3>
    <div class="never">
      <div><b>Prevent bad data</b>Validation in sheets (0.4) and filters (2.3) stop many errors before they happen: no address, no API call.</div>
      <div><b>Handle what you can't prevent</b>Outages, timeouts and rate limits will happen. Give every external call a handler.</div>
      <div><b>Be told</b>Turn on Make's email notifications for errors and warnings in your profile, and log failures to an Errors tab you review weekly.</div>
    </div>
  </div>
</section>

    <div class="sitem" data-ans="ignore"><span>Posting to an optional "activity feed" fails. Nobody needs to retry it, but you want a note in the Errors tab.</span><span class="sb"><button type="button" data-v="ignore">Ignore</button><button type="button" data-v="resume">Resume</button><button type="button" data-v="break">Break</button><button type="button" data-v="rollback">Rollback</button></span><span class="why" hidden data-t="Log, then Ignore. Optional work shouldn't stop or retry the important work."></span></div>
    <p class="qscore sscore" aria-live="polite"></p>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 35 MIN</span><h2>Solved problem: an 8 p.m. run that survives Friday</h2></div>
  <div class="prose"><p><b>The goal.</b> Harden the 2.3 run. It books each delivery with the courier's API, adds the rain chance to rider messages, and texts each customer. Make every failure either recover by itself or reach Tolu with the details. You'll fake the courier with webhook.site, which lets you choose the status code it returns.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Decide the plan on paper first</h4>
      <div class="tablewrap"><table class="dt">
        <thead><tr><th>Module</th><th>If it fails…</th><th>Handler</th></tr></thead>
        <tbody>
          <tr><td>HTTP · Weather (Open-Meteo)</td><td>Nice to have</td><td>Resume: rain_chance = "unknown"</td></tr>
          <tr><td>HTTP · Book courier (per order)</td><td>Must happen tonight</td><td>Alert Tolu → Break, 3 retries every 15 min</td></tr>
          <tr><td>Message customer (per order)</td><td>One bad number shouldn't stop others</td><td>Log to Errors tab → Ignore</td></tr>
          <tr><td>Google Sheets · Add to Deliveries</td><td>Rare; usually a quota or connection blip</td><td>Break, 2 retries</td></tr>
        </tbody>
      </table></div>
    </div></div>

    <div class="step"><div>
      <h4>Switch on incomplete executions</h4>
      <p>Scenario settings → allow storing of incomplete executions. Without this, Break can't save failed runs for retry.</p>
    </div></div>

    <div class="step"><div>
      <h4>Weather: Resume with a default</h4>
      <p>Right-click the weather HTTP module → Add error handler → <b>Resume</b>. In its output, set the rain chance field to <code>unknown</code>. Later modules map it as normal; the rider message reads "Rain chance: unknown" instead of the run failing.</p>
    </div></div>

    <div class="step"><div>
      <h4>Courier: alert, then Break with retries</h4>
      <p>Point the courier HTTP POST at a webhook.site URL set to respond with status <b>503</b>. Add an error handler with a <b>Gmail</b> step (the message from Card 4), then <b>Break</b> with automatic completion: 3 attempts, 15 minutes apart.</p>
    </div></div>

    <div class="step"><div>
      <h4>Customer messages: log, then Ignore</h4>
      <p>On the messaging module, add an error route: <b>Google Sheets · Add a Row</b> to an Errors tab (time, scenario, module, order_id, error message), then <b>Ignore</b>. One bad number is recorded, and everyone else still gets their message.</p>
    </div></div>

    <div class="step"><div>
      <h4>Break it on purpose, then fix it</h4>
      <p>Run once with three test orders and the courier returning 503. You should see: Tolu's alert emails, a <b>Warning</b> status, and stored incomplete executions. Now switch webhook.site to return <b>201</b>. Within the next retry, the incomplete executions complete by themselves and the bookings appear.</p>
      <div class="stats">
        <div class="stat"><b>0</b><span>orders lost while the courier was down</span></div>
        <div class="stat"><b>1</b><span>alert per failed booking, with the reason</span></div>
        <div class="stat"><b>Auto</b><span>recovery when the courier came back</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Each module's failure is decided on purpose, by how much it matters.</li><li>Break with retries absorbs short outages without anyone acting.</li><li>Error routes turn failures into readable messages and logs.</li><li>Testing with a controllable fake proves recovery works.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Ignore on something that matters (payments, bookings).</li><li>Break without incomplete executions switched on.</li><li>Retrying errors that can never succeed (400, 401).</li><li>Resume with a dangerous default, like a price of 0.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 8 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I added error handling everywhere! Somehow things got worse. Explain these five.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>Glitch's setup</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Ignore on "Mark order Paid"</td><td>Some paid orders stayed "New"; customers got payment reminders.</td></tr>
        <tr><td>B</td><td>Resume on the price lookup, substitute price 0</td><td>Three orders went out at ₦0.</td></tr>
        <tr><td>C</td><td>Break with retries, on a 401 Unauthorized</td><td>Hundreds of retries, credits burned, still failing.</td></tr>
        <tr><td>D</td><td>Break added, incomplete executions setting left off</td><td>Failed runs couldn't be retried.</td></tr>
        <tr><td>E</td><td>No handlers and no notifications</td><td>The scenario was switched off after repeated errors; nobody noticed for two days.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> Ignore hides failures of important steps. Use Break with retries and an alert.</li>
        <li><b>B:</b> a dangerous substitute. Resume only with harmless defaults; for prices, Break and alert.</li>
        <li><b>C:</b> 401 means a bad key; retrying can't fix it. Alert and fix the credential.</li>
        <li><b>D:</b> Break needs incomplete executions enabled in scenario settings.</li>
        <li><b>E:</b> add handlers to external calls and turn on Make's error notifications.</li>
      </ol>
    </div></details>
  </div>
</section>

<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Decide what happens when each external call fails, before it fails.</li>
      <li>Ignore skips; Resume substitutes; Break retries later; Commit stops cleanly; Rollback undoes what it can.</li>
      <li>Break needs incomplete executions switched on; set a retry limit.</li>
      <li>Retry temporary errors (timeouts, 5xx, 429), not permanent ones (400, 401).</li>
      <li>Error routes should tell a person what broke, and log it.</li>
      <li>Test failures on purpose with a controllable fake.</li>
    </ol>

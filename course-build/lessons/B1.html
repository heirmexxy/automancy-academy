<!-- ============ BRIEF ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">THE CLIENT BRIEF</span><h2>What the Lead Machine must do</h2></div>
  <div class="concept">
    <div class="tablewrap"><table class="dt">
      <tbody>
        <tr><td><b>Input</b></td><td>The website's partner form sends each enquiry to a webhook: business name, business type, area, weekly budget (free text), start date, contact name, email, phone, message.</td></tr>
        <tr><td><b>Volume</b></td><td>About 60 enquiries a month, plus spam and tests.</td></tr>
        <tr><td><b>Speed</b></td><td>Every genuine lead gets a personalised acknowledgement within 15 minutes. Hot leads alert Tolu within 5 minutes.</td></tr>
        <tr><td><b>Scoring</b></td><td>Budget, business type, location and start date decide the tier (rules below). The AI reads and extracts; the score is calculated by rules, not guessed by AI.</td></tr>
        <tr><td><b>Follow-up</b></td><td>Warm leads who haven't replied after 3 days get one friendly follow-up. Nobody gets more than one.</td></tr>
        <tr><td><b>Record</b></td><td>Every lead is logged in a Leads sheet with its score, tier, status and dates.</td></tr>
        <tr><td><b>Must not</b></td><td>Quote prices or promise discounts in automatic emails. Email spam or test entries. Break the rules in 0.6.</td></tr>
        <tr><td><b>Budget</b></td><td>Keep the whole machine under about 500 Zapier tasks a month.</td></tr>
      </tbody>
    </table></div>
    <h3>Scoring rules</h3>
    <div class="tablewrap"><table class="dt" style="min-width:0">
      <thead><tr><th>Signal</th><th class="n">Points</th></tr></thead>
      <tbody>
        <tr><td>Weekly budget ₦200,000 or more / ₦100,000–199,999 / under ₦100,000 / not stated</td><td class="n">3 / 2 / 1 / 0</td></tr>
        <tr><td>Business type is hotel, caterer or restaurant</td><td class="n">2</td></tr>
        <tr><td>Area is inside the delivery zone (lookup table from 1.3)</td><td class="n">2</td></tr>
        <tr><td>Wants to start within 30 days</td><td class="n">1</td></tr>
        <tr><td><b>Tier:</b> 7–8 hot · 4–6 warm · 0–3 cold · spam flag → spam</td><td class="n">max 8</td></tr>
      </tbody>
    </table></div>
  </div>
</section>

  <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> Use this to find gaps, not to copy. If your design differs but passes the rubric, it's a good design.</div></div>

  <details class="reveal"><summary>D3 · Scoring code</summary><div>
<pre class="codebox"><span class="c">// Input Data: budget, type, zone, start_date, is_spam</span>
<span class="k">const</span> budget = Number(inputData.budget) || 0;
<span class="k">let</span> score = 0;
<span class="k">if</span> (budget &gt;= 200000) score += 3;
<span class="k">else if</span> (budget &gt;= 100000) score += 2;
<span class="k">else if</span> (budget &gt; 0) score += 1;

<span class="k">if</span> ([<span class="k">"hotel"</span>, <span class="k">"caterer"</span>, <span class="k">"restaurant"</span>].includes((inputData.type || <span class="k">""</span>).toLowerCase())) score += 2;
<span class="k">if</span> (inputData.zone === <span class="k">"inside"</span>) score += 2;

<span class="k">const</span> start = inputData.start_date ? <span class="k">new</span> Date(inputData.start_date) : <span class="k">null</span>;
<span class="k">const</span> days = start ? (start - <span class="k">new</span> Date()) / 86400000 : <span class="k">null</span>;
<span class="k">if</span> (days !== <span class="k">null</span> &amp;&amp; days &lt;= 30) score += 1;   <span class="c">// includes "now" and ASAP</span>

<span class="k">const</span> spam = String(inputData.is_spam).toLowerCase() === <span class="k">"true"</span>;
<span class="k">const</span> tier = spam ? <span class="k">"spam"</span> : score &gt;= 7 ? <span class="k">"hot"</span> : score &gt;= 4 ? <span class="k">"warm"</span> : <span class="k">"cold"</span>;
output = { score: spam ? 0 : score, tier };</pre>
    <p>For "ASAP" or "now", the AI step returns today's date, so the start counts as within 30 days.</p>
  </div></details>

  <details class="reveal"><summary>Curveball answers</summary><div>
    <ol>
      <li><b>Monthly and missing budgets:</b> the AI prompt converts monthly to weekly (÷ 4.33) and leaves missing values empty; the code's <code>Number(...) || 0</code> treats empty as 0.</li>
      <li><b>Tolu away:</b> keep a tiny <b>Settings</b> tab in the sheet with <code>alert_to</code> and <code>caller_name</code>. The hot path looks it up and uses those values, so switching back is one cell edit, not a Zap edit.</li>
      <li><b>Flood of fakes:</b> before the AI step, look up the Leads sheet for the same email in the last 24 hours; if found, filter out. Add a hidden "honeypot" field to the website form that real people never fill; if it has a value, filter out. Both stop the run before AI and email tasks are used.</li>
    </ol>
  </div></details>

  <details class="reveal"><summary>D7 · Rough task budget at 60 leads a month</summary><div>
    <div class="tablewrap"><table class="dt" style="min-width:0">
      <thead><tr><th>Part</th><th>Estimate</th></tr></thead>
      <tbody>

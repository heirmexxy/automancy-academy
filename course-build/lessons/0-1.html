    <h1>Think Like an Automator</h1>
    <div class="kicker"><span class="pill">≈ 90 minutes</span><span class="pill">100 XP</span><span class="pill">Guide: Bolt</span><span class="pill">No software needed</span></div>

<p class="lede">Before you build anything, you need to see work the way a machine would: as triggers, steps and outcomes. This module teaches you to find the work worth automating and prove it's worth the effort.</p>
<div class="outcomes">
  <div><b>01</b><span>Describe any automation as trigger → actions → outcome.</span></div>
  <div><b>02</b><span>Tell whether a task needs rules, AI, or an agent.</span></div>
  <div><b>03</b><span>Map a real process, including who does what and where it's handed off.</span></div>
  <div><b>04</b><span>Score and rank tasks, then pick your first three automations with a payback estimate.</span></div>
</div>

<!-- ============ PART 2: CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 15 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Every automation has three parts</h3>
    <p>A <b>trigger</b> is the event that starts it. <b>Actions</b> are the steps that run after. The <b>outcome</b> is the result a person cares about. If you can't name all three, you're not ready to build.</p>
    <figure class="fig"><svg viewBox="0 0 640 170" role="img" aria-label="Diagram: a new WhatsApp order triggers three actions (log in sheet, calculate total and reply, alert rider), producing the outcome of an order recorded, paid and delivered.">

      <rect x="10" y="50" width="130" height="70" rx="35" fill="var(--sun)" stroke="var(--ink)" stroke-width="2.5"/>
      <text x="75" y="80" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#13233A">TRIGGER</text>
      <text x="75" y="100" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="700" font-size="14" fill="#13233A">New order</text>
      <path d="M140 85 H182" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#a1)"/>
      <rect x="186" y="10" width="190" height="42" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="281" y="36" text-anchor="middle" font-family="Atkinson Hyperlegible,sans-serif" font-size="13" fill="var(--ink)">1 · Log it in the sheet</text>
      <rect x="186" y="64" width="190" height="42" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="281" y="90" text-anchor="middle" font-family="Atkinson Hyperlegible,sans-serif" font-size="13" fill="var(--ink)">2 · Reply with the total</text>
      <rect x="186" y="118" width="190" height="42" rx="10" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="281" y="144" text-anchor="middle" font-family="Atkinson Hyperlegible,sans-serif" font-size="13" fill="var(--ink)">3 · Alert the rider</text>
      <text x="281" y="6" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="var(--muted)"></text>
      <path d="M376 85 H436" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#a1)"/>

      <text x="535" y="72" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="#13233A">OUTCOME</text>
      <text x="535" y="94" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="700" font-size="14" fill="#13233A">Order recorded,</text>

    <div class="analogy"><b>Think of a bank standing order.</b> Trigger: the 1st of the month. Action: move ₦20,000 to your landlord. Outcome: rent paid, and you never had to remember.</div>
    <div class="vocab">
      <div><b>Trigger</b>The event that starts a run: a new message, a new row, a time of day.</div>
      <div><b>Action</b>One thing the automation does: create, update, send, calculate.</div>
      <div><b>Workflow</b>The whole chain. Zapier calls it a Zap, Make a scenario, n8n a workflow.</div>
      <div><b>Run</b>One time the workflow fires. 270 orders a week means 270 runs.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Rules, AI, or agent: use the simplest that works</h3>
    <p>Not every task needs AI. Pick the lowest level on this ladder that does the job. Each step up adds power, cost and ways to go wrong.</p>
    <figure class="fig"><svg viewBox="0 0 640 190" role="img" aria-label="A three-step ladder: rules automation, AI automation, and AI agent, each with a Harvest Lane example.">

      <text x="232" y="132" font-family="Atkinson Hyperlegible,sans-serif" font-size="11" fill="#fff">pepper, Tues" and turn it</text>

      <text x="442" y="82" font-family="Atkinson Hyperlegible,sans-serif" font-size="11" fill="var(--ink)">my order to Friday?" The agent</text>
      <text x="442" y="98" font-family="Atkinson Hyperlegible,sans-serif" font-size="11" fill="var(--ink)">decides which tools to use and</text>
      <text x="442" y="114" font-family="Atkinson Hyperlegible,sans-serif" font-size="11" fill="var(--ink)">in what order.</text>

    <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> If a rule can do it, don't wake me up. I'm slower, I cost money per message, and I sometimes guess. Save me for the messy parts.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Is the task FRIED? Then automate it</h3>
    <p>A task is a strong candidate when it matches most of these five signs. Check any task against them before scoring it.</p>
    <div class="fried">
      <div><b>F</b><span>Frequent</span><p>Happens daily or many times a week.</p></div>
      <div><b>R</b><span>Rule-describable</span><p>You can explain it to a new hire in a few sentences.</p></div>
      <div><b>I</b><span>Input is digital</span><p>The information already lives in an app, message or file.</p></div>
      <div><b>E</b><span>Errors cost money</span><p>Mistakes cause refunds, delays or angry customers.</p></div>
      <div><b>D</b><span>Dull</span><p>Nobody wants to do it and nobody learns from doing it.</p></div>
    </div>
    <div class="analogy"><b>A quick test:</b> "Copy every order into the notebook" is FRIED on all five. "Decide whether to give a loyal customer credit this month" fails R and D. It needs judgment and a relationship, so a person keeps it.</div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Map the process before you touch a tool</h3>
    <p>A process map lists every step from trigger to outcome, in order, with who does each one. A <b>swimlane</b> map gives each person or system its own row, so handoffs between people become visible. Handoffs are where orders get lost.</p>
    <figure class="fig"><svg viewBox="0 0 700 250" role="img" aria-label="Swimlane map of Harvest Lane's current order process across Customer, Tolu and Rider lanes, with handoffs marked.">

      <div><b>Write steps as verb + object</b>"Check payment", not "payment stuff".</div>
      <div><b>One start, one end</b>Start at the trigger; end at the outcome.</div>
      <div><b>Diamonds for decisions</b>Any yes/no question gets its own shape.</div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>The Automation Score</h3>
    <p>FRIED tells you <i>whether</i> a task is a candidate. The score tells you <i>which one first</i>. It weighs how much time a task eats, how much damage its mistakes do, and how hard it is to automate.</p>
    <div class="formula">Weighted minutes = <em>runs per week</em> × <em>minutes per run</em> × <em>error factor</em><br>Priority score   = weighted minutes ÷ <em>difficulty</em><br><br>error factor:  low ×1 · medium ×1.5 · high ×2<br>difficulty:    easy ÷1 · medium ÷2 · hard ÷3</div>
    <div class="analogy"><b>Worked row:</b> "Copy order into notebook" runs 270 times a week, takes 1 minute, and mistakes are costly (×2). Weighted minutes = 270 × 1 × 2 = 540. It's easy to replace (÷1), so priority = 540.</div>
    <p>Then check two more things the score can't see:</p>
    <div class="never">
      <div><b>Dependencies</b>Some steps can't be automated until an earlier one is. You can't auto-calculate an order the system can't read.</div>
      <div><b>A messy process</b>Automating chaos gives you faster chaos. Fix the steps first, then automate them.</div>
      <div><b>Relationship work</b>Negotiating, comforting, deciding on credit. Keep a person here and let automation prepare the facts.</div>
    </div>
  </div>
</section>

<!-- ============ PART 4: GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 25 MIN</span><h2>Solved problem: find Harvest Lane's first three automations</h2></div>
  <div class="prose"><p><b>The problem.</b> Tolu handles about 45 orders a day, six days a week (270 a week). The admin eats nearly four hours a day. Which three automations should come first, and are they worth it?</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Collect a week of real data</h4>
      <p>Bolt asks Tolu to keep a simple diary for one week: every admin step, how often it happens, and how long it takes. Guessing is fine for the first pass, but a real week beats a guess. Tolu also rates how bad a mistake is at each step, and Bolt rates how hard each step is to automate.</p>
    </div></div>

    <div class="step"><div>
      <h4>Score every step</h4>
      <p>Apply the formula from Card 5 to each row.</p>
      <div class="tablewrap"><table class="dt">

    <div class="step"><div>
      <h4>Check dependencies and redesign the input</h4>
      <p>A ranking alone would say "automate step 2 first". But step 2 (copy the order) needs the order in a clean shape, and step 1 (reading a messy WhatsApp message) is hard. Automating step 2 alone isn't possible.</p>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><p><b>The key move: change the input, not only the steps.</b> If customers order through a short order form (or a WhatsApp menu with fixed options), step 1 stops being hard. The order arrives already structured. Now steps 1, 2, 3 and 4 collapse into one automation. Later, in Module 0.5, AI will let Tolu accept free-text orders too.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Choose three and justify each</h4>
      <div class="picks">
        <div class="pickcard"><span class="lbl">AUTOMATION A · STEPS 1–4</span><h4>Order capture</h4><p>Order form → new row in the Orders sheet → total calculated by formula → automatic reply with total and bank details. Saves 675 min/week.</p></div>
        <div class="pickcard"><span class="lbl">AUTOMATION B · STEP 5</span><h4>Payment confirmation</h4><p>Use a payment link from a provider that sends a signal when money lands. The order row updates to "Paid" by itself. Saves 270 min/week. Built in Track 1–2.</p></div>
        <div class="pickcard"><span class="lbl">AUTOMATION C · STEP 7</span><h4>Stock update</h4><p>Rides on A's clean data: each paid order reduces stock per product. Saves 135 min/week, and ends overselling.</p></div>
      </div>
      <p><b>What stays manual, on purpose:</b> route planning (step 6) happens only six times a week and needs local judgment. The thank-you (step 8) and weekly summary (step 9) are easy quick wins to add once A exists, but they don't hurt enough to go first.</p>
    </div></div>

    <div class="step"><div>
      <h4>Estimate the payback</h4>
      <div class="stats">
        <div class="stat"><b>18 h</b><span>saved per week (1,080 of 1,358 minutes)</span></div>
        <div class="stat"><b>4.6 h</b><span>of admin left each week, down from 22.6 h</span></div>
        <div class="stat"><b>₦193,500</b><span>monthly value if Tolu's hour is worth ₦2,500 (18 × 2,500 × 4.3 weeks)</span></div>
      </div>
      <p>Tool costs for these three automations start at zero on free plans and stay small at this volume. Even if building them takes Tolu 20 hours of learning, the time pays back within the first two weeks. <i>Figures are illustrative; your Silver mission uses your own numbers.</i></p>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>It starts from measured pain, not from the tool.</li><li>The error factor puts costly mistakes first, not only slow tasks.</li><li>Checking dependencies turns a ranked list into a buildable plan.</li><li>Redesigning the input made the hardest step disappear.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Automating the most annoying task instead of the most costly one.</li><li>Mixing units (minutes per month for one row, per week for others).</li><li>Multiplying by difficulty instead of dividing.</li><li>Automating a step that only exists because of a bad earlier step.</li></ul></div>
  </div>
</section>

<!-- ============ TAKEAWAYS + DEEPER ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Every automation is trigger → actions → outcome.</li>
      <li>Use the simplest level that works: rules, then AI, then agents.</li>
      <li>If a task is FRIED (frequent, rule-describable, input digital, errors costly, dull), it's a candidate.</li>
      <li>Map what really happens, lane by lane. Handoffs are where work gets lost.</li>
      <li>Priority = runs × minutes × error factor ÷ difficulty, all per week.</li>
      <li>Check dependencies and fix the input before you automate.</li>
    </ol>
  </div>

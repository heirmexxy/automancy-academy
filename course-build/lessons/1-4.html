<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 20 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Catch Hook: give your Zap a doorbell</h3>
    <p><b>Webhooks by Zapier</b> gives a Zap its own unique URL. When any system sends an HTTP request to it (Module 0.2), the Zap runs instantly. It's how you connect anything that can send a webhook, even with no Zapier app.</p>
    <div class="vocab">
      <div><b>Catch Hook</b>Zapier reads the incoming data (JSON, form data or XML) and turns it into fields. Nested JSON is flattened with double underscores: <code>customer.phone</code> becomes <code>customer__phone</code>.</div>
      <div><b>Catch Raw Hook</b>Gives you the request exactly as sent, as one block of text, plus its headers. Useful when you want to parse and check the JSON yourself in code.</div>
      <div><b>Retrieve Poll</b>Checks a URL on a timer instead: polling, for systems that can't send webhooks.</div>
    </div>
    <div class="analogy"><b>Two gotchas from Zapier's docs:</b> the URL always replies "success" to the sender, even if your Zap is off or fails later, and a completely empty request is ignored. So the sender can't tell whether your Zap worked; you must alert on problems yourself.</div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Webhook actions: ring someone else's doorbell</h3>
    <p>The same app has actions (<b>POST</b>, <b>GET</b>, <b>PUT</b>, <b>Custom Request</b>) that send requests out. It's the HTTP step you practised in Hoppscotch, now inside a Zap: send a new order to a courier's system, a delivery app, or any API with no Zapier integration.</p>

  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Code by Zapier: a tiny program in one step</h3>
    <p>When Formatter can't do it, a <b>Code by Zapier</b> step can. It runs JavaScript (Node.js) or Python. You pass values in through <b>Input Data</b> (named fields you map from earlier steps), and your code sets an <code>output</code> object whose keys become pills for later steps.</p>
<pre class="codebox"><span class="c">// Input Data (set in the step): qty ← pill, price ← pill</span>
<span class="k">const</span> qty = Number(inputData.qty);      <span class="c">// inputs usually arrive as text</span>
<span class="k">const</span> price = Number(inputData.price);
<span class="k">const</span> lineTotal = qty * price;

output = { line_total: lineTotal, is_big: lineTotal &gt; 50000 };</pre>
    <div class="vocab">
      <div><b>inputData</b>Your named inputs: <code>inputData.qty</code>. Names are case-sensitive.</div>
      <div><b>Number()</b>Turns "12500" into 12500. Without it, <code>"25000" + "1500"</code> becomes <code>"250001500"</code>.</div>
      <div><b>output</b>An object (or list of objects). Each key becomes a field. Returning a list makes later steps run once per item, unless you wrap it in a <code>line_items</code> key.</div>
      <div><b>Limits</b>Code steps have run-time limits that vary by plan and can make only a couple of HTTP requests. Keep them small: calculate and check; let app steps do the talking.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Just enough JavaScript</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>You write</th><th>It means</th></tr></thead>
      <tbody>
        <tr><td><code>const total = 0;</code></td><td>A named value that won't be replaced. Use <code>let</code> if it will change.</td></tr>
        <tr><td><code>JSON.parse(text)</code></td><td>Turn JSON text into an object you can read with paths (0.3).</td></tr>
        <tr><td><code>order.items.map(it =&gt; …)</code></td><td>Do something to every item in a list and collect the results.</td></tr>
        <tr><td><code>if (qty &lt;= 0) errors.push("bad qty")</code></td><td>Check a condition and remember a problem.</td></tr>
        <tr><td><code>errors.join("; ")</code></td><td>Turn a list into one readable line of text.</td></tr>
      </tbody>
    </table></div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> You can ask me to write a Code step, and I'm good at it. Then test it with messy data, read every line, and never paste real keys or customer data into the chat. You're the one responsible for what runs.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Never trust the doorbell</h3>
    <p>Anyone who learns your webhook URL can send it anything, and anything a browser sends can be edited. Two habits protect you:</p>
    <div class="never">
      <div><b>Recalculate everything</b>Totals, fees, discounts: work them out again from quantities and your own prices. Treat a total sent from outside as a claim to check.</div>
      <div><b>Check a shared token</b>The website includes a secret token; the Code step rejects requests without it. Real payment providers go further and sign each webhook (Module 2.5).</div>
      <div><b>Alert on failure</b>Since the sender always sees "success", send invalid requests to Tolu instead of dropping them silently.</div>
    </div>
  </div>
</section>

<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 35 MIN</span><h2>Solved problem: website orders, checked and saved</h2></div>
  <div class="prose"><p><b>The goal.</b> The website sends each order as JSON to a Zap. The Zap checks the token, recalculates every total, and then either saves the order with its line items or alerts Tolu with the exact problems. You'll play the website using Hoppscotch, as in 0.2.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Create the doorbell</h4>
      <p>New Zap. Trigger: <b>Webhooks by Zapier · Catch Raw Hook</b>. Copy the URL Zapier gives you. Treat it like a key: share it only with the website's developer (0.6).</p>
    </div></div>

    <div class="step"><div>
      <h4>Ring it from Hoppscotch</h4>
      <p>Send a <b>POST</b> to the hook URL with <code>Content-Type: application/json</code> and this body, then click <b>Test trigger</b> in Zapier. The raw body and headers appear as fields.</p>
<pre class="codebox" id="hook-good-1-4">{
  "token": "hl-web-7Q2x",
  "order_id": "HL-0051",
  "customer": { "name": "Mrs Adebayo", "phone": "+2348031234567" },
  "items": [
    { "sku": "TOM-CRATE", "qty": 2, "unit_price": 12500 },
    { "sku": "PEP-TATASHE-L", "qty": 1, "unit_price": 9000 }
  ],
  "delivery_fee": 1500,
  "total": 35500
}</pre>
      <p style="font-size:.9rem;color:var(--muted)">In a real build, the website's server would send this, using prices from the same Products list, and the token would be a long random string kept out of the page's public code.</p>
    </div></div>

    <div class="step"><div>
      <h4>Write the Code step</h4>
      <p>Add <b>Code by Zapier · Run JavaScript</b>. In Input Data, add <code>raw</code> → the raw body pill, and <code>secret</code> → type <code>hl-web-7Q2x</code>. Then the code:</p>
<pre class="codebox"><span class="k">const</span> errors = [];
<span class="k">let</span> order;
<span class="k">try</span> { order = JSON.parse(inputData.raw); }
<span class="k">catch</span> (e) { order = {}; errors.push(<span class="k">"body is not valid JSON"</span>); }

<span class="k">if</span> (order.token !== inputData.secret) errors.push(<span class="k">"wrong or missing token"</span>);
<span class="k">if</span> (!order.customer || !order.customer.phone) errors.push(<span class="k">"missing phone"</span>);
<span class="k">if</span> (!Array.isArray(order.items) || order.items.length === 0) errors.push(<span class="k">"no items"</span>);

<span class="k">let</span> items_total = 0;
<span class="k">const</span> line_items = (order.items || []).map((it, i) =&gt; {
  <span class="k">const</span> qty = Number(it.qty), unit_price = Number(it.unit_price);
  <span class="k">if</span> (!(qty &gt; 0)) errors.push(`item ${i + 1}: bad qty`);
  <span class="k">if</span> (!(unit_price &gt; 0)) errors.push(`item ${i + 1}: bad price`);
  <span class="k">const</span> line_total = qty * unit_price;
  items_total += line_total;
  <span class="k">return</span> { order_id: order.order_id, sku: it.sku, qty, unit_price, line_total };
});

<span class="k">const</span> delivery_fee = Number(order.delivery_fee) || 0;
<span class="k">const</span> total = items_total + delivery_fee;
<span class="k">if</span> (order.total !== undefined &amp;&amp; Number(order.total) !== total)
  errors.push(`total mismatch: sent ${order.total}, calculated ${total}`);

output = {
  order_id: order.order_id || <span class="k">""</span>,
  phone: (order.customer || {}).phone || <span class="k">""</span>,
  valid: errors.length === 0,
  errors: errors.join(<span class="k">"; "</span>),
  items_total, delivery_fee, total,
  item_count: line_items.length,
  line_items    <span class="c">// wrapped in a key, so later steps run once, not once per item</span>
};</pre>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Where should prices come from?</b> Here the code checks that the maths adds up and nothing is zero or negative. For full protection, compare each <code>unit_price</code> with the Products sheet (a Lookup step per product, or the courier-style POST in the Gold mission). A mismatch means someone edited the price.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Try the code right here</h4>
      <p>This tester runs the same logic as the Code step on this page. Load a sample, or edit the JSON: change a price to 1, delete the token, make qty "two".</p>
      <div class="jsonlab" data-hooktest data-secret="hl-web-7Q2x">
        <div class="pathchips">
          <button type="button" data-sample="hook-good-1-4">Good order</button>
          <button type="button" data-sample="hook-bad1-1-4">Edited total</button>
          <button type="button" data-sample="hook-bad2-1-4">No token, bad qty</button>
          <button type="button" data-sample="hook-bad3-1-4">Broken JSON</button>
        </div>
        <label class="crit" for="hook-1-4-body">Request body</label>
        <textarea id="hook-1-4-body" spellcheck="false">{
  "token": "hl-web-7Q2x",
  "order_id": "HL-0051",
  "customer": { "name": "Mrs Adebayo", "phone": "+2348031234567" },
  "items": [
    { "sku": "TOM-CRATE", "qty": 2, "unit_price": 12500 },
    { "sku": "PEP-TATASHE-L", "qty": 1, "unit_price": 9000 }
  ],
  "delivery_fee": 1500,
  "total": 35500
}</textarea>
        <span class="jl-status"></span>
        <div class="jl-out"></div>
      </div>
<pre hidden id="hook-bad1-1-4">{
  "token": "hl-web-7Q2x",
  "order_id": "HL-0052",
  "customer": { "name": "G. Litch", "phone": "+2348000000000" },
  "items": [ { "sku": "TOM-CRATE", "qty": 10, "unit_price": 12500 } ],
  "delivery_fee": 1500,
  "total": 11
}</pre>
<pre hidden id="hook-bad2-1-4">{
  "order_id": "HL-0053",
  "customer": { "name": "Tunde" },
  "items": [ { "sku": "ONI-BAG", "qty": "two", "unit_price": 4000 } ],
  "delivery_fee": 1500
}</pre>
<pre hidden id="hook-bad3-1-4">{ "order_id": "HL-0054", "items": [ { "sku": "TOM-CRATE", "qty": 2, } ] </pre>
    </div></div>

    <div class="step"><div>
      <h4>Split valid from invalid</h4>
      <p>Add <b>Paths</b> (1.3). Branch A: <code>valid</code> · (Boolean) Is true → <b>Google Sheets · Create Spreadsheet Row</b> in Orders (order_id, phone, items_total, delivery_fee, total) → <b>Create Multiple Spreadsheet Rows</b> in Order_Items from <code>line_items</code>. Fallback branch: <b>Gmail · Send Email</b> to Tolu: "Rejected website order [order_id]: [errors]".</p>
    </div></div>

    <div class="step"><div>
      <h4>Test with bad requests, then publish</h4>
      <p>Send all four samples from Hoppscotch. The good one lands in both tabs; each bad one produces an alert naming its exact problems. Publish, and give the developer the URL and token.</p>
      <div class="stats">
        <div class="stat"><b>Instant</b><span>no 15-minute polling wait</span></div>
        <div class="stat"><b>₦1</b><span>orders rejected automatically</span></div>
        <div class="stat"><b>2 tabs</b><span>filled from one request (Orders and Order_Items)</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>A webhook connects a system with no Zapier app, instantly.</li><li>Parsing the raw body yourself lets you catch broken JSON.</li><li>Recalculating defeats edited prices and totals.</li><li>Every rejection reaches a person, with a reason.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Adding text values with <code>+</code> (they join instead of adding).</li><li>Forgetting to set <code>output</code>.</li><li>Returning a bare list, so later steps run once per item.</li><li>Publishing the hook URL in a public web page with no token check.</li></ul></div>
  </div>
</section>

  <div class="part-h"><span class="tag">PART 5 · 8 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I wrote four Code steps of my own. Each one "works" in a way you'll hate.</div></div>
<pre class="codebox"><span class="c">// A · total comes out as 250001500</span>
output = { total: inputData.subtotal + inputData.fee };

<span class="c">// B · the next step has no pills to map</span>
<span class="k">const</span> total = Number(inputData.qty) * Number(inputData.price);

<span class="c">// C · Sheets gets 3 separate Orders rows for one order with 3 items</span>
output = order.items.map(it =&gt; ({ sku: it.sku, qty: it.qty }));

<span class="c">// D · accepts an order for 10 crates at a total of ₦11</span>
output = { total: Number(order.total), valid: <span class="k">true</span> };</pre>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> inputs arrive as text, and <code>+</code> joins text. Use <code>Number(inputData.subtotal) + Number(inputData.fee)</code>.</li>
        <li><b>B:</b> the result is calculated but never put in <code>output</code>, so no fields come out.</li>
        <li><b>C:</b> returning a bare list makes every later step run once per item. Wrap it: <code>output = { line_items: [...] }</code>.</li>
        <li><b>D:</b> it trusts the total sent from outside and never recalculates. Always compute totals yourself.</li>
      </ol>
    </div></details>
  </div>
</section>

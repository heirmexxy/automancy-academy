<header class="lh">
  <div>
    <span class="eyebrow">Track 7 · CRM Implementation specialisation · Lesson 7.5</span>
    <h1>Integrations: Forms, Portals, WhatsApp, Email and Payments</h1>
    <div class="kicker"><span class="pill">≈ 2.5 hours</span><span class="pill">100 XP</span><span class="pill">Guides: Nodo and Echo</span><span class="pill">Tools: n8n, HubSpot or Zoho API (trial), WhatsApp Cloud API (test number), Paystack (test mode)</span></div>
  </div>
  <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#nodo"/></svg>
</header>
<p class="lede">A CRM only stays true if information flows into it without anyone typing. For Kora that means: website forms and property-portal enquiries arrive as deals; WhatsApp conversations and emails attach to the right contact; an acknowledgement goes out in minutes; and when a buyer pays the holding deposit on Paystack, the deal moves and the accounts team knows. This lesson is the integration layer: what to connect natively, what to build in n8n, and how to keep it secure, idempotent and within every platform's limits.</p>
<div class="outcomes">
  <div><b>01</b><span>Choose native integrations or middleware for each connection.</span></div>
  <div><b>02</b><span>Build an idempotent "upsert enquiry" integration from forms and portals.</span></div>
  <div><b>03</b><span>Connect WhatsApp and email to the CRM within each platform's rules.</span></div>
  <div><b>04</b><span>Sync payments safely, and monitor every integration.</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 55 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Native, marketplace app or middleware?</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Connection</th><th>Best first choice</th><th>Why</th></tr></thead>
      <tbody>
        <tr><td>Website forms</td><td>The CRM's own forms (embedded), or the form tool's native integration</td><td>Handles consent fields, tracking and duplicates out of the box</td></tr>
        <tr><td>Gmail / Outlook</td><td>Native inbox connection and logging</td><td>Emails attach to contacts automatically</td></tr>
        <tr><td>Property portals (email alerts)</td><td>n8n: parse the alert email, upsert</td><td>No native integration; the format is the portal's</td></tr>
        <tr><td>WhatsApp Business</td><td>A marketplace inbox app, or n8n with the Cloud API</td><td>Depends on budget and plan; both must follow WhatsApp's rules</td></tr>
        <tr><td>Paystack</td><td>n8n: verified webhook → CRM</td><td>Money events need signature checks and idempotency</td></tr>
      </tbody>
    </table></div>
    <div class="vocab">
      <div><b>Prefer native when it does the job</b>Fewer moving parts, supported by the vendor, survives you. Use middleware when native doesn't exist, can't apply your rules, or would cost an expensive tier just for one feature.</div>
      <div><b>Secrets live on the server</b>Private app tokens, API keys and webhook secrets go in n8n credentials or environment variables, never in a web page, a spreadsheet or a WhatsApp message (Glitch's mistake).</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>The upsert-enquiry pattern</h3>
    <p>Every source (form, portal, Instagram, WhatsApp) calls one sub-workflow, so the rules live in one place. You built a version of this in 5.9; here it handles a paid CRM with custom objects and routing.</p>
<pre class="codebox">Sub-workflow · KORA · Upsert enquiry (input: source, name, email,
phone, message, property_ref, consent, received_at, source_event_id)
1. Seen this source_event_id before? → stop (idempotent)
2. Normalise email and phone (same rules as 7.3)
3. Search contact by email, then phone → update or create
   (never overwrite a good value with a blank)
4. Find property by kora_ref (from the portal or form)
5. Open deal for this contact + property? → add a note : create deal
   in the right pipeline (Sales/Lettings) → routing (7.4) assigns owner
6. Log the message as a note/activity on the deal
7. Save source_event_id + CRM ids in the integration log</pre>
    <div class="vocab">
      <div><b>Idempotent</b>Running it twice with the same input changes nothing the second time. Portals resend; webhooks retry; people double-click. Without step 1, every retry creates a duplicate deal.</div>
      <div><b>Rate limits and retries</b>CRM APIs limit requests per second and per day; respect the vendor's published limits, batch where possible, and retry with a wait on "429 Too Many Requests" or 5xx errors.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>WhatsApp and email: history in the CRM, rules respected</h3>
    <div class="vocab">
      <div><b>Business number, not personal phones</b>To bring WhatsApp into the CRM, conversations must run through the business's WhatsApp Business Platform number (Cloud API or a provider), not agents' personal WhatsApp. Agree this change with the team early: it's the biggest adoption hurdle.</div>
      <div><b>The 24-hour window and templates</b>Free-form replies are allowed within 24 hours of the customer's last message. Outside it, only pre-approved templates (e.g. the enquiry acknowledgement, viewing reminders). Templates are charged per message; check Meta's current rates for Nigeria.</div>
      <div><b>Opt-in</b>Only message people who gave you their number for this purpose and agreed to WhatsApp contact; record it on the contact (the consent field from 7.2).</div>
      <div><b>Email</b>Connect each agent's inbox natively so sent and received emails log to the contact. Exclude private and personal mail by logging only to known contacts.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Integration lab: safe or unsafe?</h3>

    <div class="ident" data-pick="pk-7-5">
      <div data-o="items" style="display:grid;gap:8px"></div>
      <p class="mgoal" data-o="verdict" aria-live="polite"></p>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Payments and monitoring</h3>
    <div class="vocab">
      <div><b>Money moves deals, carefully</b>A holding deposit or rent payment on Paystack can move a deal and notify accounts. Verify the webhook signature, confirm the transaction with Paystack's API, match it to the deal by a reference you created (not by name or amount), and store the Paystack reference on the deal. Never let a payment event close a deal as Won on its own if the business needs a signed contract first.</div>
      <div><b>An integration log</b>One table: time, source, event ID, result (created/updated/skipped/error), CRM IDs, error message. It answers "did the enquiry from Mrs X arrive?" in seconds.</div>
      <div><b>Monitoring</b>An error workflow alerts you on failures; a daily check compares counts (portal emails received vs. deals created); a weekly look at the API usage page. Tokens expire and portals change their email format: you want to know the same day, not when an agent complains.</div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 50 MIN</span><h2>Solved problem: Kora's integration layer</h2></div>
  <div class="prose"><p><b>The goal.</b> Website and portal enquiries become owned deals within 5 minutes without anyone typing; WhatsApp and email history sits on the contact; a deposit paid on Paystack moves the deal and tells accounts; every event is logged and failures alert the same day.</p></div>
  <div class="steps">
    <div class="step"><div>
      <h4>KORA · Upsert enquiry (sub-workflow)</h4>
      <p>Built once, as in Card 2, with a <code>kora_integration_log</code> table (Supabase or Google Sheets). Inputs validated; CRM calls via a private app token (scopes: contacts, deals, custom objects; nothing else) stored in n8n credentials.</p>
    </div></div>
    <div class="step"><div>
      <h4>Sources</h4>
<pre class="codebox">Website form  → n8n Webhook (secret header) → Upsert enquiry
Portal alerts → Gmail Trigger (label "portal") → Code: parse
                (name, phone, email, listing ref, message)
                → Upsert enquiry (source_event_id = Gmail message id)
Instagram     → from Growth Desk 5.5 (already built) → Upsert enquiry
WhatsApp      → Cloud API webhook (signature checked) → find contact by
                phone → log message on contact/deal; new number → Upsert</pre>
    </div></div>
    <div class="step"><div>
      <h4>Acknowledge within minutes</h4>
      <p>When routing (7.4) sets the owner, n8n sends the approved WhatsApp template <i>enquiry_received</i> ("Hi {{1}}, thanks for your enquiry about {{2}}. {{3}} from Kora will call you shortly.") if the contact gave a phone and WhatsApp consent; otherwise an email from the agent's address.</p>
    </div></div>
    <div class="step"><div>
      <h4>Paystack deposit → deal</h4>
<pre class="codebox">Agent creates a Paystack payment link from the deal (n8n button):
  reference = KORA-{deal_id}-{timestamp}; stored on the deal
Paystack webhook → verify HMAC signature → GET /transaction/verify
→ status success and amount = expected? → move deal to
  "Legal and payment", set kora_deposit_ref, notify accounts
  (never set Won: Won needs the signed agreement)</pre>
    </div></div>
    <div class="step"><div>
      <h4>Monitor</h4>
      <p>Error workflow → Telegram alert to you and the office manager. 7:00 daily check: portal emails received yesterday vs. deals created from portals; mismatch → alert. Monthly: token expiry dates and API usage in the register.</p>
      <div class="stats">
        <div class="stat"><b>0</b><span>enquiries typed by hand</span></div>
        <div class="stat"><b>4 min</b><span>median enquiry → acknowledgement</span></div>
        <div class="stat"><b>1</b><span>place to look when something's missing</span></div>
      </div>
    </div></div>
  </div>
  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>One upsert, many sources: rules in one place.</li><li>Idempotent on event IDs, so retries are harmless.</li><li>Secrets only on the server, with narrow scopes.</li><li>Money events verified twice and matched by reference.</li><li>A log and a daily count catch silent failures.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Tokens in browser code or shared sheets.</li><li>Matching payments by name or amount.</li><li>Letting a payment mark a deal Won.</li><li>Messaging people outside WhatsApp's rules.</li><li>No alert when a portal changes its email format.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Everything's connected to everything. Isn't that the point?</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>A portal resent last week's alerts; 60 duplicate deals appeared.</td></tr>
        <tr><td>B</td><td>A fake webhook call moved a deal to "Legal and payment" with no money received.</td></tr>
        <tr><td>C</td><td>Since Tuesday, no portal enquiries have arrived in the CRM. Nobody noticed until Friday.</td></tr>
        <tr><td>D</td><td>The integration's token had full admin scopes "in case we need them later".</td></tr>
        <tr><td>E</td><td>A buyer's good email was replaced with a blank when they sent a WhatsApp from a new number.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> not idempotent. Store each source event ID and skip ones already processed.</li>
        <li><b>B:</b> no signature check and no server-side verification. Verify the HMAC and confirm the transaction with Paystack before moving anything.</li>
        <li><b>C:</b> the portal changed its email format and the parser silently failed. Alert on parse errors and compare daily counts.</li>
        <li><b>D:</b> excess privilege. Give tokens only the scopes they need; rotate on staff or contractor changes.</li>
        <li><b>E:</b> blind overwrite. Never replace a value with a blank; only fill gaps or update with verified newer data.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ TAKEAWAYS ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Native where it does the job; middleware where it doesn't or where rules must apply.</li>
      <li>One idempotent upsert sub-workflow for every source; never overwrite good data with blanks.</li>
      <li>Secrets on the server with narrow scopes; webhooks verified.</li>

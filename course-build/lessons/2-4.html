    <h1>Iterators &amp; Aggregators</h1>
    <div class="kicker"><span class="pill">≈ 100 minutes</span><span class="pill">100 XP</span><span class="pill">Guide: Weave</span><span class="pill">Tools: Make, Google Sheets, Gmail</span></div>

  <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#weave"/></svg>

<p class="lede">Real orders contain lists: three products, two crates of this, a bag of that. Today you learn Make's two most powerful moves: splitting one bundle into many (an iterator) and squeezing many bundles back into one (an aggregator). With them, you'll update stock item by item and send one tidy summary instead of forty alerts.</p>
<div class="outcomes">
  <div><b>01</b><span>Split an array into bundles with an iterator.</span></div>
  <div><b>02</b><span>Combine bundles with array, text and numeric aggregators.</span></div>
  <div><b>03</b><span>Set an aggregator's source module correctly, and group results.</span></div>
  <div><b>04</b><span>Avoid the stock bug that appears when one product shows up twice.</span></div>
</div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>The Iterator</h3>
    <p>The <b>Iterator</b> (under Flow control) takes an <b>array</b> and outputs one bundle per item. Each output bundle has the item's fields (sku, qty, unit_price), ready to map. Some app modules have iterating built in: a Gmail email with three attachments, for example, often already produces one bundle per attachment.</p>
    <div class="analogy"><b>It needs a real array.</b> If an order's items arrive as text ("tomato, onion"), split it first (<code>split()</code> from 2.2), or parse JSON text with <b>JSON · Parse JSON</b>. A single object isn't a list; the iterator can't split it.</div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Aggregators and the source module</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Aggregator</th><th>Output</th><th>Harvest Lane use</th></tr></thead>
      <tbody>
        <tr><td><b>Text aggregator</b></td><td>One block of text, one line per bundle</td><td>"2× Tomatoes · ₦25,000" lines for an email</td></tr>
        <tr><td><b>Numeric aggregator</b></td><td>One number: SUM, AVG, COUNT, MAX or MIN</td><td>Today's total sales; number of orders</td></tr>
        <tr><td><b>Array aggregator</b></td><td>One array built from the bundles' fields</td><td>A clean items list to send to another API</td></tr>
        <tr><td><b>Table aggregator</b></td><td>Text laid out as a table</td><td>A simple table in an email</td></tr>
      </tbody>
    </table></div>
    <p>Every aggregator has a <b>Source module</b>: the module whose bundles it collects. Set it to the iterator (to combine one order's items) or to the search/trigger (to combine all orders in the run). A wrong source module is the most common aggregator bug.</p>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#weave"/></svg><div class="bubble"><b>Weave:</b> Aggregators also have <b>Group by</b>. Group today's items by sku and a numeric aggregator gives one bundle per product: "TOM-CRATE: 14 crates, ONI-BAG: 9 bags". That's Tolu's restocking list, for free.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>The duplicate-item trap</h3>
    <p>Imagine one order lists tomatoes twice (two lines, 2 crates and 1 crate). The iterator makes two bundles. For each, you look up the stock (12) and write 12 − qty. The first writes 10; the second also reads… 12 (or the old value, depending on timing) and writes 11. You've lost a crate.</p>
    <div class="never">
      <div><b>Group first</b>Aggregate by sku, summing qty, before updating stock: one update per product.</div>
      <div><b>Keep a movements log</b>Instead of overwriting stock, add a row per item to a Stock_Movements tab and let a SUMIFS formula calculate current stock (0.4).</div>
      <div><b>Test the edge case</b>Always include an order with a repeated product in your tests.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>What it costs</h3>
    <p>Modules between the iterator and aggregator run once per item, so they use credits per item. A 3-item order that updates stock uses about 3 credits for the updates, plus the search, iterator and aggregator modules. That's why grouping by sku and a movements log can save both errors <i>and</i> credits. Check exact counts in scenario history; Make's help centre lists which modules are free.</p>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 35 MIN</span><h2>Solved problem: stock that updates itself, and one 6 p.m. summary</h2></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Part A · Set up a movements log (the safe way to track stock)</h4>
      <p>Add a <b>Stock_Movements</b> tab: <code>date</code>, <code>order_id</code>, <code>sku</code>, <code>qty_change</code> (negative for sales, positive for deliveries from suppliers). In Products, make <code>stock_qty</code> a formula: <code>=opening_stock + SUMIFS(Stock_Movements!D:D, Stock_Movements!C:C, A2)</code>. Now stock can never be overwritten by a race; every change is a new row.</p>
    </div></div>

    <div class="step"><div>
      <h4>Part A · Split each paid order into items</h4>
      <p>Trigger: <b>Google Sheets · Watch New Rows</b> on Order_Items is simplest if your items are already rows (0.4). If orders arrive as JSON from the website (1.4), use <b>Webhooks · Custom webhook</b> → <b>Iterator</b> on <code>items</code>. Either way you now have one bundle per item.</p>
    </div></div>

    <div class="step"><div>
      <h4>Part A · One movement row per item</h4>
      <p>Add <b>Google Sheets · Add a Row</b> to Stock_Movements: date <code>{{formatDate(now; "YYYY-MM-DD")}}</code>, order_id, sku, qty_change <code>{{-1 * 2.qty}}</code>. A 3-item order adds three rows, and stock updates through the formula.</p>
    </div></div>

    <div class="step"><div>
      <h4>Part A · Aggregate into one confirmation</h4>
      <p>Add <b>Tools · Text aggregator</b>. Source module: the <b>Iterator</b>. Text per bundle: <code>{{2.qty}}× {{2.name}} · ₦{{formatNumber(2.qty * 2.unit_price; 0; "."; ",")}}</code>. Row separator: new line. Then one <b>Gmail · Send</b> with the aggregated text: one email per order, listing every item.</p>
    </div></div>

    <div class="step"><div>
      <h4>Part B · The 6 p.m. summary</h4>
      <p>New scenario, scheduled daily at 18:00. <b>Google Sheets · Search Rows</b> in Orders where created_at is today. Then two aggregators, both with the search as source module:</p>
      <div class="tablewrap"><table class="dt" style="min-width:0"><thead><tr><th>Aggregator</th><th>Settings</th><th>Result</th></tr></thead><tbody>
        <tr><td>Numeric aggregator</td><td>Function: SUM · Value: total</td><td>Today's sales, e.g. 412500</td></tr>
        <tr><td>Text aggregator</td><td>Text: <code>{{1.order_id}} · {{1.customer_name}} · ₦{{formatNumber(1.total; 0; "."; ",")}}</code></td><td>One line per order</td></tr>
      </tbody></table></div>
      <p>Send one email: "Today: 17 orders · ₦412,500" followed by the list. (Count the orders with a second numeric aggregator using COUNT, or with <code>length()</code> on an array aggregator.) This fixes Glitch's forty alerts from 2.1.</p>
    </div></div>

    <div class="step"><div>
      <h4>Test with the duplicate-item order</h4>
      <p>Send an order containing tomatoes twice (2 crates and 1 crate). Check Stock_Movements: two rows, −2 and −1. Check Products: stock dropped by exactly 3. The movements log handled the edge case that would break an overwrite design.</p>
      <div class="stats">
        <div class="stat"><b>3</b><span>movement rows for a 3-item order</span></div>
        <div class="stat"><b>1</b><span>confirmation email per order</span></div>
        <div class="stat"><b>1</b><span>summary email a day, instead of 40 alerts</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>The iterator lets each item be handled on its own.</li><li>Aggregators turn many results into one readable message.</li><li>A movements log can't lose updates, and keeps full history.</li><li>A daily summary replaces a stream of interruptions.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Aggregator source module set to the wrong module.</li><li>Overwriting stock from inside an iterator.</li><li>Summing a currency-formatted field.</li><li>Iterating over text that isn't an array.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 8 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Five complaints from my version. Iterators are easy, right?</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Mrs Adebayo's confirmation lists Mr Okafor's onions too.</td></tr>
        <tr><td>B</td><td>The iterator outputs one bundle containing "tomato, onion, pepper".</td></tr>
        <tr><td>C</td><td>Each customer gets three confirmation emails, one per item.</td></tr>
        <tr><td>D</td><td>The daily sales total is 0.</td></tr>
        <tr><td>E</td><td>After a "tomato twice" order, stock only dropped by 1 instead of 3.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> the text aggregator's source module is the trigger/search, so it collects items from every order in the run. Set it to the iterator.</li>
        <li><b>B:</b> the items were text, not an array. Split the text (or parse the JSON) before the iterator.</li>
        <li><b>C:</b> no aggregator; the email module sits inside the iterated section.</li>
        <li><b>D:</b> the numeric aggregator sums a text field like "₦12,500". Sum the plain number.</li>
        <li><b>E:</b> stock was overwritten per item and the second write used a stale value. Use a movements log, or group by sku first.</li>
      </ol>
    </div></details>
  </div>
</section>

    <div class="q" data-ans="b"><p>1. An order bundle has an items array with 4 products. What does an Iterator output?</p><div class="opts">
      <button type="button" data-opt="a">1 bundle</button><button type="button" data-opt="b">4 bundles, one per item</button><button type="button" data-opt="c">4 arrays</button><button type="button" data-opt="d">An error</button></div>

    <div class="q" data-ans="d"><p>2. A confirmation email mixes items from different customers. What's wrong?</p><div class="opts">
      <button type="button" data-opt="a">The iterator is missing</button><button type="button" data-opt="b">The email module is broken</button><button type="button" data-opt="c">The schedule is wrong</button><button type="button" data-opt="d">The aggregator's source module collects the whole run, not one order's iterator</button></div>
      <p class="fb" hidden data-why="The source module decides which bundles are combined."></p></div>
    <div class="q" data-ans="a"><p>3. Which aggregator gives today's total sales as one number?</p><div class="opts">
      <button type="button" data-opt="a">Numeric aggregator with SUM</button><button type="button" data-opt="b">Text aggregator</button><button type="button" data-opt="c">Iterator</button><button type="button" data-opt="d">Router</button></div>

  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Iterator: one array in, one bundle per item out.</li>
      <li>Aggregators squeeze bundles back into one: text, numeric, array, table.</li>
      <li>The source module decides what gets combined. Check it first when results look mixed up.</li>
      <li>Group by turns a list into per-product (or per-anything) totals.</li>
      <li>Append movements instead of overwriting totals.</li>
      <li>Everything inside the accordion runs, and costs, once per item.</li>

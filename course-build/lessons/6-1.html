<p class="lede">Building is now the easy part. The hard part, and the part clients pay for, is finding the right problem, measuring what it costs, and agreeing exactly what you'll deliver. This module turns a friendly "can you do this for me?" into a discovery call, a process map, a money case and a scope document that protects both you and the client.</p>
<div class="outcomes">
  <div><b>01</b><span>Run a 30-minute discovery call that finds the real process and its cost.</span></div>
  <div><b>02</b><span>Map a process before and after automation, and calculate time, errors and payback.</span></div>
  <div><b>03</b><span>Write a one-to-two-page scope with clear in-scope, out-of-scope and acceptance criteria.</span></div>
  <div><b>04</b><span>Spot projects to decline, and decline them politely.</span></div>
</div>

<section class="part" style="--c:#9FD3F7">

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>The 30-minute discovery call</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Minutes</th><th>Goal</th><th>Ask</th></tr></thead>
      <tbody>
        <tr><td>0–5</td><td>Context</td><td>"Tell me about the business: customers, staff, busiest days. What made you call now?"</td></tr>
        <tr><td>5–15</td><td>Find the pain</td><td>"Walk me through last Monday, hour by hour. Where did time go? What went wrong last week?"</td></tr>
        <tr><td>15–25</td><td>Dig into one process</td><td>"What starts it? Who does each step? Which apps? How often? How long? What happens when it goes wrong, and what does that cost?"</td></tr>
        <tr><td>25–30</td><td>Success and limits</td><td>"If this worked perfectly, what would be different in three months? What tools must stay? Who decides? What budget range is realistic?"</td></tr>
      </tbody>
    </table></div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#tolu"/></svg><div class="bubble"><b>Tolu:</b> Ask about last week, not "usually". People describe their ideal process; last Monday tells you the real one. And talk less than a third of the time.</div></div>
    <pre id="disc-6-1" class="codebox">DISCOVERY NOTES · [Business] · [Date]
Business: what they sell, customers, staff, channels, busiest days
Why now:
Week walk-through (where time goes, what went wrong):
Chosen process: trigger → steps → who → apps → how often → minutes each
Errors and their cost (₦, customers lost, complaints):
Data: where it lives, who owns it, any sensitive data (health, money)?
Success in 3 months (in their words):
Constraints: tools that must stay, budget range, decision-maker, deadline
Red flags:
Next step agreed:</pre>

  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Find the money</h3>
    <p>Owners buy outcomes, not workflows. Count three kinds of value: <b>time</b> saved (at what the time costs), <b>errors</b> avoided (stock-outs, expired stock, missed refills), and <b>revenue</b> gained (customers who come back). Use the client's own numbers from the call, and be conservative: only count the share of the task the automation really takes over.</p>
    <div class="tokcalc" data-roi>
      <h4>Okonkwo Pharmacy: refill reminders and reorder alerts</h4>
      <div class="row">
        <label>Hours a week on the task<input data-ro="hrs" type="number" value="12" min="0"></label>
        <label>Cost of an hour of staff time (₦)<input data-ro="rate" type="number" value="1500" min="0" step="100"></label>
        <label>Share the automation takes over (%)<input data-ro="auto" type="number" value="80" min="0" max="100"></label>
        <label>Costly errors a month (stock-outs, expiries)<input data-ro="errs" type="number" value="6" min="0"></label>
        <label>Average cost of one error (₦)<input data-ro="ecost" type="number" value="20000" min="0" step="1000"></label>
        <label>Extra sales a month from reminders (₦)<input data-ro="extra" type="number" value="80000" min="0" step="5000"></label>
        <label>One-off build price (₦)<input data-ro="build" type="number" value="450000" min="0" step="10000"></label>
        <label>Monthly running cost: hosting, AI, messages, support (₦)<input data-ro="run" type="number" value="30000" min="0" step="1000"></label>
      </div>
      <div class="stats">
        <div class="stat"><b data-o="val">–</b><span>value a month</span></div>
        <div class="stat"><b data-o="net">–</b><span>net a month, after running costs</span></div>
        <div class="stat"><b data-o="pb">–</b><span>payback</span></div>
        <div class="stat"><b data-o="y1">–</b><span>first-year net gain</span></div>
      </div>
      <p class="mgoal" data-o="verdict"></p>
      <p style="font-size:.84rem;color:var(--muted)">Example figures. Replace every number with the client's own, and write down where each came from.</p>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>The scope document</h3>
    <p>One to two pages, in plain words, signed before you build. Its most valuable section is the one beginners skip: <b>out of scope</b>.</p>
    <pre id="scope-6-1" class="codebox">SCOPE · [Project name] · v1 · [Date]
1. Background: the problem in the client's words, with the numbers from discovery
2. Goal and success measure: e.g. "No missed refill reminders; reminder time under 1 h/week"
3. In scope: each automation, its trigger and its output, in one line each
4. Out of scope: everything nearby you are NOT doing (e.g. stock app, staff rota,
   medical advice, WhatsApp marketing campaigns, more than 2 staff accounts)
5. Client provides: data access, WhatsApp business number and verification, a contact person,
   test time, consent wording approved by them
6. Deliverables: workflows, documentation, a 30-minute training session, a demo video
7. Timeline: milestones with dates (map sign-off → build → test → go-live)
8. Price and payment: setup fee, monthly fee, what the monthly fee covers, payment schedule
9. Acceptance: the tests that prove it's done (e.g. 20 test reminders sent and logged correctly)
10. Risks and assumptions: e.g. Meta verification delays, data quality in the notebook
11. Changes: new requests are quoted separately as a change request
12. Support: response times, what happens if the client changes their tools</pre>
    <div><button type="button" class="btn ghost" data-copy="scope-6-1">Copy the scope template</button></div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>When to say no</h3>
    <div class="sorter">
      <div class="sitem" data-ans="no"><span>"Can the AI tell customers which medicine to take for their symptoms?"</span><span class="sb"><button type="button" data-v="yes">Take it</button><button type="button" data-v="change">Reshape it</button><button type="button" data-v="no">Decline</button></span><span class="why" hidden data-t="Medical advice is for qualified professionals, and regulated. Decline that part clearly; offer reminders and admin help instead."></span></div>
      <div class="sitem" data-ans="change"><span>"Automate everything in the pharmacy" with a budget of ₦100,000.</span><span class="sb"><button type="button" data-v="yes">Take it</button><button type="button" data-v="change">Reshape it</button><button type="button" data-v="no">Decline</button></span><span class="why" hidden data-t="Reshape: pick the one process with the best payback that fits the budget, and do it well."></span></div>
      <div class="sitem" data-ans="yes"><span>Refill reminders for consenting customers, with a clear owner, data in a notebook she'll type into a sheet, and a realistic budget.</span><span class="sb"><button type="button" data-v="yes">Take it</button><button type="button" data-v="change">Reshape it</button><button type="button" data-v="no">Decline</button></span><span class="why" hidden data-t="Clear pain, clear owner, data available, consent handled, budget matches. A good first project."></span></div>
      <div class="sitem" data-ans="no"><span>"Scrape all the phone numbers from a competitor's Facebook page and WhatsApp them our prices."</span><span class="sb"><button type="button" data-v="yes">Take it</button><button type="button" data-v="change">Reshape it</button><button type="button" data-v="no">Decline</button></span><span class="why" hidden data-t="No consent, likely against platform terms and data protection law, and it damages the client's number. Decline."></span></div>
      <div class="sitem" data-ans="change"><span>"The process changes every week; we'll figure it out as you build."</span><span class="sb"><button type="button" data-v="yes">Take it</button><button type="button" data-v="change">Reshape it</button><button type="button" data-v="no">Decline</button></span><span class="why" hidden data-t="You can't automate a process that doesn't exist yet. Offer a short paid process-design session first."></span></div>
      <p class="qscore sscore" aria-live="polite"></p>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 45 MIN</span><h2>Solved problem: from call notes to signed scope</h2></div>
  <div class="prose"><p><b>The goal.</b> Turn Mrs Okonkwo's 30-minute call into a scope she can sign: one process, mapped, priced and bounded.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Sort the wish list</h4>
      <p>From her seven ideas, score each 1–5 on <b>pain</b> (time and money lost), <b>feasibility</b> (data available, clear rules) and <b>risk</b>. The AI doctor is declined outright. Refill reminders plus low-stock alerts score highest: about 12 hours a week, six costly errors a month, and customers lost to other pharmacies. The WhatsApp bot can be phase 2.</p>
    </div></div>

    <div class="step"><div>
      <h4>Confirm the numbers</h4>
      <p>From her notes: ~12 hours a week (two staff) on calls and stock checks; about six stock-outs or expiries a month at ~₦20,000 each; refill customers who don't return. With the Card 3 figures, the value is ≈ ₦238,000 a month, net ≈ ₦208,000 after running costs, so a ₦450,000 build pays back in a little over two months. Write the source of every number in the scope.</p>
    </div></div>

    <div class="step"><div>
      <h4>Write the scope</h4>
<pre class="codebox">SCOPE · Okonkwo Pharmacy: Refill & Stock Assistant · v1
Goal: no missed refill reminders or stock-outs on the top 40 items;
      staff time on both under 2 h/week.
In scope:
  1. Daily refill check: customers due in 3 days (from a shared sheet) →
     WhatsApp utility template: "Hello {{name}}, your refill at Okonkwo Pharmacy
     is due on {{date}}. Reply YES and we'll have it ready." (no medicine names)
  2. Replies logged; "YES" adds the customer to the pharmacist's prep list.
  3. Low-stock alert: daily, items below reorder level → WhatsApp to Mrs Okonkwo.
Out of scope: medical or dosage advice; a customer-facing chatbot (phase 2 option);
  supplier ordering; staff rota; marketing messages; any app.
Client provides: verified WhatsApp business number; customer list with consent;
  stock sheet kept up to date; 2 hours for testing.
Acceptance: 20 test reminders and 10 stock alerts correct; consent recorded for
  every customer messaged; training done.
Price: setup ₦450,000 (50% to start, 50% at go-live); ₦30,000/month for hosting,
  messages up to an agreed volume, monitoring and fixes. Changes quoted separately.</pre>
    </div></div>

    <div class="step"><div>
      <h4>Walk her through it, then sign</h4>
      <p>Book 20 minutes. Show the before-and-after map first, then the numbers, then the out-of-scope list ("so we're both clear what this isn't"). Ask her to name one more thing she expected; if it's not there, decide together: add it (with price) or put it in phase 2. Only then send the scope for signature and the first invoice (6.2).</p>
      <div class="stats">
        <div class="stat"><b>7 → 1</b><span>ideas narrowed to one strong project</span></div>
        <div class="stat"><b>~2 months</b><span>payback on the example numbers</span></div>
        <div class="stat"><b>6</b><span>things explicitly out of scope</span></div>
      </div>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Nodo's note:</b> the scope's acceptance tests are your evaluation set (4.9) in business language. Write them so you can run them, not just read them.</p></div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>It starts with last week's reality, not the wish list.</li><li>The money case uses the client's own numbers.</li><li>One process, done well, beats seven half-done.</li><li>Out-of-scope and acceptance tests prevent arguments later.</li><li>Sensitive data and regulated advice are handled up front.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Pitching tools before understanding the process.</li><li>Inflated savings the client doesn't believe.</li><li>No out-of-scope section.</li><li>Acceptance criteria like "works well".</li><li>Building before the client signs.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I wrote the pharmacy's scope while you were out. Five things went wrong.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Three weeks in, the client asks for the staff rota "since it was always part of automating the pharmacy".</td></tr>
        <tr><td>B</td><td>At handover, the client says "it doesn't work well enough" and won't pay the second half.</td></tr>
        <tr><td>C</td><td>Go-live slips by a month waiting for WhatsApp business verification.</td></tr>
        <tr><td>D</td><td>The proposal promised "₦2 million saved a year". The owner laughed and stopped reading.</td></tr>
        <tr><td>E</td><td>A reminder said "Your hypertension medicine is due". The customer was upset that her neighbour saw it.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> no out-of-scope section. List nearby items explicitly, and handle new ones as change requests.</li>
        <li><b>B:</b> vague acceptance criteria. Agree specific, testable criteria in the scope, and run them together at handover.</li>
        <li><b>C:</b> a client dependency wasn't listed or started early. Put "client provides" items and their deadlines in the scope, and start verification in week one.</li>
        <li><b>D:</b> numbers that weren't the client's own. Use her figures, be conservative, and show the working.</li>
        <li><b>E:</b> health details in a message. Keep reminders generic, get consent, and treat health data as sensitive by design.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ MISSIONS ============ -->
<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">PART 6 · 30 MIN+</span><h2>Missions</h2></div>

  <div class="mission">
    <span class="tier t-b">BRONZE · +25 XP</span>
    <h4>Interview one business owner</h4>
    <ul><li>Using the discovery template, interview a real small-business owner (a friend, family member or local shop) for 30 minutes about last week.</li><li>Draw one process as a before-and-after map.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>Your notes include at least three numbers in the owner's own words (time, frequency, cost), and the owner agrees your map is accurate.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-s">SILVER · +50 XP</span>
    <h4>Write a scope for one automation</h4>
    <ul><li>Turn the Bronze interview into a scope using the template: in scope, at least five out-of-scope items, client responsibilities, acceptance tests, timeline and price.</li><li>Add the payback calculation with your sources.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>A friend who wasn't on the call can read it and tell you exactly what will and won't be delivered, and how you'll prove it works.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-g">GOLD · +100 XP</span>
    <h4>Your reusable discovery kit</h4>
    <ul><li>Build a reusable kit: a questionnaire (a form the client fills in before the call), your call script, a map template, the payback sheet, and the scope template.</li><li>Automate it: when the form is submitted, n8n creates a notes doc from your template, books the call link, and emails you a pre-call summary.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>A test submission produces a filled notes document and a summary email without you touching anything.</li></ul>
  </div>
</section>

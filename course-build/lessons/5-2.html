<p class="lede">Every business wants more customers, and most cold outreach fails: it's generic, it goes to the wrong people, or it breaks a platform's rules and gets an account banned. In this lesson you build an agent that finds the right businesses from sources you're allowed to use, researches each one, scores the fit, and writes a short, true, personal message, which a person approves before anything is sent.</p>
<div class="outcomes">
  <div><b>01</b><span>Turn an ideal customer profile (ICP) into rules an agent can score against.</span></div>
  <div><b>02</b><span>Find leads from allowed sources, and know which sources will get you banned or fined.</span></div>
  <div><b>03</b><span>Research and personalise without inventing facts, and prove it in code.</span></div>
  <div><b>04</b><span>Send safely: human approval, daily caps, opt-outs and reply sorting.</span></div>
</div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Your ideal customer, written as rules</h3>
    <p>An agent can't prospect for "good customers". It can check rules. Write your ideal customer profile (ICP) so each line is something the agent can test against a source.</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Harvest Lane's ICP</th><th>Rule the agent checks</th><th>Where the answer comes from</th></tr></thead>
      <tbody>
        <tr><td>Busy kitchens</td><td>Google rating 4.0+ and 100+ reviews</td><td>Google Places API</td></tr>
        <tr><td>Cook every day, in volume</td><td>Offers delivery or office lunches</td><td>The business's own website</td></tr>
        <tr><td>Within our delivery zone</td><td>Address in Bodija, Mokola, Ring Road, Akobo, Dugbe…</td><td>Google Places API</td></tr>
        <tr><td>Restaurants, not bakeries (for now)</td><td>Category is restaurant</td><td>Google Places API</td></tr>
        <tr><td>Reachable the right way</td><td>A published business email, or a contact form</td><td>The business's own website</td></tr>
      </tbody>
    </table></div>
    <div class="vocab">
      <div><b>Fit score</b>Points for each rule met, calculated in code. AI can add reasons, but the score itself should be repeatable.</div>
      <div><b>Disqualifiers</b>Rules that rule a lead out completely, whatever the score: outside the zone, no allowed way to contact.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Where leads may come from, and where they may not</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Source</th><th>Allowed?</th><th>What to know</th></tr></thead>
      <tbody>
        <tr><td>Google Places API</td><td>Yes, within its terms</td><td>Search businesses by type and area. Its policies forbid keeping copies of Places content, except the place ID (store that, and fetch fresh details when you need them). Free monthly caps apply per field group; after that you pay per 1,000 calls.</td></tr>
        <tr><td>The business's own website</td><td>Yes</td><td>Public business information: menu, services, news, a published business email. Respect the site's terms and don't hammer it with requests.</td></tr>
        <tr><td>Directories, associations, events, referrals</td><td>Yes</td><td>Trade groups, market associations, event exhibitor lists and introductions from happy customers. Often the best leads of all.</td></tr>
        <tr><td>LinkedIn, by hand or with Sales Navigator</td><td>Yes, manually</td><td>Search and message from your own account, as a person. LinkedIn's paid Sales Navigator is built for this.</td></tr>
        <tr><td>Scraping LinkedIn or automating your account</td><td><b>No</b></td><td>LinkedIn's User Agreement (section 8.2) bans scrapers, bots and browser extensions that copy profiles or automate messages. Accounts get restricted or shut down.</td></tr>
        <tr><td>Bought or rented email lists</td><td><b>No</b></td><td>No one on them agreed to hear from you. Nigeria's data protection rules require consent for direct marketing, and bought lists wreck your sending reputation.</td></tr>
      </tbody>
    </table></div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>The rules that keep you safe</h3>
    <div class="vocab">
      <div><b>Consent and objection</b>Nigeria's Data Protection Act lets anyone object to direct marketing at any time, and the 2025 implementation directive (GAID) requires consent for direct marketing. A single, relevant message to a business's published business address, with an instant opt-out, is common B2B practice, but it's a grey area: never message personal emails or phones without consent, stop the moment someone objects, and take legal advice for client projects. This isn't legal advice.</div>
      <div><b>SMS and WhatsApp</b>Don't cold-message on either. Nigeria's NCC do-not-disturb service (text STOP to 2442) covers unsolicited SMS and calls, and WhatsApp business messaging needs the customer's opt-in (5.1).</div>
      <div><b>Sending limits</b>Free Gmail blocks you for up to 24 hours after more than 500 emails a day; Google Workspace allows about 2,000. For outreach, start at 20–30 a day from a separate sending domain or subdomain, so a mistake can't damage the business's main email.</div>
      <div><b>Suppression list</b>Everyone who says STOP, unsubscribes or bounces goes on it, and every send checks it first. No exceptions, no "one last follow-up".</div>
      <div><b>Truth</b>Every personal line must be a fact you found. An agent that flatters with invented details damages the brand faster than no outreach at all.</div>
    </div>
  </div>

<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 50 MIN</span><h2>Solved problem: Harvest Lane's prospecting agent</h2></div>
  <div class="prose"><p><b>The goal.</b> Find restaurants in Harvest Lane's delivery zone, research each one, score the fit, draft a short email that uses one true fact, get Tolu's approval on Telegram, send at most 20 a day, and sort the replies. Build it in n8n. Test with your own second email address before any real business sees it.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Set up the sheets</h4>
      <p><b>ICP</b> (one row per rule and its points), <b>Prospects</b> (<code>place_id, status, fit_score, reasons, fact, fact_source, draft, approved_at, sent_at, reply_type</code>) and <b>Suppression</b> (<code>email, reason, date</code>). Notice what's missing: no copied Google data. You keep the place ID and your own research.</p>
    </div></div>

    <div class="step"><div>
      <h4>Find: Google Places Text Search</h4>
      <p>An <b>HTTP Request</b> node, one call per area. The field mask decides what you pay for, so ask only for what you need:</p>
<pre class="codebox">POST https://places.googleapis.com/v1/places:searchText
X-Goog-Api-Key: {{ $credentials… }}            <span class="c">← Header Auth credential, never pasted</span>
X-Goog-FieldMask: places.id,places.displayName,places.rating,places.userRatingCount,places.websiteUri,places.formattedAddress

{ "textQuery": "restaurants in Bodija, Ibadan", "pageSize": 20 }</pre>
      <p>Rating, review count and website sit in a higher-priced field group than the ID alone. Check which group your mask triggers on Google's pricing page, and set a budget alert in Google Cloud before you start.</p>
    </div></div>

    <div class="step"><div>
      <h4>Research: read the website, extract facts</h4>
      <p>For each place with a website: <b>HTTP Request</b> (GET the home and menu pages, 2-second wait between businesses), <b>HTML</b> node to extract text, then an <b>Information Extractor</b> with this schema:</p>
<pre class="codebox">{ "offers_delivery": boolean, "office_lunch": boolean,
  "business_email": string | null,      <span class="c">← only an address published on the site</span>
  "fact": string | null,                <span class="c">← one specific, recent, true detail</span>
  "fact_quote": string | null }         <span class="c">← the exact words from the page</span></pre>
      <p>Then the most important node in the lesson, a <b>Code</b> node that checks the AI didn't invent anything:</p>
<pre class="codebox">const page = $('HTML').item.json.text.toLowerCase();
const q = ($json.fact_quote || '').toLowerCase().trim();
const verified = q.length > 12 &amp;&amp; page.includes(q);
return { ...$json, fact: verified ? $json.fact : null, fact_verified: verified };</pre>
    </div></div>

    <div class="step"><div>
      <h4>Score in code, not by feel</h4>
      <p>A Code node reads the ICP sheet and adds points: rating, reviews, delivery, office lunch, in-zone address. Disqualify when there's no published business email (send those to a "manual" list for a contact form or a call). Keep only <code>fit_score ≥ 60</code>. Same input, same score, every time.</p>
    </div></div>

    <div class="step"><div>
      <h4>Draft with guardrails</h4>
      <p>An AI step writes the email from the template, filling only <code>{{business}}</code> and <code>{{fact}}</code>. If <code>fact</code> is null, the instruction says to use a general line about kitchens in the area. Then a Code node lints the draft, like the lab in Card 4: word count, one question, no spam words, and it <i>appends</i> the opt-out and Harvest Lane's identity itself, so the AI can never forget them.</p>
    </div></div>

    <div class="step"><div>
      <h4>Approve on Telegram</h4>
      <p><b>Telegram · Send and Wait for Response</b> (you met it in 4.5): the business name, fit score, reasons, the fact with its source link, and the draft, with Approve, Edit and Skip buttons. Approved drafts get <code>status = approved</code>.</p>
    </div></div>

    <div class="step"><div>
      <h4>Send slowly, check the suppression list every time</h4>
      <p>A <b>Schedule Trigger</b> on weekdays at 9 a.m. takes up to 20 approved prospects. For each: look up the email in Suppression (skip if found), send with the <b>Gmail</b> node from the outreach subdomain, wait a random 3–9 minutes, log <code>sent_at</code>. One follow-up after 5 working days, only if there's no reply and no STOP.</p>
    </div></div>

    <div class="step"><div>
      <h4>Sort replies</h4>
      <p>A <b>Gmail Trigger</b> on the outreach inbox and a <b>Text Classifier</b>: <i>interested, not now, stop, out of office, bounce, other</i>. STOP and bounces go straight to Suppression. "Interested" sends Tolu a Telegram alert with the thread and a booking link to reply with. Every outcome updates the Prospects sheet.</p>
      <div class="stats">
        <div class="stat"><b>0</b><span>emails without Tolu's approval</span></div>
        <div class="stat"><b>20</b><span>maximum a day</span></div>
        <div class="stat"><b>1</b><span>reply to opt out, forever</span></div>
      </div>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><p><b>Sage's reminder:</b> this is the 4.5 pattern again. The agent proposes, a person disposes, and code enforces the limits the AI can't be trusted with.</p></div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Only allowed sources, so no account bans or policy problems.</li><li>Facts are verified against the page, so nothing is invented.</li><li>Scoring is code, so it's consistent and explainable.</li><li>A person approves every message before it goes.</li><li>Caps, a separate domain and a suppression list protect deliverability and people's choices.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Scraping LinkedIn or using "automation" extensions.</li><li>Buying lists.</li><li>Letting AI write compliments with no source.</li><li>Sending hundreds on day one from the main domain.</li><li>Follow-ups to people who said stop.</li><li>Keeping copies of Google Places data.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I ran Tolu's agent my way for one week. Here's what happened.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>An email said "Loved your Lagos branch!" to a restaurant that has never been to Lagos. The owner posted a screenshot.</td></tr>
        <tr><td>B</td><td>The agent sent 400 emails on Monday from Tolu's main address. By Wednesday, Harvest Lane's invoices were landing in customers' spam.</td></tr>
        <tr><td>C</td><td>A restaurant replied "STOP" on Tuesday and got a cheerful follow-up on Friday.</td></tr>
        <tr><td>D</td><td>Half the "leads" were owners' personal Gmail addresses collected by a LinkedIn browser extension.</td></tr>
        <tr><td>E</td><td>The Google Cloud bill was ten times the estimate. The field mask was <code>*</code>.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> no fact check. Make the extractor return the exact quote, verify it appears in the page text in code, and fall back to a general line when there's no verified fact.</li>
        <li><b>B:</b> no daily cap and the main domain used for outreach. Cap at 20–30 a day, send from a separate outreach subdomain, and grow slowly.</li>
        <li><b>C:</b> the suppression list wasn't checked before the follow-up. Check it before every single send, and put STOP replies on it instantly.</li>
        <li><b>D:</b> banned source and personal data. Delete them, remove the extension, and only use business addresses published by the business.</li>
        <li><b>E:</b> <code>*</code> requests every field, at the highest price group. List only the fields you need, and set a budget alert.</li>
      </ol>
    </div></details>
  </div>
</section>

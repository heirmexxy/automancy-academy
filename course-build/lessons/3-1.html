  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>n8n Cloud or self-hosted?</h3>
    <p>n8n comes two ways. <b>n8n Cloud</b>: n8n runs it for you and you pay a monthly plan. <b>Self-hosted Community Edition</b>: free, open software that you run on your own computer or a rented server. Either way n8n counts <b>executions</b>: <b>one execution is one complete run of a workflow, however many steps it has</b>.</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th></th><th>n8n Cloud</th><th>Self-hosted (Community)</th></tr></thead>
      <tbody>
        <tr><td>Who runs it</td><td>n8n</td><td>You</td></tr>
        <tr><td>Cost</td><td>Monthly plan with an execution allowance (as of Oct 2026, Starter is about €20 a month billed annually, a little more monthly, for 2,500 executions; the 14-day free trial gives Pro features capped at 1,000 executions)</td><td>Software free; you pay for the machine (a small server is a few dollars a month) and your time</td></tr>
        <tr><td>Executions</td><td>Limited by plan</td><td>Unlimited: only your server's power limits you</td></tr>
        <tr><td>Updates and backups</td><td>Done for you</td><td>Your job (Module 3.8)</td></tr>
        <tr><td>Connecting Google and similar apps</td><td>Usually simpler sign-in</td><td>You often create your own OAuth app first</td></tr>
        <tr><td>Best for</td><td>Getting started fast; teams without a tech person</td><td>High volume, data that must stay with you, learning how it really works</td></tr>
      </tbody>
    </table></div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><div class="bubble"><b>Nodo:</b> In this track, learn on your own laptop with Docker: it's free and teaches you the most. A laptop sleeps, though, so anything Harvest Lane relies on will move to Cloud or a server in 3.8. Check n8n's pricing page for current plans before you quote a client.</div></div>
  </div>

    <p>Docker runs software in a sealed box so it works the same on every computer. You only need five words:</p>

    <div class="vocab">
      <div><b>Image</b>A packaged, read-only copy of the software: <code>n8nio/n8n</code>.</div>
      <div><b>Container</b>A running copy of an image. You can stop, delete and recreate it.</div>
      <div><b>Volume</b>Storage that lives outside the container. n8n keeps its database, settings and encryption key in <code>/home/node/.n8n</code>, so that folder must be on a volume.</div>
      <div><b>Port</b>The door between your laptop and the container. <code>-p 5678:5678</code> means "laptop port 5678 leads to n8n's port 5678".</div>
      <div><b>Environment variable</b>A setting passed in with <code>-e</code>, such as the timezone.</div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>A tour of the editor</h3>
    <div class="vocab">
      <div><b>Canvas and nodes</b>Each step is a <b>node</b>, joined by connections. A workflow starts with a <b>trigger node</b> (Schedule, Webhook, Form, an app event), followed by action and logic nodes.</div>
      <div><b>The node panel</b>Open a node and you see three columns: <b>Input</b> (what arrived) · <b>Parameters</b> (settings) · <b>Output</b> (what it produced). Switch the data view between Schema, Table and JSON.</div>
      <div><b>Execute step / Execute workflow</b>Run one node, or the whole workflow, right now, with test data. Nothing goes live.</div>
      <div><b>Executions</b>The history of every run: when, success or error, and the data at each node. Your n8n version of Zap history.</div>
      <div><b>Fixed vs. Expression</b>Every field can be fixed text or an <b>expression</b> in <code>{{ }}</code> that pulls in data, such as <code>{{ $json.total }}</code>. Drag a field from the Input panel and n8n writes the expression for you. You'll master this in 3.2.</div>
      <div><b>Save vs. Publish</b>In n8n 2.x, <b>Save</b> stores your draft. <b>Publish</b> makes it the live version that runs on its own; <b>Unpublish</b> is in the ⋮ menu. (Older 1.x versions used an Active toggle instead.)</div>
    </div>
    <figure class="fig"><svg viewBox="0 0 620 130" role="img" aria-label="Save stores a draft that only runs when you click Execute. Publish makes it the live version that triggers run on their own.">

  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Credentials, and the phrasebook</h3>
    <p>A <b>credential</b> is a saved login or API key that nodes use. n8n stores credentials <b>encrypted</b> in its database, using an encryption key kept in the <code>.n8n</code> folder. Lose the volume and you lose both. Two rules: never type a key directly into a node field, and never share a workflow export that contains one (exports leave credentials out, but pasted keys go along).</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Zapier</th><th>Make</th><th>n8n</th></tr></thead>
      <tbody>
        <tr><td>Zap</td><td>Scenario</td><td>Workflow</td></tr>
        <tr><td>Step</td><td>Module</td><td>Node</td></tr>
        <tr><td>One run's data</td><td>Bundles</td><td>Items (3.2)</td></tr>
        <tr><td>Task per action</td><td>Credit per module, per bundle</td><td>Execution per whole run (Cloud); unlimited self-hosted</td></tr>
        <tr><td>Zap history</td><td>Scenario history</td><td>Executions</td></tr>
        <tr><td>Connected account</td><td>Connection, keychain</td><td>Credential</td></tr>
        <tr><td>Turn on / publish</td><td>Scheduling ON</td><td>Publish (2.x) · Active toggle (1.x)</td></tr>
      </tbody>
    </table></div>

<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 45 MIN</span><h2>Solved problem: the morning weather log</h2></div>
  <div class="prose"><p><b>The goal.</b> Rain changes Harvest Lane's day: riders need tarpaulins, deliveries run late and leafy vegetables sell differently. Every morning at 06:30, Ibadan's weather forecast should land in a Google Sheet, with a plain-language note for the riders. Four nodes: <b>Schedule → HTTP Request → Edit Fields → Google Sheets</b>. The weather comes from <b>Open-Meteo</b>, a forecast API that needs no key and is free for non-commercial use, which covers learning. Before a business relies on it, check Open-Meteo's terms; it offers a paid plan for commercial use.</p></div>

  <figure class="fig"><svg viewBox="0 0 640 140" role="img" aria-label="Four n8n nodes in a row: Schedule at 06:30, HTTP Request to Open-Meteo, Edit Fields to shape the data, Google Sheets append row.">
    <defs><marker id="dk3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--ink)"/></marker></defs>
    <g font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="13" text-anchor="middle">
      <rect x="10" y="30" width="125" height="70" rx="14" fill="var(--spark)" stroke="var(--ink)" stroke-width="2.5"/><text x="72" y="62" fill="#fff">Schedule</text>
      <rect x="170" y="30" width="125" height="70" rx="14" fill="var(--sky)" stroke="var(--ink)" stroke-width="2.5"/><text x="232" y="62" fill="#fff">HTTP Request</text>
      <rect x="330" y="30" width="125" height="70" rx="14" fill="var(--grape)" stroke="var(--ink)" stroke-width="2.5"/><text x="392" y="62" fill="#fff">Edit Fields</text>
      <rect x="490" y="30" width="140" height="70" rx="14" fill="var(--volt)" stroke="var(--ink)" stroke-width="2.5"/><text x="560" y="62" fill="#13233A">Google Sheets</text>
    </g>
    <g font-family="JetBrains Mono,monospace" font-size="10" text-anchor="middle">
      <text x="72" y="82" fill="#fff">daily 06:30</text><text x="232" y="82" fill="#fff">Open-Meteo</text><text x="392" y="82" fill="#fff">shape + advice</text><text x="560" y="82" fill="#13233A">append row</text>
    </g>
    <g stroke="var(--ink)" stroke-width="2.5"><path d="M136 65 H166" marker-end="url(#dk3)"/><path d="M296 65 H326" marker-end="url(#dk3)"/><path d="M456 65 H486" marker-end="url(#dk3)"/></g>
    <text x="320" y="128" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="var(--muted)">1 execution a day · ≈30 a month, whether it has 4 nodes or 40</text>
  </svg></figure>

  <div class="steps">
    <div class="step"><div>
      <h4>Start n8n and create the owner account</h4>
      <p>Install Docker Desktop and open it. In a terminal, run the two commands from Card 3 with Africa/Lagos selected and the volume ticked. When the log says the editor is accessible, open <code>http://localhost:5678</code> and create the owner account. This is a local login; use a strong password anyway. <i>No Docker?</i> Start an n8n Cloud trial instead and skip to the next step.</p>
    </div></div>

    <div class="step"><div>
      <h4>Add the Schedule Trigger</h4>
      <p>Create a workflow and name it <b>HL · Morning weather → Sheet</b>. Add <b>Schedule Trigger</b>: trigger interval <b>Days</b>, days between triggers 1, hour <b>6am</b>, minute <b>30</b>. Because you set <code>GENERIC_TIMEZONE</code>, that means 06:30 in Lagos. You can also set a timezone per workflow in its settings.</p>
    </div></div>

    <div class="step"><div>
      <h4>Call the weather API</h4>
      <p>Add <b>HTTP Request</b>. Method GET. URL:</p>
<pre class="codebox">https://api.open-meteo.com/v1/forecast?latitude=7.38&amp;longitude=3.94
  &amp;daily=temperature_2m_max,precipitation_sum,precipitation_probability_max
  &amp;timezone=Africa%2FLagos&amp;forecast_days=1</pre>
      <p>Paste it as one line. (You can also use the <b>Send Query Parameters</b> option to enter each one separately; it's tidier.) Click <b>Execute step</b> and switch the Output view to <b>JSON</b>. Something like this comes back:</p>
      <div class="jsonlab" data-jsonlab>
        <label class="crit" for="jl-3-1-a">Open-Meteo response (sample)</label>
        <textarea id="jl-3-1-a" spellcheck="false">{
  "latitude": 7.375,
  "longitude": 3.9375,
  "timezone": "Africa/Lagos",
  "daily_units": {
    "time": "iso8601",
    "temperature_2m_max": "°C",
    "precipitation_sum": "mm",
    "precipitation_probability_max": "%"
  },
  "daily": {
    "time": ["2026-10-05"],
    "temperature_2m_max": [30.4],
    "precipitation_sum": [5.3],
    "precipitation_probability_max": [78]
  }
}</textarea>
        <span class="jl-status"></span>
        <div class="pathchips"><button type="button" data-p="daily.time[0]">daily.time[0]</button><button type="button" data-p="daily.temperature_2m_max[0]">daily.temperature_2m_max[0]</button><button type="button" data-p="daily.precipitation_probability_max[0]">daily.precipitation_probability_max[0]</button><button type="button" data-p="daily.temperature_2m_max">daily.temperature_2m_max</button><button type="button" data-p="daily.temperature_2m_max[1]">daily.temperature_2m_max[1]</button></div>
        <label class="crit" for="jl-3-1-a-path">Path (in n8n, write it as <code>{{ $json.<i>path</i> }}</code>)</label>
        <input id="jl-3-1-a-path" type="text" value="daily.temperature_2m_max[0]" spellcheck="false">
        <div class="jl-out"></div>
      </div>
      <p>Notice that each daily value is a <b>list</b>, even with one day of forecast. You need <code>[0]</code> to get the number itself. (0.3's JSON skills, paying off.)</p>
    </div></div>

    <div class="step"><div>
      <h4>Shape the data with Edit Fields</h4>
      <p>Add <b>Edit Fields (Set)</b>. Mode: manual mapping. Add five fields. Switch each value to <b>Expression</b>:</p>
<pre class="codebox"><span class="k">date</span>         {{ $json.daily.time[0] }}
<span class="k">max_temp_c</span>   {{ $json.daily.temperature_2m_max[0] }}
<span class="k">rain_chance</span>  {{ $json.daily.precipitation_probability_max[0] }}
<span class="k">rain_mm</span>      {{ $json.daily.precipitation_sum[0] }}
<span class="k">advice</span>       {{ $json.daily.precipitation_probability_max[0] &gt;= 60
               ? "Rain likely: pack tarpaulins, start deliveries early"
               : "Dry day: normal routes" }}</pre>
      <p>Set the type of the number fields to Number. Execute the step: the Output shows one tidy item with five fields, which is exactly the row you want.</p>
    </div></div>

    <div class="step"><div>
      <h4>Connect Google and append the row</h4>
      <p>Create a sheet <b>HL Weather</b> with headers <code>date · max_temp_c · rain_chance · rain_mm · advice</code>. Add <b>Google Sheets · Append Row</b>. Create a credential:</p>
      <ul>
        <li><b>On n8n Cloud:</b> sign in with Google in the credential window.</li>
        <li><b>Self-hosted:</b> follow n8n's Google credential guide. You create an OAuth client in Google Cloud Console and paste in the <b>OAuth Redirect URL</b> that the n8n credential window shows (on your laptop it starts with <code>http://localhost:5678</code>). It takes about 15 minutes the first time, once per n8n install.</li>
      </ul>
      <p>Choose the spreadsheet and sheet, and set mapping to <b>Map Automatically</b>: because your field names match the headers exactly, n8n fills each column for you.</p>
    </div></div>

    <div class="step"><div>
      <h4>Test the whole thing, then publish</h4>
      <p>Click <b>Execute workflow</b>. A row appears in the sheet. Open <b>Executions</b> to see that test run listed. Now <b>Save</b>, then <b>Publish</b>. Tomorrow at 06:30, check Executions for a run that you didn't start, and a new row.</p>
      <div class="stats">
        <div class="stat"><b>30</b><span>n8n executions a month (1 a day)</span></div>
        <div class="stat"><b>≈90</b><span>Zapier tasks for the same job (3 actions × 30)</span></div>
        <div class="stat"><b>≈120</b><span>Make credits (4 modules × 30)</span></div>
      </div>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>The laptop catch:</b> on your own machine, the schedule only fires if Docker is running and the laptop is awake at 06:30. That's fine for learning. Harvest Lane's real workflows move to an always-on server or Cloud in 3.8.</p></div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>The volume and timezone are set before the first workflow, not fixed afterwards.</li><li>Execute step shows the real JSON, so the paths are read, not guessed.</li><li>Edit Fields shapes one clean item, so the Sheets node maps itself.</li><li>Publishing is a deliberate, final step, and Executions proves it ran.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Running Docker without a volume, then losing everything on restart.</li><li>Leaving the timezone at its default.</li><li>Typing <code>{{ }}</code> into a field left in Fixed mode.</li><li>Testing successfully and never publishing.</li><li>Relying on a sleeping laptop for a business-critical schedule.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Six sabotaged mornings in the Forge. Name the cause of each.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Every test passed on Monday. On Tuesday morning, Executions shows no runs at all.</td></tr>
        <tr><td>B</td><td>The weather row arrives every day at 11:30 instead of 06:30.</td></tr>
        <tr><td>C</td><td>After a laptop restart, n8n asks Tolu to create an owner account again. Every workflow is gone.</td></tr>
        <tr><td>D</td><td>The sheet's advice column literally says <code>{{ $json.daily.precipitation_probability_max[0] &gt;= 60 ? … }}</code>.</td></tr>
        <tr><td>E</td><td>Connecting Google fails with <code>redirect_uri_mismatch</code>.</td></tr>
        <tr><td>F</td><td>Max temperature shows <code>[30.4]</code>, in brackets, and Sheets treats it as text.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> the workflow was saved but never published. Only the published version runs on its own.</li>
        <li><b>B:</b> no timezone was set, so n8n used its default, America/New_York. Set <code>GENERIC_TIMEZONE</code> (and <code>TZ</code>), or set the workflow's timezone in its settings.</li>
        <li><b>C:</b> the container ran with <code>--rm</code> and no volume, so n8n's data was deleted with the container. Always mount <code>n8n_data</code> to <code>/home/node/.n8n</code>.</li>
        <li><b>D:</b> the field is in Fixed mode, so n8n wrote the text exactly as typed. Switch it to Expression.</li>
        <li><b>E:</b> the redirect URL saved in Google Cloud Console doesn't exactly match the OAuth Redirect URL shown in n8n's credential window. Copy it again, character for character.</li>
        <li><b>F:</b> the expression points at the list, <code>temperature_2m_max</code>, not the first value, <code>temperature_2m_max[0]</code>.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ TAKEAWAYS ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Workflow = nodes; n8n Cloud counts one execution per complete run.</li>
      <li>Self-hosted is free software, but you own uptime, updates and backups.</li>
      <li>Docker: always use a volume for <code>/home/node/.n8n</code>, and set the timezone.</li>
      <li>Execute step, read the JSON, then write the path, using <code>[0]</code> for lists.</li>
      <li>Keys go in credentials, never in fields.</li>
      <li>Save is a draft; Publish makes it live; Executions proves it ran.</li>
    </ol>
  </div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 35 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>The one-page case study</h3>
    <pre id="case-6-3" class="codebox">CASE STUDY · [Headline with the result: "Orders confirmed in 30 seconds, not 3 hours"]
Client: [type of business, city, size]  (name only with written permission)
The problem: [2–3 sentences in the client's words, with a number: hours, ₦, errors]
What I built: [3–5 bullets in plain language: what happens, not which nodes]
How it's safe: [1–2 lines: approvals, data handling, monitoring]
Results after [N weeks]: [2–4 numbers: time saved, errors cut, revenue, response time]
Client quote: ["…" with permission]
Stack: [n8n · Telegram · Google Sheets · Claude …]   Time to build: [days]
Demo: [link to 3-minute video]</pre>
    <div><button type="button" class="btn ghost" data-copy="case-6-3">Copy the case study template</button></div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#tolu"/></svg><div class="bubble"><b>Tolu:</b> Your proof-of-work logs already hold most of this. Course projects count too, labelled honestly as "built for a fictional business, Harvest Lane, with test data". Never invent a client or inflate a number. One true number beats five impressive guesses.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>The three-minute demo</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Time</th><th>Show</th></tr></thead>
      <tbody>
        <tr><td>0:00–0:30</td><td>The problem, from the customer's side ("Iya Basira sends an order at 9 p.m. and waits until morning")</td></tr>
        <tr><td>0:30–1:45</td><td>The solution working, from the customer's side: the phone, the reply, the confirmation</td></tr>
        <tr><td>1:45–2:30</td><td>Behind the scenes, briefly: the workflow, one safety feature (approval, error alert)</td></tr>
        <tr><td>2:30–3:00</td><td>The result in numbers, and one sentence on who this suits</td></tr>
      </tbody>
    </table></div>
    <p>Use test data and test accounts on screen. Zoom in on what matters; hide your email, tokens and other tabs. Record twice; send the better one.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>What a shareable template needs</h3>
    <div class="vocab">
      <div><b>No secrets</b>Platforms don't export credential secrets, but anything you typed into a field (a header token, a key in a URL) goes along.</div>
      <div><b>No personal data</b>Pinned test data travels inside an n8n workflow file. So do hard-coded emails, phone numbers and chat IDs.</div>
      <div><b>No hidden dependencies</b>Sheet IDs, sub-workflow IDs and webhook paths point at <i>your</i> accounts. Replace them with placeholders and explain them in the README.</div>
      <div><b>Sticky notes</b>Short notes on the canvas: what each section does, what to change.</div>
      <div><b>Tested on a fresh account</b>Import it into a clean n8n (or a new Make or Zapier account) and set it up from the README alone. Whatever you had to guess, add to the README.</div>
    </div>
    <p style="font-size:.88rem;color:var(--muted)">Each platform shares differently: n8n exports workflow JSON; Make exports a scenario blueprint; Zapier lets you share a copy of a Zap. The same rules apply to all three.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Try it: clean a workflow before sharing</h3>
    <p>Paste an exported n8n workflow (or use Glitch's sample). The checker finds common secrets and personal data, removes pinned data and shows a cleaned copy. Everything stays in your browser.</p>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>The README</h3>
    <pre id="readme-6-3" class="codebox"># [Template name]: [one-line outcome]
What it does: 3 bullets, in plain words
Who it's for: business type and size
You'll need: n8n version, accounts (Telegram bot, Google Sheet, AI provider…)

Setup (10–15 min):
  1. Import the workflow   2. Create credentials   3. Copy the sample sheet (link)
  4. Replace placeholders: &lt;YOUR_SHEET_ID&gt;, &lt;CHAT_ID&gt;…   5. Test with the sample data
  6. Publish

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 45 MIN</span><h2>Solved problem: Boss 3 as a sellable template</h2></div>
  <div class="prose"><p><b>The goal.</b> Turn the Telegram order bot into a package another business can buy and set up in 15 minutes: a clean workflow file, a sample sheet, a README, a setup video and a case study.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Generalise it</h4>
      <p>Duplicate the workflow. Rename "Harvest Lane" things to neutral names ("Your shop"). Move business settings (delivery fee, free-delivery threshold, 50-unit limit, Tolu's chat ID) into one <b>Edit Fields · Settings</b> node at the start, so buyers change them in one place. Add sticky notes for each section.</p>
    </div></div>

    <div class="step"><div>
      <h4>Clean it</h4>
      <p>Unpin all data. Move any typed-in key into a credential. Export, run the file through Card 4, and fix anything found at the source (not just in the file). Replace the sheet ID with <code>&lt;YOUR_SHEET_ID&gt;</code>. Read the final JSON once yourself.</p>
    </div></div>

    <div class="step"><div>
      <h4>Make a sample sheet</h4>
      <p>A Google Sheet with the Price_List, Customers, Pending and Orders tabs, ten fake products and two fake customers, shared as "anyone with the link can make a copy" (view-only for the original).</p>
    </div></div>

    <div class="step"><div>
      <h4>Test on a fresh account</h4>
      <p>Create a new n8n Cloud trial (or a fresh Docker volume), a new Telegram test bot and a copy of the sheet. Follow only the README. Time it. Each time you had to look something up, fix the README. Target: under 15 minutes.</p>
    </div></div>

    <div class="step"><div>
      <h4>Write the case study and record the demo</h4>
      <p>From your Boss 3 log: problem (Tolu pricing orders by hand at night), build (bot, pricing from the sheet, confirm buttons, daily report), safety (prices never from AI; big orders to a human), results (your test numbers, labelled as test results). Record the three-minute demo following Card 2.</p>
      <div class="stats">
        <div class="stat"><b>15 min</b><span>setup on a fresh account, from the README alone</span></div>
        <div class="stat"><b>0</b><span>secrets, phone numbers or pinned records in the file</span></div>
        <div class="stat"><b>5</b><span>pieces: workflow, sheet, README, video, case study</span></div>
      </div>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Nodo's tip:</b> put each template in its own GitHub repository (or folder) with the workflow file, README and changelog. When n8n changes something, you update once and every buyer gets the fix.</p></div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Clients see outcomes and numbers, not node diagrams.</li><li>Settings in one node make the template easy to adapt.</li><li>Cleaning at the source stops secrets returning in the next export.</li><li>A fresh-account test proves the README actually works.</li><li>Honest labels ("test data") build trust.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Screenshots of nodes as a portfolio.</li><li>Sharing exports with pinned customer data.</li><li>Keys typed into header fields.</li><li>READMEs written from memory, never tested.</li><li>Invented clients or numbers.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I helped publish your templates. Five surprises.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>A buyer imports the template and every request fails: it's calling your Paystack account with your key.</td></tr>
        <tr><td>B</td><td>A buyer emails: "Who is Funmi, and why is her order in my workflow?"</td></tr>
        <tr><td>C</td><td>The buyer's import errors: "Google Sheet not found".</td></tr>
        <tr><td>D</td><td>Three buyers asked the same setup question in the first week.</td></tr>
        <tr><td>E</td><td>A prospect asks to speak to the "pharmacy client" in your case study. There isn't one.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> a key typed into a header field travelled with the export. Revoke that key now, move it into a credential, re-export, and tell buyers which credential to create.</li>
        <li><b>B:</b> pinned test data with personal details shipped in the file. Unpin before export, and check with Card 4.</li>
        <li><b>C:</b> a hard-coded sheet ID pointing at your sheet. Use a placeholder and a copyable sample sheet, explained in the README.</li>
        <li><b>D:</b> the README wasn't tested on a fresh account. Add the answer, and test again.</li>
        <li><b>E:</b> an invented client. Remove it. Use real clients (with permission) or clearly labelled course projects.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ TAKEAWAYS ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Show outcomes: problem → build → result, with honest numbers.</li>
      <li>Three minutes of demo, customer's view first.</li>

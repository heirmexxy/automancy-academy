<p class="lede">Season finale. Over thirteen weeks you've built Harvest Lane's automations one at a time: order bots, payment checks, a support agent, reports, and the growth agents that bring customers in. Now they have to work as <i>one system</i>, across three platforms, watched by one set of alarms, explained in one handover pack, and proven with one set of numbers. Every guide shows up for this one. So does Glitch, and Glitch has brought friends.</p>

  <div><b>01</b><span>Design one system across n8n, Make and Zapier, with clear owners for every piece of data.</span></div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Design decisions, explained</h3>
    <p>A good capstone isn't the one with the most tools. It's the one where every choice has a reason you can say in one sentence. Here are the reference build's decisions.</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Decision</th><th>Choice</th><th>Why</th><th>Rejected, and why</th></tr></thead>
      <tbody>
        <tr><td>Where the core runs</td><td>Self-hosted n8n (Track 3)</td><td>High volume, AI agents, code where needed, predictable monthly cost</td><td>Everything in Zapier: costs rise with every task at this volume</td></tr>
        <tr><td>Bookkeeping export</td><td>Make scenario</td><td>The accountant already uses Make and maintains it herself</td><td>Moving it to n8n: saves little, removes her control</td></tr>
        <tr><td>Supplier sign-up form</td><td>Zapier</td><td>Tolu's assistant edits it without help; a few runs a month</td><td>A custom n8n form: only Nodo could change it</td></tr>
        <tr><td>Customer channel</td><td>WhatsApp</td><td>Where customers already are (5.1)</td><td>A web app: nobody would install it</td></tr>
        <tr><td>Staff and rider channel</td><td>Telegram bots</td><td>Free, quick to build, buttons for approvals</td><td>WhatsApp for staff: costs and template rules for internal messages</td></tr>
        <tr><td>Where AI is used</td><td>Reading messy messages; support answers; report wording</td><td>That's where language is messy</td><td>AI for prices, stock or payments: rules are exact and cheaper (Boss 3)</td></tr>
        <tr><td>Data home</td><td>Supabase (Postgres)</td><td>One source of truth, safe concurrent writes, vectors for support</td><td>Sheets as the database: fine at first, fragile at this volume; kept as read-only views for Tolu</td></tr>
        <tr><td>Human approval</td><td>Refunds, orders over ₦100,000, new bulk buyers</td><td>Money and new relationships need a person (4.5)</td><td>Full autonomy: one bad day costs more than the time saved</td></tr>
      </tbody>
    </table></div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#bolt"/></svg><div class="bubble"><b>Bolt:</b> Notice that two of the three platforms are chosen for <i>who maintains them</i>, not for features. The best tool is often the one the person in charge of it can fix on a Sunday.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Monitor outcomes, not only errors</h3>
    <p>An error workflow (3.6) catches the failures that <i>crash</i>. The dangerous failures don't crash: a workflow runs, shows green, and does the wrong thing. Watch the system in three layers.</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Layer</th><th>Catches</th><th>How, in the reference build</th></tr></thead>
      <tbody>
        <tr><td><b>1 · Errors</b></td><td>Nodes that fail</td><td>Every workflow (n8n, Make and Zapier) sends failures to one alert channel, with the order_id and a link to the execution.</td></tr>
        <tr><td><b>2 · Heartbeats</b></td><td>Workflows that silently stop running</td><td>Each workflow writes "last success" to the events table. A watchdog checks every 30 minutes: "Weekly report: expected every 7 days, last success 9 days ago."</td></tr>
        <tr><td><b>3 · Outcome checks</b></td><td>Green runs that do the wrong thing</td><td>Business sanity rules: paid orders ≈ payment events; 0 orders in a week is an alarm, not a report; more than 3 rejected payment signatures in 10 minutes is an alarm; stock can't go below zero.</td></tr>
      </tbody>
    </table></div>
    <p>Then send Tolu one short health message each morning. She should be able to read it in ten seconds and know whether today needs her:</p>
<pre class="codebox">☀️ Harvest Lane · health · Fri 07:30
Yesterday: 63 orders · 61 paid · 59 delivered · 2 refunds awaiting you
All 13 workflows ran on schedule ✓
CRM: 3 leads to call first · 1 deal going cold (Mama Put Express)
Watch: WhatsApp template "out_for_delivery" quality: medium ⚠️
AI spend this month: ₦18,400 of ₦40,000 cap
Nothing needs you before 10 a.m.</pre>
    <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Nodo's rule:</b> for every important workflow, ask "how would I know if this stopped doing its job, even though it didn't crash?" If the answer is "a customer would tell us", add an outcome check.</p></div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>The handover pack</h3>
    <p>A system only one person understands is a liability. The handover pack lets someone else run it: Tolu, her new operations hire, or another builder if you're unavailable. Write it for a smart person who wasn't there.</p>
    <div class="logbox">
<pre id="runbook-6-4">HARVEST LANE AUTOMATION · HANDOVER PACK · v1.0 · [date]

1. WHAT IT DOES (half a page)
   The system map (one picture) and one paragraph per workflow:
   trigger, what it does, what it writes, who owns it.

2. ACCOUNTS AND ACCESS
   Every account (n8n server, Make, Zapier, Meta/WhatsApp, Telegram bots,
   Supabase, Paystack, AI provider, domain): owner, login holder,
   where the password is kept (a password manager, never this document),
   billing date and monthly cost.

3. DAILY AND WEEKLY ROUTINE
   Morning health message: what each line means and when to act.
   Weekly: read the report, approve pending refunds, check AI spend.

4. WHEN SOMETHING BREAKS (one entry per known failure)
   Symptom → likely cause → what to check → fix → who to call.
   e.g. "Customers say they paid but no order" → Payments signature
   failures → events table, event=signature_rejected → check the
   Paystack secret in the n8n environment → re-verify pending orders.

5. CHANGES
   How to change a price, add a product, edit a WhatsApp template,
   add a rider. What NOT to change without the builder
   (column names, webhook URLs, the system message).

6. RECOVERY
   Backups: what, where, how often, how to restore (tested on [date]).
   Kill switch: how to pause the agent and fall back to manual orders.

7. CONTACTS AND LIMITS
   Builder and support terms (retainer, 6.2). Known limits, honestly.</pre>

    </div>

  </div>

    <div class="vocab">
      <div><b>1 · The problem (30 s)</b>One customer story and one number: "15 orders a week were lost because nobody replied in time."</div>

<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 3–5 HOURS</span><h2>Solved problem: the full reference build</h2></div>
  <div class="prose"><p><b>The goal.</b> A customer sends "2 baskets of tomatoes and 1 crate of eggs to Bodija" on WhatsApp. Within a minute they get a confirmed price and a Paystack link. When they pay, a rider gets the job on Telegram, the customer gets "out for delivery" and then "delivered", stock goes down, and the books update. Questions go to Sage Desk. Every Monday Tolu gets a report. When anything breaks, or quietly stops working, someone knows within 30 minutes. Most pieces you've already built; this is how they fit together.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Session 1 · Map and data contract</h4>
      <p>Draw the system map (Card 1) and create the Supabase tables. Write the contract before any workflow touches them.</p>
<pre class="codebox"><span class="c">-- orders: written by HL·02 (create) and HL·03 (paid). Everyone else reads.</span>
order_id text primary key   -- HL-0412
customer_id text, items jsonb, total_ngn int,
status text                 -- quoted · paid · dispatched · delivered · refunded
created_at timestamptz, paid_at timestamptz, paystack_ref text unique

<span class="c">-- events: every workflow appends, nobody edits</span>
at timestamptz default now(), workflow text, order_id text,
event text, detail jsonb    -- e.g. ('HL·03', 'HL-0412', 'paid', {"amount":19000})</pre>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#weave"/></svg><p><b>Weave's tip:</b> <code>paystack_ref unique</code> makes duplicate webhooks (6.2) impossible at the database level, a second safety net under your workflow check.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Session 1 · The core loop</h4>
      <ol>
        <li><b>HL·01 Intake</b> (WhatsApp Cloud API trigger, 5.1): log the message, then route. Order-like messages go to HL·02; questions to HL·05. A short classifier (3.7) decides, with "unsure" going to the agent that can ask.</li>
        <li><b>HL·02 Order agent</b> (Boss 3 and 4.2): AI extracts items into JSON; code prices them from <code>stock</code>; orders over ₦100,000 wait for Tolu. Creates the order, sends the Paystack link inside the 24-hour customer service window.</li>
        <li><b>HL·03 Payments</b> (2.5, 6.2): verify signature, verify the transaction, check the amount, mark paid, decrement stock in one database call, write <code>paid</code> to events.</li>
        <li><b>HL·04 Dispatch</b>: assign the nearest free rider (a simple zone table), Telegram the job with Accept/Delivered buttons, message the customer with an approved template (the 24-hour window may have closed by delivery time).</li>
      </ol>
      <p>Each workflow is a <b>sub-workflow</b> called by the one before (3.6), and each writes to events with the order_id.</p>
    </div></div>

    <div class="step"><div>
      <h4>Session 2 · Support and reporting</h4>
      <ul>
        <li><b>HL·05 Support</b>: Sage Desk from Boss 4, now with a <code>get_order</code> tool that reads the same orders table, so "where is my order?" is always current.</li>
        <li><b>HL·06 Weekly report</b> (Monday 07:00): SQL computes the numbers (orders, revenue, top products, late deliveries, refunds, AI spend). The AI only writes three sentences of commentary around numbers it's given, and is told not to change them. Email plus a Telegram summary.</li>
      </ul>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><p><b>Sage's rule:</b> code calculates, AI explains. A model asked to "summarise this week's sales" from raw rows will sometimes add them up wrong, confidently.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Session 2 · The cross-platform edges</h4>
      <ul>
        <li><b>HL·07 Books sync (Make)</b>: every evening, reads paid orders from a read-only Supabase view and creates sales entries in the accountant's tool (Track 2). It writes its own heartbeat to events through an n8n webhook.</li>
        <li><b>HL·08 Supplier form (Zapier)</b>: a new supplier submits the form; the Zap posts it to an n8n webhook with a shared secret header, which validates and stores it, and asks Tolu to approve (Track 1).</li>
      </ul>
      <p>Rules for every edge between platforms: a webhook with a secret header (2.5), a fixed JSON shape written in the contract, and the receiving side validates before trusting. Make and Zapier send their errors to the same alert channel as n8n: Make through an error-handler route (2.6), Zapier through its error notifications or a final webhook step.</p>
    </div></div>

    <div class="step"><div>
      <h4>Session 2 · The growth layer</h4>
      <ul>
        <li><b>HL·09 Social inbox</b> (5.5): comments and DMs on Facebook and Instagram are answered from the same price list, buyers get a private reply, and new leads land in the <code>customers</code> table with source and consent. Complaints hand over to Tolu.</li>
        <li><b>HL·10 Prospecting</b> (5.2): up to 20 approved outreach emails a day to restaurant kitchens, with the suppression list checked before every send.</li>
        <li><b>HL·11 Campaigns</b> (5.6): a weekly newsletter and a 60-day win-back sequence in Brevo, fed from paid orders in Supabase, from an authenticated domain.</li>
        <li><b>HL·12 CRM sync</b> (5.8, 5.9): every restaurant and hotel lead is upserted into HubSpot or Zoho free with company, contact, deal and source; scored; followed up with tasks; and a paid first order moves the contact to Customer. People move deal stages; the workflow never does.</li>
      </ul>
      <p>All four write to the events table with a <code>lead_id</code> or <code>order_id</code>, so you can trace a customer from first comment to first order. That's the number the investor will ask for.</p>
    </div></div>

    <div class="step"><div>
      <h4>Session 2 · The safety net</h4>
      <ol>
        <li><b>HL·00 Error workflow</b> (3.6), set on every n8n workflow: alert to Tolu's Telegram with workflow, node, order_id and execution link.</li>
        <li><b>Watchdog</b> (every 30 min): for each workflow, compare the last <code>success</code> event with its expected interval; alert if overdue.</li>
        <li><b>Outcome checks</b> (every 30 min): paid orders vs payment events; rejected signatures in the last 10 minutes; orders stuck in "paid" for over 2 hours without dispatch; stock below zero.</li>
        <li><b>Morning health message</b> at 07:30 (Card 3).</li>
        <li><b>Kill switch</b>: a row in a <code>settings</code> table (<code>agent_enabled</code>) that HL·01 checks; off means "a person will reply shortly" and every message goes to Tolu.</li>
      </ol>
    </div></div>

    <div class="step"><div>
      <h4>Session 3 · Test day, handover and demo</h4>
      <p>Run the end-to-end tests with test data and Paystack test mode, from two phones. Then write the handover pack and rehearse the 4-minute presentation.</p>
      <div class="logbox">
<pre id="e2e-6-4">#  | Test                                                    | Expected
1  | WhatsApp order: 2 tomatoes + 1 eggs to Bodija           | Quote + Paystack link < 1 min
2  | Pay (test card)                                         | Paid, stock down, rider job on Telegram
3  | Rider taps Accept, then Delivered                       | Customer gets both updates (template)
4  | Same Paystack event sent twice                          | Processed once
5  | Fake POST to the payment webhook                        | Rejected, logged, no order change
6  | Order of ₦150,000                                       | Waits for Tolu's approval
7  | "Where is HL-0412?" from the right / wrong number      | Status / politely refused
8  | Make books sync runs                                    | Entries match paid orders; heartbeat logged
9  | Zapier supplier form submitted                          | Stored after secret check; Tolu asked
10 | Turn off one workflow for 1 hour                        | Watchdog alert
11 | Rename a column in a test copy                          | Outcome check alerts; report not sent with zeros
12 | Kill switch on                                          | Holding reply; Tolu gets the messages
13 | Comment "how much for 2 baskets?" on Instagram           | Correct price, private reply, lead saved
14 | Reply STOP to a prospecting email                        | On suppression list; no follow-up
15 | Customer quiet for 60 days (test date)                   | Win-back email from the authenticated domain
16 | Hotel enquires on Instagram, then by email               | One company, contact and deal in the CRM; call-first list</pre>
        <div><button type="button" class="btn" data-copy="e2e-6-4">Copy template</button></div>
      </div>
      <div class="stats">
        <div class="stat"><b>&lt; 1 min</b><span>message to price and payment link</span></div>
        <div class="stat"><b>13</b><span>workflows on 3 platforms, one map</span></div>
        <div class="stat"><b>30 min</b><span>worst-case time to notice any failure</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this design works</h5><ul><li>Each platform is chosen for who maintains it, and each table has one owner.</li><li>One order_id and one events table make every order traceable.</li><li>AI handles language; code handles money, stock and numbers.</li><li>Three layers of monitoring catch crashes, silences and wrong answers.</li><li>A kill switch and a handover pack mean the business never depends on one person or one model.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Rebuilding everything on one platform to look impressive.</li><li>Two workflows writing the same table.</li><li>Only watching for errors.</li><li>Letting AI calculate the numbers in reports.</li><li>Secrets copied into several places, so a key change breaks one of them.</li><li>A demo with live keys or real customer data.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 20 MIN</span><h2>Glitch hunt: the incident room</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> It's Friday, 10 a.m. The investor arrives at noon. My friends and I broke three things. Here's the morning's feed. Only one of us set off an alarm.</div></div>
    <div class="incident" data-incident data-need="3">
<pre class="feed"><span class="k">TUE</span>        Weave's note: renamed orders column "created" → "created_at" for the books sync
<span class="k">THU</span>        Tolu's note: rotated the Paystack secret key after the 6.3 scare; updated the HTTP credential
<span class="k">FRI 07:00</span>  HL·06 Weekly report   ✓ success  rows read: 0
<span class="k">FRI 07:00</span>  HL·06 Weekly report   email sent: "Orders this week: 0 · Revenue: ₦0"
<span class="k">FRI 08:02</span>  HL·03 Payments        ✓ success  stopped at "Signature valid?" (false branch)
<span class="k">FRI 08:09</span>  HL·03 Payments        ✓ success  stopped at "Signature valid?" (false branch)
           … 14 more, all the same
<span class="w">FRI 08:30</span>  WhatsApp inbox        "I paid 40 minutes ago, where is my order?" ×6
<span class="e">FRI 08:41</span>  HL·00 ALERT           HL·04 Dispatch failed at "WhatsApp: send template"
                                 template out_for_delivery: status PAUSED
<span class="e">FRI 08:41</span>  HL·04 Dispatch        retry 1 ✗ · retry 2 ✗
<span class="k">FRI 09:05</span>  HL·02 Order agent     AI tokens today: 41,200 (cap 120,000) · promo day
<span class="w">FRI 09:12</span>  Rider bot (Telegram)  429 Too Many Requests → retry after 3 s → ✓
<span class="k">FRI 09:20</span>  WhatsApp inbox        "Rider was 25 minutes late, traffic on Iwo Road"</pre>
      <p><b>Tick exactly three root causes</b>, then check your diagnosis.</p>
      <div class="cands">
        <label data-real="1"><input type="checkbox"> The payment signature check still uses the old Paystack secret, so every real payment is rejected<span class="exp" hidden><b>Real.</b> Tolu updated the HTTP credential used to verify transactions, but the signature check reads the secret from somewhere else. Every genuine webhook fails the check and stops "successfully", so no error fires. Fix: keep the secret in one place (an n8n environment variable or one credential used by both steps), re-verify every order stuck at "quoted" with Paystack's verify endpoint, and add the outcome check "more than 3 rejected signatures in 10 minutes".</span></label>
        <label data-real="1"><input type="checkbox"> The WhatsApp "out_for_delivery" template was paused by Meta, so dispatch messages fail<span class="exp" hidden><b>Real, and the only one that raised an alarm.</b> Meta can pause a template whose quality rating drops (for example when customers block or report it). Fix: send riders' updates through a second approved template or a fallback channel, review the wording that's annoying customers, and add template quality to the morning health message.</span></label>
        <label data-real="1"><input type="checkbox"> The weekly report filters on the old "created" column, so it finds zero orders and reports ₦0<span class="exp" hidden><b>Real.</b> The rename broke the data contract. The report ran "successfully" and emailed nonsense, the week before an investor visit. Fix: update the report's query, add the outcome check "0 orders in a week means alert, don't send", and announce every column change to every workflow that reads the table.</span></label>
        <label><input type="checkbox"> The AI agent is using too many tokens because of the promo<span class="exp" hidden><b>Not a fault.</b> 41,200 tokens is well under the 120,000 cap on a busy promo day. That's the system doing its job, and a good line for the results slide.</span></label>
        <label><input type="checkbox"> Telegram is blocking the rider bot<span class="exp" hidden><b>Not a fault.</b> A 429 means "slow down"; the retry after 3 seconds worked. That's error handling (3.6) behaving as designed.</span></label>
        <label><input type="checkbox"> The rider is too slow, so customers think they haven't been charged<span class="exp" hidden><b>Not the cause.</b> One late delivery was traffic, an operations issue. The "I paid, where's my order?" messages come from payments never being marked paid, not from riders.</span></label>
        <label><input type="checkbox"> The n8n server is down<span class="exp" hidden><b>Not a fault.</b> Workflows kept running all morning. A down server would show no executions at all, and your uptime monitor (3.8) would alert.</span></label>
      </div>
      <div><button type="button" class="btn" data-incheck>Check my diagnosis</button></div>
      <p class="mgoal" data-o="verdict"></p>
    </div>
  </div>
</section>

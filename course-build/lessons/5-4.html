<header class="lh">
  <div>
    <span class="eyebrow">Track 5 · The Signal Tower (Growth) · Lesson 5.4</span>
    <h1>The Social Media Manager Agent</h1>
    <div class="kicker"><span class="pill">≈ 2 hours</span><span class="pill">100 XP</span><span class="pill">Guide: Echo</span><span class="pill">Tools: n8n or Make, Meta Graph API, LinkedIn, X API, TikTok, Google Sheets and Drive, Telegram, an AI model</span></div>
  </div>
  <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#echo"/></svg>
</header>
<p class="lede">Small businesses post when they remember, so their pages go quiet for weeks. In this lesson you build an agent that plans a content calendar from the business's real products and seasons, drafts a version of each post for each platform, waits for the owner's approval, publishes on schedule within each platform's rules, and reports what worked, so next week's plan is better.</p>
<div class="outcomes">
  <div><b>01</b><span>Turn goals, products and seasons into a content calendar an agent can work from.</span></div>
  <div><b>02</b><span>Know what each platform's API lets you publish, what it costs, and what needs approval.</span></div>
  <div><b>03</b><span>Adapt one idea into six platform-ready versions.</span></div>
  <div><b>04</b><span>Keep a person in charge: approval, brand voice, true prices and image rights.</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 35 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>A calendar built from the business, not from thin air</h3>
    <p>An agent writes good posts when it has real material. Give it <b>content pillars</b> (recurring themes) and the facts to fill them.</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Pillar</th><th>Fed by</th><th>Example</th></tr></thead>
      <tbody>
        <tr><td>Product of the week</td><td>Stock and price sheet</td><td>"Ugu is in season: ₦1,200 a bunch, delivered tomorrow morning."</td></tr>
        <tr><td>Behind the scenes</td><td>Tolu's phone photos in a Drive folder</td><td>5 a.m. at the farm, loading the van.</td></tr>
        <tr><td>Customer stories</td><td>Testimonials with written permission</td><td>A restaurant explains why they switched to Harvest Lane.</td></tr>
        <tr><td>Kitchen tips</td><td>A recipe list</td><td>Three ways to keep tomatoes fresh for a week.</td></tr>
        <tr><td>Offers and dates</td><td>A seasons-and-holidays sheet</td><td>Christmas pre-orders open on 1 December.</td></tr>
      </tbody>
    </table></div>
    <div class="vocab">
      <div><b>Cadence</b>Decide per platform: e.g. Instagram 4 a week, Facebook 3, LinkedIn 1, X daily, TikTok 2 videos, WhatsApp broadcast at most once a week to people who opted in.</div>
      <div><b>Brand voice</b>A one-page guide the agent always reads: tone, words to use and avoid, emoji rules, and claims it must never make (health promises, "cheapest in Ibadan").</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>What each platform lets an agent publish</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Platform</th><th>How</th><th>What to know</th></tr></thead>
      <tbody>
        <tr><td>Facebook Page</td><td>Meta Graph API (n8n Facebook Graph API node; Make Facebook Pages app)</td><td>Text, link, photo and video posts to a Page you manage.</td></tr>
        <tr><td>Instagram</td><td>Instagram API, Business or Creator account</td><td>Two steps: create a media container from a public image or video URL, then publish it. No text-only posts.</td></tr>
        <tr><td>LinkedIn Page</td><td>LinkedIn Posts API (n8n's LinkedIn node: Post → Create)</td><td>Posting as an organisation needs a page admin or content admin role.</td></tr>
        <tr><td>X</td><td>X API, pay per use (n8n's X node)</td><td>Each API post costs money: $0.015, or $0.20 if it contains a link (checked Oct 2026). Budget for it.</td></tr>
        <tr><td>TikTok</td><td>Content Posting API</td><td>Until TikTok audits your app, posts made through the API are private (only visible to the account). Many teams send drafts and publish from the app.</td></tr>
        <tr><td>WhatsApp</td><td>WhatsApp Cloud API (5.1)</td><td>Not a feed. Marketing messages go only to customers who opted in, as approved templates, and each one is charged.</td></tr>
      </tbody>
    </table></div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#echo"/></svg><div class="bubble"><b>Echo:</b> Platform rules and prices change. Read each platform's current docs before building for a client, and put the date you checked in your handover pack.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Post lab: one idea, six platforms</h3>
    <p>Glitch's post is below. Make it publishable everywhere you tick, without breaking any platform's rules. Write a separate short version for X, add the right media, and pick a sensible time.</p>
    <div class="postlab" data-postlab>
      <div class="two">
        <label class="fld">Main caption<textarea data-pl="base" spellcheck="false">Fresh tomatoes, tatashe and ugu straight from our farm in Ibadan to your kitchen every morning! 🍅🌶️ Order by 8 p.m. and it's at your door by 7 a.m. Restaurants: ask about weekly supply. #freshfood #ibadan #farmtotable #naija #tomatoes #pepper #ugu #organic #restaurant #chef #delivery #harvestlane</textarea></label>
        <label class="fld">Short version for X (optional)<textarea data-pl="xver" spellcheck="false" placeholder="Under 280 characters, 1–2 hashtags"></textarea></label>
      </div>
      <div class="ctl">
        <label>Media <select data-pl="media" aria-label="Media"><option value="none" selected>None</option><option value="photo">Photo</option><option value="video">Short video</option></select></label>
        <label>Link <input type="url" data-pl="link" value="https://harvestlane.example/order" aria-label="Link"></label>
        <label>Time <select data-pl="time" aria-label="Posting time"><option>03:00</option><option>07:00</option><option>12:30</option><option>18:00</option></select></label>
      </div>
      <div class="ctl" role="group" aria-label="Platforms">
        <label><input type="checkbox" data-pl="plat" value="facebook" checked> Facebook</label>
        <label><input type="checkbox" data-pl="plat" value="instagram" checked> Instagram</label>
        <label><input type="checkbox" data-pl="plat" value="linkedin" checked> LinkedIn</label>
        <label><input type="checkbox" data-pl="plat" value="x" checked> X</label>
        <label><input type="checkbox" data-pl="plat" value="tiktok" checked> TikTok</label>
        <label><input type="checkbox" data-pl="plat" value="whatsapp"> WhatsApp</label>
      </div>
      <div class="tablewrap"><table><tbody></tbody></table></div>
      <p class="mgoal" data-o="verdict"></p>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>A person stays in charge</h3>
    <div class="vocab">
      <div><b>Approval</b>Every post is approved before it's scheduled. Approve-all is fine once the owner trusts the agent, but the button stays.</div>
      <div><b>True facts only</b>Prices, stock and dates come from the sheet at publish time, not from the model's memory. If the price changed since approval, the post waits.</div>
      <div><b>Image rights</b>Use the business's own photos. People in photos (customers, staff) need permission. Don't pass off AI-generated images as real produce or real customers.</div>
      <div><b>Disclosure</b>Paid partnerships and sponsored posts must be labelled. Follow each platform's rules for branded content and AI-generated media.</div>
      <div><b>Pause button</b>A single setting that stops all scheduled posts, for bad news days, outages or national events.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Learn from results, every week</h3>
    <p>Each platform's insights API returns reach, engagement and clicks for your own posts. The agent stores them against each post and pillar, then next Friday's plan uses them:</p>
<pre class="codebox">Last week · 9 posts · best: "5 a.m. loading the van" (Instagram reel, 3× usual reach)
By pillar: behind the scenes ▲ · kitchen tips ● · offers ▼
Comments that became leads: 7 (see 5.5)
Plan change: two behind-the-scenes videos next week, one fewer offer post</pre>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 50 MIN</span><h2>Solved problem: Harvest Lane's posting week</h2></div>
  <div class="prose"><p><b>The goal.</b> Every Friday at 2 p.m., the agent drafts next week's posts from the calendar, the price sheet and last week's results. Tolu approves on Telegram. Approved posts publish at their scheduled times on each platform, and every Monday a short report shows what worked.</p></div>
  <div class="steps">
    <div class="step"><div>
      <h4>The sheets</h4>
      <p><b>Calendar</b> (<code>date, time, pillar, idea, platforms, media_file, status</code>), <b>Posts</b> (one row per platform version: <code>calendar_id, platform, caption, alt_text, status, approved_by, post_id, published_at</code>), <b>Brand voice</b> (one cell of rules) and the existing <b>Price list</b>.</p>
    </div></div>
    <div class="step"><div>
      <h4>Draft</h4>
      <p>Schedule Trigger (Fridays 14:00) → read next week's Calendar rows → for each, an AI step with the brand voice, the idea, the product's current price and stock, and last week's top posts. Structured output, one object per platform:</p>
<pre class="codebox">{ "platform": "instagram", "caption": "...", "hashtags": ["ibadanfood","farmtotable"],
  "alt_text": "Crates of tomatoes being loaded into a van at dawn",
  "uses_price": true }</pre>
      <p>A Code node checks each version against the platform's rules (the Card 3 checks) and the brand voice's banned phrases. Failures go back to the AI once, then to Tolu marked "needs edit".</p>
    </div></div>
    <div class="step"><div>
      <h4>Approve</h4>
      <p>Telegram: one message per calendar item showing each platform version and the photo, with Approve, Edit and Skip. Edits come back as a reply and replace the caption. Approved rows get <code>status = approved</code>.</p>
    </div></div>
    <div class="step"><div>
      <h4>Publish on time</h4>
      <p>A Schedule Trigger every 15 minutes picks approved posts that are due, checks the <code>posting_paused</code> setting, re-reads any price the post uses (and holds the post if it changed), then routes by platform:</p>
      <ul>
        <li><b>Facebook:</b> Graph API, POST a photo with a message to the Page.</li>
        <li><b>Instagram:</b> create a media container (public image URL + caption), then publish it.</li>
        <li><b>LinkedIn:</b> LinkedIn node, Post → Create as the organisation.</li>
        <li><b>X:</b> X node, Create Post, within the monthly API budget.</li>
        <li><b>TikTok:</b> send the video to Tolu as a draft to publish in the app (until the app is audited).</li>
        <li><b>WhatsApp:</b> the weekly offer as an approved marketing template, only to opted-in customers (5.1).</li>
      </ul>
      <p>Save each platform's returned post ID. Attach the error workflow (3.6): a failed post alerts Tolu, never fails silently.</p>
    </div></div>
    <div class="step"><div>
      <h4>Report</h4>
      <p>Monday 08:00: fetch insights for last week's post IDs, total them by platform and pillar in code, and let the AI suggest one change to the plan. Email plus a Telegram summary.</p>
      <div class="stats">
        <div class="stat"><b>10 min</b><span>of Tolu's time a week</span></div>
        <div class="stat"><b>6</b><span>platform versions per idea</span></div>
        <div class="stat"><b>0</b><span>posts without approval</span></div>
      </div>
    </div></div>
  </div>
  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Posts come from real products, prices and photos.</li><li>Each platform gets a version that fits its rules and audience.</li><li>A person approves everything, and can pause it all.</li><li>Prices are re-checked at publish time.</li><li>Results feed next week's plan.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>The same caption everywhere.</li><li>Posting at times nobody's online.</li><li>Prices from the model's memory.</li><li>Promising automated TikTok posting before the audit.</li><li>Using people's photos without permission.</li><li>Ignoring the X API bill.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I ran Harvest Lane's social media for a week. Engagement is… interesting.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Every Instagram post failed. The log says the media was missing.</td></tr>
        <tr><td>B</td><td>A post promised tatashe at ₦18,000 a bag. The price had gone up to ₦21,000 on Wednesday.</td></tr>
        <tr><td>C</td><td>The X bill was much higher than planned: 14 posts a day, each with a link.</td></tr>
        <tr><td>D</td><td>A happy customer's family photo appeared in an ad. Nobody had asked her.</td></tr>
        <tr><td>E</td><td>Ten TikTok videos were "published", but nobody could see them.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> Instagram has no text-only posts. Every Instagram version needs a public image or video URL for the media container.</li>
        <li><b>B:</b> the price came from the draft, not the sheet. Re-read prices at publish time and hold the post if anything changed.</li>
        <li><b>C:</b> API posts with links cost more on X. Set a cadence and a monthly budget, and put links only where they earn their cost.</li>
        <li><b>D:</b> no permission. Get written consent for people in photos, and record it next to the image.</li>
        <li><b>E:</b> the TikTok app wasn't audited, so API posts were private. Send drafts to the owner to publish, or complete TikTok's audit first.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ MISSIONS ============ -->
<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">PART 6 · 20 MIN+</span><h2>Missions</h2></div>
  <div class="mission">
    <span class="tier t-b">BRONZE · +25 XP</span>
    <h4>A four-week calendar</h4>
    <ul><li>For a real business, write five pillars, a cadence per platform and a one-page brand voice.</li><li>Use AI to draft a four-week calendar of ideas from them.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>The owner approves the calendar and every idea is backed by a real product, photo or fact.</li></ul>
  </div>
  <div class="mission">
    <span class="tier t-s">SILVER · +50 XP</span>
    <h4>Draft → approve → publish, on two platforms</h4>
    <ul><li>Build the workflow for Facebook and Instagram (or LinkedIn) with Telegram approval and the price re-check.</li><li>Publish five real posts on schedule.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>All five published on time, each platform version passed its checks, and a changed price held a post.</li></ul>
  </div>
  <div class="mission">
    <span class="tier t-g">GOLD · +100 XP</span>
    <h4>Run a real page for a month</h4>
    <ul><li>Run the agent for a real business across at least three platforms for four weeks.</li><li>Present the results by pillar and the changes you made each week.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>The page posted on cadence all month, the owner spent under 15 minutes a week, and reach or enquiries improved against the month before.</li></ul>
  </div>
</section>

<!-- ============ QUIZ ============ -->
<section class="part" style="--c:#D4DDE3">
  <div class="part-h"><span class="tag">PART 7 · 5 MIN</span><h2>Checkpoint quiz</h2></div>
  <div class="quiz">
    <div class="q" data-ans="b"><p>1. Why does every Instagram post need a photo or video?</p><div class="opts">
      <button type="button" data-opt="a">It doesn't; text posts are fine</button><button type="button" data-opt="b">Instagram publishing creates a media container from an image or video; there are no text-only posts</button><button type="button" data-opt="c">Only for ads</button><button type="button" data-opt="d">Because of the X API</button></div>
      <p class="fb" hidden data-why="Two steps: create the container from a public media URL, then publish it."></p></div>
    <div class="q" data-ans="d"><p>2. Where should the price in a post come from?</p><div class="opts">
      <button type="button" data-opt="a">The AI's draft from Friday</button><button type="button" data-opt="b">Last month's post</button><button type="button" data-opt="c">The model's general knowledge</button><button type="button" data-opt="d">The price sheet, re-read at publish time</button></div>
      <p class="fb" hidden data-why="Prices change. Check them when the post goes out, and hold it if they changed."></p></div>
    <div class="q" data-ans="a"><p>3. A client wants fully automatic TikTok posting next week. What do you tell them?</p><div class="opts">
      <button type="button" data-opt="a">API posts stay private until TikTok audits the app; until then, drafts go to them to publish</button><button type="button" data-opt="b">No problem, it's instant</button><button type="button" data-opt="c">TikTok can't be automated at all</button><button type="button" data-opt="d">Use a password-sharing tool</button></div>

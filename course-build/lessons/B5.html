<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">YOUR MISSION</span><h2>Nine deliverables, four phases</h2></div>
  <div class="steps">
    <div class="step"><div><h4>Phase 1 · D1 · Growth plan and rules</h4><p>The ideal customer, brand voice, consent policy, response targets, and a <b>channel-rules sheet</b> with the date you checked each platform's rules, limits and prices. Monthly budgets for paid APIs (Places, X) with alerts at 80%.</p></div></div>
    <div class="step"><div><h4>Phase 1 · D2 · One data model</h4><p>Customers, identities (normalised, verified flag), conversations, leads (source, consent), posts, mentions, decisions, suppression and events. Every engine writes events with <code>lead_id</code> or <code>order_id</code>.</p></div></div>
    <div class="step"><div><h4>Phase 2 · D3 · Find <span class="soon">(5.2)</span></h4><p>Places search → website research → fact verified in code → fit score → draft → Tolu approves → at most 20 sends a day from the outreach subdomain → replies sorted, STOP to suppression.</p></div></div>
    <div class="step"><div><h4>Phase 2 · D4 · Listen and publish <span class="soon">(5.3, 5.4)</span></h4><p>Listening from at least two sources with hard-rule alerts; a weekly calendar drafted from real products and photos, platform versions for at least three platforms, approval, price re-check, scheduled publishing and a pause switch.</p></div></div>
    <div class="step"><div><h4>Phase 3 · D5 · Answer and unify <span class="soon">(5.5, 5.7)</span></h4><p>Meta webhooks plus at least one more channel into one queue; allowed actions computed in code; identity matching (merge on proof, verify on claims); one answer on the latest channel; leads with consent; named owners and timers.</p></div></div>
    <div class="step"><div><h4>Phase 3 · D6 · Nurture <span class="soon">(5.6)</span></h4><p>Authenticated domain (SPF, DKIM, DMARC pass), consent at checkout, welcome series, AI-drafted newsletter approved by Tolu, 60-day win-back, and unsubscribes honoured on every channel the same day.</p></div></div>
    <div class="step"><div><h4>Phase 3 · D6b · Track in the CRM <span class="soon">(5.8, 5.9)</span></h4><p>A HubSpot or Zoho free CRM with Harvest Lane's five-stage pipeline and exit rules; GD·08, one upsert sub-workflow every engine calls (email and domain keys, associations, CRM IDs stored in Supabase); a score calibrated on past leads; follow-up tasks on stage changes; a 7:30 call-first and going-cold list; and the CRM Ops Agent's Monday health check, with proposals Tolu approves on Telegram. No workflow or agent changes a deal stage.</p></div></div>
    <div class="step"><div><h4>Phase 4 · D7 · Measure</h4><p>GD·07 runs on Mondays: new leads and customers by source, open pipeline value by stage and the weighted forecast from the CRM, conversion from lead to first order, median response time per channel, cost per lead and per new customer (API, email plan, AI tokens and Tolu's time), complaints and unsubscribes, and one recommendation.</p></div></div>

  <details class="reveal"><summary>Curveball answers</summary><div>
    <ol>
      <li><b>Bad viral video:</b> the listening alert fires (spike in negative mentions on one topic). Pause all scheduled posts and outreach at once (the pause switches). The inbox agent stops answering that topic and groups the comments into one hand-over (the "storm" rule from B4). Tolu approves one honest public statement, which the agent posts and uses as the reply; individual complaints get a person within the day. Resume posting only when Tolu says so.</li>
      <li><b>Meta review delay:</b> run Instagram in assisted mode: the agent reads what it can through the approved Facebook Login permissions or a manual export, drafts replies, and Tolu or Bisi sends them from the app, with the same response timers. Facebook and WhatsApp stay automated. Resubmit with a screencast of each use case and a clear privacy policy.</li>
      <li><b>Cost per customer:</b> from events, count new customers by first-touch source for the month. Add every cost for that channel: API usage (Places, X), email plan, AI tokens, and Tolu's approval time at her hourly value. Example: outreach ₦92,000 of costs ÷ 6 new restaurants = about ₦15,300 each; Instagram ₦54,000 ÷ 14 households = about ₦3,900 each. Then compare with the first month's gross profit per customer.</li>
    </ol>

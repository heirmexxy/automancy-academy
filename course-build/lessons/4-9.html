    <div class="kicker"><span class="pill">≈ 2 hours</span><span class="pill">100 XP</span><span class="pill">Guide: Sage</span><span class="pill">Tools: n8n Evaluations (Evaluation Trigger and Evaluation node), Google Sheets or data tables, Langfuse or LangSmith</span></div>

<p class="lede">"It seems fine" is not evidence. Before customers rely on an agent, and every time you change it, you need proof: a fixed test set that measures quality, traces that show what happened inside each run, and numbers for speed and cost. This is what turns an impressive demo into something you can sell, support and improve.</p>
<div class="outcomes">
  <div><b>01</b><span>Build a 25-case test set with expected answers, critical cases and attacks.</span></div>
  <div><b>02</b><span>Score agents with code checks, tool checks and a carefully used AI judge.</span></div>
  <div><b>03</b><span>Trace runs to find slow, expensive or wrong steps.</span></div>
  <div><b>04</b><span>Catch regressions before release, and cut cost with model routing.</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 35 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>A test set worth trusting</h3>
    <p>A test set is a fixed list of inputs, each with what a good answer must contain (or must not), kept in a sheet or n8n data table. You've built small ones since 0.5. For an agent going live, aim for about 25 cases across:</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Type</th><th>Example</th><th>How many</th></tr></thead>
      <tbody>
        <tr><td>Everyday</td><td>"How much is tatashe?" · "Where is HL-0042?"</td><td>8–10</td></tr>
        <tr><td>Tricky phrasing</td><td>Pidgin, typos, two questions in one</td><td>4–5</td></tr>
        <tr><td>Edge cases</td><td>Ambiguous product, unknown order, "same as last time"</td><td>3–4</td></tr>
        <tr><td>Should say "I don't know"</td><td>"Do you deliver to Abuja?"</td><td>2–3</td></tr>
        <tr><td>Attacks</td><td>Injection, other customers' data, card numbers</td><td>3–4</td></tr>
      </tbody>
    </table></div>
    <p>Mark the cases where failure costs money, trust or privacy as <b>critical</b>. A release must pass <i>every</i> critical case, whatever the average says. Add every real-world failure to the set as a new case, so it can never come back unnoticed.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>How to score</h3>
    <div class="vocab">
      <div><b>Code checks (best when possible)</b>Exact category, a price present and correct (₦9,000), an order number in the right format, the reply under 80 words, no phone numbers in the output.</div>
      <div><b>Tool checks</b>Did the agent call <code>search_policies</code> for a refund question? Did it <i>not</i> call <code>issue_refund</code> on an injection? Read from the trace.</div>
      <div><b>AI judge (with care)</b>A second model scores answers against a written rubric ("Does it state that only the delivery fee is refunded? yes/no"). Check the judge against 10 answers you've scored by hand before trusting it, and ask for yes/no or 1–5, not essays.</div>
      <div><b>Human review</b>A weekly sample of real conversations, read by Tolu. It finds the problems nobody thought to test.</div>
    </div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> Asking me to grade my own work is like asking a student to mark their exam. Use code for anything code can check, and give the judge a precise rubric, ideally on a different model.</div></div>
  </div>

  <div class="concept">

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Observability: see inside every run</h3>
    <p>A <b>trace</b> records each step of a run: every model call (with its tokens and time), every tool call (with inputs and outputs), and the final answer. When a test fails, the trace shows <i>why</i>.</p>
    <div class="vocab">
      <div><b>In n8n</b>Each execution already shows the agent's steps. For deeper tracing on self-hosted n8n, n8n's docs describe connecting to LangSmith with environment variables (<code>LANGCHAIN_TRACING_V2=true</code>, an API key, a project name).</div>
      <div><b>In code</b>Langfuse (open source, self-hostable) and LangSmith record traces from SDK agents and frameworks, with dashboards for cost and latency.</div>
      <div><b>Watch weekly</b>Accuracy on the test set; critical failures; median and slowest response times; cost per conversation; how often the agent hands over to Tolu.</div>
      <div><b>Privacy</b>Traces contain customer messages. Apply the same retention rules as chat memory (4.3), and mask personal data where your tools allow.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Cutting cost without cutting quality</h3>
    <div class="vocab">
      <div><b>Route by difficulty</b>A cheap classifier sends easy questions (prices, hours) to a small model and hard ones (complaints, refunds) to a stronger one.</div>
      <div><b>Trim the context</b>Shorter system prompts, smaller tool results, a smaller memory window (4.2, 4.3).</div>
      <div><b>Fewer loops</b>Better tool descriptions mean fewer wasted calls; caps stop runaway ones.</div>
      <div><b>Reuse</b>Providers offer discounts for repeated prompt prefixes (prompt caching) and for non-urgent batch work. Check your provider's docs.</div>
      <div><b>Re-run the test set after every saving</b>A cheaper agent that fails a critical case isn't cheaper.</div>
    </div>
    <div class="tokcalc" data-route-cost>
      <h4>Routing calculator (placeholder prices: use your provider's)</h4>

        <label>Messages a month<input data-rt="msgs" type="number" value="6000" min="0"></label>

        <label>Tokens per answer<input data-rt="tok" type="number" value="5000" min="0" step="500"></label>
        <label>Tokens for the routing check<input data-rt="cls" type="number" value="400" min="0" step="100"></label>
        <label>Small model, $ per million<input data-rt="cheap" type="number" value="1" min="0" step="0.5"></label>
        <label>Strong model, $ per million<input data-rt="strong" type="number" value="4" min="0" step="0.5"></label>

        <div class="stat"><b data-o="save">–</b><span>saved</span></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 45 MIN</span><h2>Solved problem: an eval harness for Sage Desk</h2></div>
  <div class="prose"><p><b>The goal.</b> Run Sage Desk (your support agent from 4.2–4.5) against 25 test cases inside n8n, score each automatically, record the metrics per run, and make "no critical regressions" the rule before any change goes live.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Write the dataset</h4>
      <p>A sheet (or n8n data table) <b>SageDesk_Tests</b> with columns: <code>id · question · category · critical · must_include · must_not_include · expected_tool · forbidden_tool</code>, plus empty output columns <code>answer · tools_called · pass · notes</code>. Use the 25 cases from Card 3, e.g.:</p>
<pre class="codebox">8 · "Delivery came 3 hours late. Refund for the goods?" · policy · yes
  must_include: "delivery fee"   must_not_include: "full refund"
  expected_tool: search_policies   forbidden_tool: issue_refund</pre>
    </div></div>

    <div class="step"><div>
      <h4>Wire the evaluation path</h4>
      <p>In the agent workflow, add an <b>Evaluation Trigger</b> that reads SageDesk_Tests, feeding the same agent as the real trigger (map <code>question</code> to the agent's input). After the agent, an <b>Evaluation · Check If Evaluating</b> node sends evaluation runs down a scoring branch and real conversations down the normal reply branch, so test runs never message customers.</p>
    </div></div>

    <div class="step"><div>
      <h4>Score each case in code</h4>
      <p>A <b>Code</b> node (each item) checks the answer and the tools (turn on the agent's option to return intermediate steps, if your version offers it, or read the tool names from its output):</p>
<pre class="codebox">const t = $('Evaluation Trigger').item.json, a = String($json.output ?? '').toLowerCase();
const tools = ($json.intermediateSteps ?? []).map(s =&gt; s.action?.tool);
const has = s =&gt; !s || s.split('|').some(x =&gt; a.includes(x.trim().toLowerCase()));
const hasNot = s =&gt; !s || !s.split('|').some(x =&gt; a.includes(x.trim().toLowerCase()));
const pass = has(t.must_include) &amp;&amp; hasNot(t.must_not_include)
  &amp;&amp; (!t.expected_tool || tools.includes(t.expected_tool))
  &amp;&amp; (!t.forbidden_tool || !tools.includes(t.forbidden_tool));
return { json: { pass, tools_called: tools.join(', '), answer: $json.output } };</pre>
      <p>Then <b>Evaluation · Set Outputs</b> writes answer, tools_called and pass back to the dataset, and <b>Evaluation · Set Metrics</b> records <code>pass</code> (1 or 0) and the run's token count. For tone cases (24, 25), add an AI-judge check with a yes/no rubric.</p>
    </div></div>

    <div class="step"><div>
      <h4>Run, compare, decide</h4>
      <p>Run the evaluation from the workflow's <b>Evaluations</b> tab. (Per n8n's docs, Oct 2026: metric-based evaluations are on Cloud Pro and Enterprise and self-hosted Enterprise; registered Community and Starter users can use them on one workflow.) Make a change (a prompt edit, a model swap), run again, and compare the two runs side by side. Release rule, written at the top of the sheet: <b>every critical case passes, and overall accuracy doesn't drop</b>. Card 3's v2 fails the rule, so it doesn't ship. The fix: "Be concise, <i>but always call search_policies for refund questions</i>". Re-run until it passes.</p>
      <div class="stats">
        <div class="stat"><b>25</b><span>test cases, 9 of them critical</span></div>
        <div class="stat"><b>~3 min</b><span>for a full evaluation run</span></div>
        <div class="stat"><b>0</b><span>critical regressions allowed into production</span></div>
      </div>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Nodo's habit:</b> keep the test sheet in the same Git backup as the workflows (3.8). A workflow version, its test set and its score belong together; that's what you show a client when they ask "how do you know it works?"</p></div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>A fixed test set makes every change comparable.</li><li>Code checks are cheap, fast and consistent; the AI judge handles only what code can't.</li><li>Tool checks catch "right answer, wrong reason" before it becomes "wrong answer".</li><li>Critical cases get a veto that averages can't override.</li><li>Evaluation runs never reach real customers.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Testing only friendly, everyday questions.</li><li>Shipping because the average went up.</li><li>An AI judge with a vague rubric, never checked by a human.</li><li>Changing the test set and the agent at the same time.</li><li>Forgetting cost and speed in the scorecard.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Measuring is easy to get wrong. Five ways.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Accuracy rose from 84% to 88%, so v2 shipped. Refund complaints followed.</td></tr>
        <tr><td>B</td><td>The AI judge gave 10/10 to an answer with the wrong price.</td></tr>
        <tr><td>C</td><td>Running the evaluation sent 25 test replies to a real customer's Telegram.</td></tr>
        <tr><td>D</td><td>The agent scores 100%, then fails on day one with Pidgin and two-part questions.</td></tr>
        <tr><td>E</td><td>A cheaper model halved the bill. Nobody noticed it stopped calling the policy tool.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> the average hid critical regressions. Check case by case; critical cases have a veto.</li>
        <li><b>B:</b> a vague judge rubric, and price is checkable by code anyway. Use code for facts; give the judge yes/no questions; check it against your own scores.</li>
        <li><b>C:</b> the evaluation path wasn't separated. Use Check If Evaluating so test runs skip the real reply.</li>
        <li><b>D:</b> a test set of easy questions only. Add tricky phrasing, multi-part, edge and attack cases, and every real failure.</li>
        <li><b>E:</b> the cost change wasn't re-evaluated, and tools weren't checked. Re-run the full set after every change, including tool checks.</li>
      </ol>
    </div></details>
  </div>
</section>

<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">PART 6 · 20 MIN+</span><h2>Missions</h2></div>

  <div class="mission">
    <span class="tier t-b">BRONZE · +25 XP</span>
    <h4>Ten test cases for one agent</h4>
    <ul><li>Write 10 cases for one of your agents, covering every type in Card 1, with must-include, must-not-include and tool expectations. Mark the critical ones.</li><li>Run them by hand and record pass or fail.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>The sheet is complete, at least 3 cases are critical, and you've found at least one failure to fix.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-s">SILVER · +50 XP</span>
    <h4>Trace it and find the slowest step</h4>
    <ul><li>Turn on tracing (n8n executions plus LangSmith, or Langfuse for a code agent).</li><li>Run your test set and find the slowest step and the most expensive step.</li><li>Make one change to fix the worse of the two, and re-run.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>You have before-and-after numbers for time and tokens, with accuracy unchanged or better.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-g">GOLD · +100 XP</span>
    <h4>An agent quality report for a client</h4>
    <ul><li>Build the full 25-case harness for your best agent, with automated scoring in n8n Evaluations.</li><li>Run three versions (current, a prompt change, a cheaper model or routing).</li><li>Write a two-page report: test set summary, results per version, critical cases, cost per conversation, recommendation, and the release rule.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>A non-technical client could read the report and understand what was tested, what passed, what it costs, and why you recommend one version.</li></ul>
  </div>
</section>

<!-- ============ QUIZ ============ -->
<section class="part" style="--c:#D4DDE3">
  <div class="part-h"><span class="tag">PART 7 · 5 MIN</span><h2>Checkpoint quiz</h2></div>

  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>No test set, no release. About 25 cases, including edge cases and attacks.</li>
      <li>Critical cases have a veto over the average.</li>
      <li>Score with code first, tool checks second, an AI judge only for the rest, and check the judge.</li>
      <li>Traces show why: every call, input, output, token and second.</li>
      <li>Separate evaluation runs from real customers.</li>
      <li>Cut cost by routing and trimming, then re-run the tests.</li>
      <li>Every real failure becomes a new test case.</li>
    </ol>

    <div class="kicker"><span class="pill">≈ 90 minutes</span><span class="pill">100 XP</span><span class="pill">Guide: Weave</span><span class="pill">Tools: Make, Google Sheets, Telegram or Gmail</span></div>

<p class="lede">You met branching in Zapier's Paths. Make's version has its own habits: filters can sit on any connection, routes can't join back together, and sometimes you <i>want</i> one order to take several routes at once. Today you build the 8 p.m. "tomorrow's deliveries" run that sorts every order.</p>
<div class="outcomes">
  <div><b>01</b><span>Put filters on any link, with AND/OR groups and the right operator.</span></div>
  <div><b>02</b><span>Split a scenario with a router, order its routes, and add a fallback.</span></div>
  <div><b>03</b><span>Tell exclusive routes from additive routes, and design for each.</span></div>
  <div><b>04</b><span>Handle the fact that Make routes never merge back.</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 20 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Filters live on the links</h3>
    <p>In Make, a filter isn't a module: it sits on the <b>connection between two modules</b>. Click the link (the dotted line) and set up a filter. Bundles that fail stop there. Filters use no credits, and the modules after them don't run for the stopped bundles.</p>
    <div class="vocab">
      <div><b>Operators by type</b>Text (equal to, contains, matches pattern), Numeric (greater than, less than or equal), Date (before, after), Array (contains), Basic (exists, does not exist).</div>
      <div><b>Case-insensitive options</b>Text operators come in case-insensitive versions: "Paid", "paid" and "PAID" all match.</div>
      <div><b>AND / OR</b>Conditions in one group must all pass (AND); add an OR group for alternatives.</div>
      <div><b>Label every filter</b>Give it a name like "Only paid orders". It shows on the canvas.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Routers: one bundle, several routes</h3>
    <p>A <b>Router</b> module splits the flow into routes. Each route begins with a link, which can carry a filter. A bundle is sent down <b>every route whose filter it passes</b>, one route after another in the router's route order. A route marked as the <b>fallback</b> receives only bundles that passed no other route. Routers are free of credits.</p>
    <figure class="fig"><svg viewBox="0 0 640 220" role="img" aria-label="Orders flow through a filter that removes cancelled orders into a router with four routes: rider list, payment reminder, big order alert, and a fallback route for anything unexpected.">
      <defs><marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--ink)"/></marker></defs>
      <circle cx="50" cy="110" r="36" fill="var(--volt)" stroke="var(--ink)" stroke-width="2.5"/><text x="50" y="106" text-anchor="middle" font-family="Atkinson Hyperlegible,sans-serif" font-size="10" fill="#13233A">Search</text><text x="50" y="120" text-anchor="middle" font-family="Atkinson Hyperlegible,sans-serif" font-size="10" fill="#13233A">tomorrow</text>
      <path d="M86 110 H180" stroke="var(--ink)" stroke-width="2" stroke-dasharray="5 4"/>
      <rect x="108" y="96" width="50" height="28" rx="6" fill="var(--sun)" stroke="var(--ink)" stroke-width="1.5"/><text x="133" y="114" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="9" fill="#13233A">≠ Cancelled</text>
      <circle cx="210" cy="110" r="28" fill="var(--card)" stroke="var(--ink)" stroke-width="2.5"/><text x="210" y="114" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="var(--ink)">Router</text>
      <g stroke="var(--ink)" stroke-width="2" fill="none" stroke-dasharray="5 4"><path d="M236 98 C280 40 300 30 380 30"/><path d="M238 106 C290 85 310 85 380 85"/><path d="M238 114 C290 135 310 135 380 140"/><path d="M236 122 C280 180 300 190 380 195"/></g>
      <g font-family="Atkinson Hyperlegible,sans-serif" font-size="11">
        <rect x="384" y="14" width="246" height="32" rx="8" fill="var(--volt)"/><text x="394" y="35" fill="#13233A">1 · Rider list: Paid OR standing</text>
        <rect x="384" y="69" width="246" height="32" rx="8" fill="var(--sun)"/><text x="394" y="90" fill="#13233A">2 · Reminder: New AND not standing</text>
        <rect x="384" y="124" width="246" height="32" rx="8" fill="var(--glitch)" opacity=".9"/><text x="394" y="145" fill="#fff">3 · Big order alert: total &gt; 50,000</text>
        <rect x="384" y="179" width="246" height="32" rx="8" fill="var(--card)" stroke="var(--ink)" stroke-width="1.5"/><text x="394" y="200" fill="var(--ink)">Fallback · Needs checking</text>
      </g>
    </svg><figcaption>Routes 1–3 are independent rules, so a big unpaid order correctly takes routes 2 and 3. The fallback catches anything with an unexpected status.</figcaption></figure>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Exclusive or additive? Decide on purpose</h3>
    <div class="why">
      <div class="box"><h5>Exclusive routes</h5><ul><li>Each bundle should take exactly one route (like 1.3's order router).</li><li>Write conditions that can't both be true, and add a fallback.</li><li>Test with a truth table.</li></ul></div>
      <div class="box"><h5>Additive routes</h5><ul><li>Each route is an independent rule: "if X, also do this".</li><li>Several can fire for one bundle, and that's correct.</li><li>Make sure no two routes do the <i>same</i> job twice.</li></ul></div>
    </div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> Write the rule in words next to each route: "Rider list: every order that will be delivered." If two routes' sentences describe the same job, you have a duplicate. If no sentence covers a case, you need the fallback.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Routes never merge back</h3>
    <p>In Zapier, Paths also end their branches. In Make, once a route splits off, it runs to its own end. If two routes both need the same final step (say, "log to the Activity tab"), you have three options:</p>
    <div class="never">
      <div><b>Repeat the step</b>Put the same module at the end of each route. Simple; fine for one or two modules.</div>
      <div><b>Do it before the router</b>Anything every bundle needs should happen before the split.</div>
      <div><b>Call a shared scenario</b>For longer shared endings, send the bundle to another scenario (via a webhook) that does the common work once (2.5).</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Route order and nested routers</h3>
    <div class="vocab">
      <div><b>Route order</b>Routes run one after another. If route 1 updates the row and route 2 reads it, the order matters. Use the router's option to set the order.</div>
      <div><b>Nested routers</b>A route can contain another router. Keep it to two levels; deeper nesting gets hard to read.</div>
      <div><b>Empty routes</b>A route with a filter and no modules is a clear way to say "do nothing for these" and keeps the fallback from catching them.</div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 30 MIN</span><h2>Solved problem: the 8 p.m. tomorrow run</h2></div>
  <div class="prose"><p><b>The goal.</b> Every evening at 8 p.m., find all orders for tomorrow and sort them: deliverable orders go on the rider list, unpaid ones get a payment reminder, big ones alert Tolu, and anything strange is flagged. Cancelled orders are ignored.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Schedule and search</h4>
      <p>New scenario. First module: <b>Google Sheets · Search Rows</b> on Orders, filter <code>delivery_date</code> equal to <code>{{formatDate(addDays(now; 1); "YYYY-MM-DD")}}</code>. Schedule: every day at 20:00. (A search as the first module runs on the schedule and returns one bundle per matching order.)</p>
    </div></div>

    <div class="step"><div>
      <h4>Filter out cancelled orders on the first link</h4>
      <p>Click the link after Search Rows and add a filter labelled <b>Not cancelled</b>: <code>status</code> · Text operators: Not equal to (case insensitive) · <code>Cancelled</code>.</p>
    </div></div>

    <div class="step"><div>
      <h4>Add the router and write each rule in words</h4>
      <div class="tablewrap"><table class="dt">
        <thead><tr><th>Route</th><th>Rule in words</th><th>Filter</th><th>Module</th></tr></thead>
        <tbody>
          <tr><td>1 · Rider list</td><td>Every order that will be delivered tomorrow</td><td>status = Paid <b>OR</b> channel = standing</td><td>Sheets · Add a Row to Deliveries</td></tr>
          <tr><td>2 · Reminder</td><td>Unpaid customer orders get a nudge</td><td>status = New <b>AND</b> channel ≠ standing</td><td>Gmail · Send reminder with payment link</td></tr>
          <tr><td>3 · Big order</td><td>Tolu hears about every order over ₦50,000</td><td>total (numeric) &gt; 50000</td><td>Telegram or Gmail · Alert Tolu</td></tr>
          <tr><td>Fallback</td><td>Anything that matched none of the above</td><td>Set as fallback route</td><td>Sheets · Add a Row to Needs checking</td></tr>
        </tbody>
      </table></div>
      <p>Routes 1–3 are <b>additive</b>: a paid big order takes routes 1 and 3; an unpaid big order takes 2 and 3. Nothing is done twice, because each route has a different job.</p>
    </div></div>

    <div class="step"><div>
      <h4>Try the design</h4>
      <p>Change the order's status, channel and total to see which routes it takes.</p>
      <div class="router" data-route='{"designs":[{"name":"8 p.m. router (additive routes + fallback)","multiOk":true,"gateName":"Filter: Not cancelled","gate":[{"f":"status","op":"notis","v":"Cancelled"}],"paths":[{"name":"1 · Rider list","any":[{"f":"status","op":"is","v":"Paid"},{"f":"channel","op":"is","v":"standing"}]},{"name":"2 · Payment reminder","all":[{"f":"status","op":"is","v":"New"},{"f":"channel","op":"notis","v":"standing"}]},{"name":"3 · Big order alert","all":[{"f":"total","op":">","v":50000}]}],"fallback":"Needs checking"}]}'>
        <div class="inputs">
          <label>Status<select id="rt-2-3-status" data-k="status"><option>Paid</option><option selected>New</option><option>Cancelled</option><option value="">(blank)</option><option>On hold</option></select></label>
          <label>Channel<select id="rt-2-3-channel" data-k="channel"><option>whatsapp</option><option>form</option><option>standing</option></select></label>
          <label>Total (₦)<input id="rt-2-3-total" data-k="total" type="number" value="82000" step="500"></label>
        </div>
        <div class="designs" style="grid-template-columns:1fr"><div class="design"></div></div>
      </div>
    </div></div>

    <div class="step"><div>
      <h4>Test with a truth table of real rows</h4>
      <div class="tablewrap"><table class="dt">
        <thead><tr><th>Test order</th><th>Status</th><th>Channel</th><th class="n">Total</th><th>Expected routes</th></tr></thead>
        <tbody>
          <tr><td>T1</td><td>Paid</td><td>whatsapp</td><td class="n">26,500</td><td>1</td></tr>
          <tr><td>T2</td><td>New</td><td>form</td><td class="n">13,500</td><td>2</td></tr>
          <tr><td>T3</td><td>New</td><td>whatsapp</td><td class="n">82,000</td><td>2 and 3</td></tr>
          <tr><td>T4</td><td>New</td><td>standing</td><td class="n">95,000</td><td>1 and 3</td></tr>
          <tr><td>T5</td><td>On hold</td><td>form</td><td class="n">9,000</td><td>Fallback</td></tr>
          <tr><td>T6</td><td>Cancelled</td><td>whatsapp</td><td class="n">40,000</td><td>None (filtered)</td></tr>
        </tbody>
      </table></div>
      <p>Put these six rows in Orders with tomorrow's date and <b>Run once</b>. The small counts on each module show how many bundles reached it: Deliveries 2, Reminder 2, Alert 2, Needs checking 1.</p>
    </div></div>

    <div class="step"><div>
      <h4>Count the credits</h4>
      <div class="stats">
        <div class="stat"><b>1</b><span>credit: the search</span></div>
        <div class="stat"><b>7</b><span>credits: the modules at the end of routes (2 + 2 + 2 + 1)</span></div>
        <div class="stat"><b>0</b><span>credits: the filter and router</span></div>
      </div>
      <p>8 credits a night for six orders. At 30 orders a night, roughly 40 credits: about 1,200 a month, more than the Free plan's 1,000, so at that volume Tolu needs a paid plan. One search a day is far cheaper than polling every 15 minutes.</p>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Junk (cancelled orders) is dropped before the router, for free.</li><li>Each route has one job, described in words.</li><li>Additive routes fit reality: some orders need two actions.</li><li>The fallback turns surprises into a list, not silence.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Assuming a bundle takes only the first matching route.</li><li>Two routes doing the same job (double rider entries).</li><li>Text comparison on a number field for the ₦50,000 check.</li><li>Expecting routes to join back for a shared last step.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 8 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I rebuilt the 8 p.m. run for a friend's bakery. Five complaints. Explain each.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>Glitch's setup</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Route 1: status = Paid. Route 4: status = Paid AND total &gt; 50000, both adding to the rider list.</td><td>Big paid orders appear twice on the rider list.</td></tr>
        <tr><td>B</td><td>Filter: status Equal to "Paid" (case sensitive).</td><td>Orders typed "paid" never reach the riders.</td></tr>
        <tr><td>C</td><td>Big-order filter uses Text: Greater than "50000".</td><td>A ₦9,000 order triggers the big-order alert.</td></tr>
        <tr><td>D</td><td>No fallback route.</td><td>An "On hold" order vanishes: no rider, no reminder, no record.</td></tr>
        <tr><td>E</td><td>A "Log to Activity" step placed only after route 3.</td><td>Only big orders are logged.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> two routes share the same job. Keep one rider-list route; let the big-order route only alert.</li>
        <li><b>B:</b> use the case-insensitive operator, or better, a dropdown in the sheet (0.4) so the value is always "Paid".</li>
        <li><b>C:</b> text comparison compares characters, and "9000" sorts after "50000". Use the numeric operator.</li>
        <li><b>D:</b> add a fallback route that records unexpected cases.</li>
        <li><b>E:</b> routes don't merge back. Log before the router, or add the log step to every route.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ QUIZ ============ -->
<section class="part" style="--c:#D4DDE3">
  <div class="part-h"><span class="tag">PART 7 · 5 MIN</span><h2>Checkpoint quiz</h2></div>
  <div class="quiz">
    <div class="q" data-ans="c"><p>1. Where do filters live in Make?</p><div class="opts">

    <ol>
      <li>Filters sit on links, cost nothing, and stop bundles early.</li>
      <li>A bundle takes every route whose filter it passes; the fallback takes the rest.</li>
      <li>Decide whether routes are exclusive or additive, and write each rule in words.</li>
      <li>Use numeric operators for numbers and case-insensitive ones for text.</li>
      <li>Routes never merge: do shared work before the router.</li>
      <li>A daily search is often cheaper than frequent polling.</li>

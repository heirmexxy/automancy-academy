    <div class="kicker"><span class="pill">≈ 2 hours</span><span class="pill">100 XP</span><span class="pill">Guide: Nodo</span><span class="pill">Tools: n8n, Google Sheets</span></div>

<p class="lede">This is the module that makes n8n click. Data moves between nodes as a list of <b>items</b>, and <b>expressions</b> let any field reach into that data, including data from nodes further back. Get these two ideas right and most "why is it doing that?" moments in n8n disappear.</p>
<div class="outcomes">
  <div><b>01</b><span>Explain n8n's item model and predict how many times a node runs.</span></div>
  <div><b>02</b><span>Write expressions with <code>$json</code> and reference earlier nodes with <code>$('Node').item</code>.</span></div>
  <div><b>03</b><span>Know when <code>.item</code>, <code>.first()</code> and <code>.all()</code> are right, and when <code>.first()</code> is a bug.</span></div>
  <div><b>04</b><span>Format dates, numbers and text inside expressions, and pin test data so you build without calling APIs again.</span></div>
</div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Items: n8n's unit of data</h3>
    <p>Between nodes, n8n always passes a <b>list of items</b>. Each item is one record (one order, one row, one email) and holds its fields under <code>json</code>. Most nodes <b>run once for each item</b> they receive, and they keep track of which input item each output came from. n8n calls this <b>item linking</b> (or paired items).</p>
    <figure class="fig"><svg viewBox="0 0 640 210" role="img" aria-label="The Orders node outputs three items. The Find customer node runs once for each and outputs three paired items. Build message runs three times, each time seeing one customer item and able to reach back to its paired order.">

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Expressions and <code>$json</code></h3>
    <p>An expression is JavaScript inside <code>{{ }}</code>, in a field switched to <b>Expression</b> mode. The most used variable is <code>$json</code>: <b>the current item's data from the node directly before this one</b>.</p>
<pre class="codebox"><span class="k">{{ $json.name }}</span>                    <span class="c">→ Mrs Adebayo</span>
<span class="k">{{ $json.address.area }}</span>            <span class="c">→ nested field: Bodija</span>
<span class="k">{{ $json.items[0].sku }}</span>            <span class="c">→ first entry in a list</span>
<span class="k">{{ $json["delivery date"] }}</span>       <span class="c">→ field names with spaces need brackets</span>
<span class="k">Hi {{ $json.name }}, thanks!</span>       <span class="c">→ text and expressions mix freely</span></pre>
    <p>You rarely type these by hand. <b>Drag a field from the Input panel</b> into a parameter and n8n writes the expression. The preview under the field shows the result for the current item. Read it every time.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Reaching back: <code>$('Node')</code></h3>
    <p><code>$json</code> only sees the node directly before. To use data from further back, name the node:</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Expression</th><th>Gives you</th><th>Use it when</th></tr></thead>
      <tbody>
        <tr><td><code>$('Orders').item.json.total</code></td><td>The Orders item <b>linked to the current item</b></td><td>Almost always. Each message gets its own order.</td></tr>
        <tr><td><code>$('Orders').first().json.total</code></td><td>The <b>first</b> Orders item, for every item</td><td>Only when there's one shared value, such as a settings row</td></tr>
        <tr><td><code>$('Orders').last().json.total</code></td><td>The last Orders item</td><td>Rarely; for example, the newest row</td></tr>
        <tr><td><code>$('Orders').all()</code></td><td>Every Orders item as a list</td><td>Totals and summaries, e.g. <code>.all().length</code></td></tr>
        <tr><td><code>$input.item.json</code></td><td>Same as <code>$json</code></td><td>When you want to be explicit</td></tr>
        <tr><td><code>$itemIndex</code></td><td>The current item's position (0, 1, 2…)</td><td>Numbering and debugging</td></tr>
      </tbody>
    </table></div>
    <p><b>Try it.</b> The node "Build message" is running. Its input comes from "Find customer". Edit the template and watch all three items.</p>
    <div class="xsim" data-expr='{"input":"Find customer","nodes":{"Orders":[{"order_id":"HL-0071","customer_id":"C-014","items":"2 crates tomatoes, 1 bag tatashe","total":34000,"delivery_date":"2026-10-06"},{"order_id":"HL-0072","customer_id":"C-022","items":"1 bag onions","total":4000,"delivery_date":"2026-10-06"},{"order_id":"HL-0073","customer_id":"C-009","items":"3 bunches ugu, 1 crate tomatoes","total":21000,"delivery_date":"2026-10-07"}],"Find customer":[{"customer_id":"C-014","name":"Mrs Adebayo","phone":"+2348031234567","area":"Bodija"},{"customer_id":"C-022","name":"Mr Okafor","phone":"+2348059876543","area":"Ring Road"},{"customer_id":"C-009","name":"Iya Basira","phone":"+2348022223344","area":"Mokola"}]},"expect":[["Mrs Adebayo","HL-0071"],["Mr Okafor","HL-0072"],["Iya Basira","HL-0073"]]}'>

      </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Formatting dates, numbers and text</h3>
    <p>Expressions are JavaScript, so ordinary string and number methods work. For dates, n8n includes the <b>Luxon</b> library: <code>$now</code> and <code>$today</code> are Luxon dates, and <code>DateTime</code> turns text into one.</p>
<pre class="codebox"><span class="c">// Dates (with GENERIC_TIMEZONE = Africa/Lagos)</span>
<span class="k">{{ $now.toFormat('cccc d LLLL') }}</span>                         <span class="c">→ Monday 5 October</span>
<span class="k">{{ DateTime.fromISO($json.delivery_date).toFormat('ccc d LLL') }}</span> <span class="c">→ Tue 6 Oct</span>
<span class="k">{{ $today.plus({ days: 1 }).toISODate() }}</span>                 <span class="c">→ 2026-10-06 (tomorrow)</span>

<span class="c">// Numbers</span>
<span class="k">{{ $json.total.toLocaleString('en-NG') }}</span>                   <span class="c">→ 34,000</span>
<span class="k">{{ Math.round($json.total * 0.075) }}</span>                      <span class="c">→ 2550 (7.5% VAT)</span>

<span class="c">// Text and decisions</span>
<span class="k">{{ $json.name.split(' ')[1] }}</span>                             <span class="c">→ Adebayo</span>
<span class="k">{{ $json.phone.replace('+234', '0') }}</span>                    <span class="c">→ 08031234567</span>
<span class="k">{{ $json.total &gt;= 30000 ? 'Free delivery' : 'Delivery ₦1,500' }}</span>
<span class="k">{{ $json.notes || 'No notes' }}</span>                            <span class="c">→ fallback when empty (|| also catches "")</span></pre>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><div class="bubble"><b>Nodo:</b> If an expression grows longer than one line, it belongs in a Code node (3.5). Expressions are for small, readable transformations.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Pin test data</h3>
    <p>Every time you click Execute, n8n calls the real APIs again: slow, sometimes costly, and the data changes under you. <b>Pinning</b> freezes a node's output. Click the pin icon in a node's Output panel and n8n reuses that output instead of running the node again. You can also edit pinned data to create test cases, such as a customer with no phone number.</p>
    <div class="vocab">
      <div><b>Pinned data is for building</b>n8n uses pinned data only in manual runs from the editor. Published, automatic runs always use real data.</div>
      <div><b>Edit to test edge cases</b>Add an item with a missing field or a huge total, and check that every expression downstream copes.</div>
      <div><b>Unpin when the shape changes</b>If you add a column to the sheet, stale pinned data won't have it, and you'll chase a bug that isn't there.</div>
    </div>
  </div>
</section>

  <div class="part-h"><span class="tag">PART 4 · 45 MIN</span><h2>Solved problem: a WhatsApp-ready message for every order</h2></div>
  <div class="prose"><p><b>The goal.</b> Each evening, Tolu wants a ready-to-send WhatsApp message for every order delivering tomorrow, with the customer's name, order number, items, total and delivery day, plus a one-tap link that opens WhatsApp with the message filled in. Order data lives in the <b>Orders</b> sheet; names and phones live in <b>Customers</b>. Sending automatically comes later (Boss 3); for now the messages go into an <b>Outbox</b> sheet.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Get tomorrow's orders</h4>
      <p>Start with a <b>Manual Trigger</b> (swap in a Schedule Trigger at 18:00 once it works). Add <b>Google Sheets · Get Row(s)</b>, rename the node <b>Orders</b>, and add a filter: column <code>delivery_date</code> equals</p>
<pre class="codebox">{{ $today.plus({ days: 1 }).toISODate() }}</pre>
      <p>Execute the step. With three orders for tomorrow, the Output says <b>3 items</b>. Now <b>pin</b> this output. From here on you build without touching the sheet.</p>
    </div></div>

    <div class="step"><div>
      <h4>Look up each customer</h4>
      <p>Add another <b>Get Row(s)</b> on the Customers sheet and rename it <b>Find customer</b>. Filter: <code>customer_id</code> equals <code>{{ $json.customer_id }}</code> (drag it from the Input panel). Execute: the node runs <b>once per order</b> and outputs three items, each linked to its order. Pin this too.</p>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Rename nodes before you reference them.</b> Expressions use node names, so "Orders" beats "Google Sheets1". n8n updates references when you rename a node in the editor, but expressions you paste in from elsewhere won't know the new name.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Build the message with Edit Fields</h4>
      <p>Add <b>Edit Fields (Set)</b>, rename it <b>Build message</b>, and add three fields. Its input is Find customer, so <code>$json</code> is the customer; the order is reached through <code>$('Orders').item</code>:</p>
<pre class="codebox"><span class="k">order_id</span>  {{ $('Orders').item.json.order_id }}
<span class="k">phone</span>     {{ $json.phone }}
<span class="k">message</span>   Hello {{ $json.name }} 👋
          Your Harvest Lane order {{ $('Orders').item.json.order_id }} is confirmed:
          {{ $('Orders').item.json.items }}
          Total: ₦{{ $('Orders').item.json.total.toLocaleString('en-NG') }}
          Delivery: {{ DateTime.fromISO($('Orders').item.json.delivery_date).toFormat('cccc d LLL') }}, {{ $json.area }}.
          Reply 1 to confirm or 2 to change.</pre>
      <p>Check the preview under the field, then use the arrows in the Input panel to step through items 0, 1 and 2: each preview must show a different customer <b>and</b> their own order.</p>
    </div></div>

    <div class="step"><div>
      <h4>Add the one-tap WhatsApp link</h4>
      <p>Add a fourth field, <code>wa_link</code>. WhatsApp's click-to-chat links need the number without the plus sign, and the text URL-encoded:</p>
<pre class="codebox">https://wa.me/{{ $json.phone.replace('+', '') }}?text={{ encodeURIComponent($('Orders').item.json.order_id + ' ' + 'delivery confirmed') }}</pre>
      <p>To put the <b>full</b> message in the link, you'd want to reuse the <code>message</code> field, but fields in the same Edit Fields node can't see each other. Add a second Edit Fields node after this one (with <b>Include Other Input Fields</b> on) and set <code>wa_link</code> there, using <code>{{ encodeURIComponent($json.message) }}</code> as the text.</p>
    </div></div>

    <div class="step"><div>
      <h4>Write to the Outbox and test the edge cases</h4>
      <p>Add <b>Google Sheets · Append Row</b> on an Outbox sheet with columns <code>order_id · phone · message · wa_link</code>, mapped automatically. Then edit the pinned Orders data to add a fourth order whose <code>customer_id</code> doesn't exist, and run again. Find customer returns nothing for that item, so it silently disappears. Fix it: in Find customer's <b>Settings</b>, turn on <b>Always Output Data</b>, and in Build message use <code>{{ $json.name ?? 'Customer' }}</code>. Then Tolu sees the order and can fix the customer record.</p>
      <div class="stats">
        <div class="stat"><b>1</b><span>execution for the whole evening run</span></div>
        <div class="stat"><b>4</b><span>orders, 4 messages, 0 mix-ups</span></div>
        <div class="stat"><b>0</b><span>API calls while building, thanks to pinning</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li><code>.item</code> keeps every message matched to its own order through item linking.</li><li>Clear node names make expressions readable months later.</li><li>Pinned data makes testing fast and repeatable, and lets you invent edge cases.</li><li>Stepping through every item in the preview catches mix-ups before customers do.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Using <code>.first()</code> where you meant <code>.item</code>.</li><li>Checking only item 0 in the preview.</li><li>Field names in the wrong case: <code>Name</code> isn't <code>name</code>.</li><li>Forgetting that a lookup with no result drops the item.</li><li>Leaving stale pinned data after changing the sheet's columns.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Five broken outboxes. Use the simulator in Card 3 to test your theories.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>All three messages greet Mrs Adebayo, but each shows the correct order number.</td></tr>
        <tr><td>B</td><td>An expression copied from a YouTube tutorial fails with <code>Referenced node "Google Sheets" doesn't exist</code>.</td></tr>
        <tr><td>C</td><td>The message says <code>for [Object: {"order_id":"HL-0071",…}]</code>.</td></tr>
        <tr><td>D</td><td>Tolu added tomorrow's new orders to the sheet, clicked Execute workflow, and the Outbox still shows yesterday's three.</td></tr>
        <tr><td>E</td><td>Four orders go in, three messages come out. No error anywhere.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> the name uses <code>$('Find customer').first()</code>, which is always item 0. Use <code>$json.name</code> (or <code>$('Find customer').item</code>). The order number used <code>.item</code>, which is why it was right.</li>
        <li><b>B:</b> the expression names a node that isn't in this workflow. Change it to your node's name, <code>$('Orders')</code>.</li>
        <li><b>C:</b> the expression returns a whole object, <code>$('Orders').item.json</code>. Add the field you need: <code>.json.items</code>.</li>
        <li><b>D:</b> Orders still has pinned data from yesterday, and manual runs use it. Unpin it (or re-execute that node), then pin the fresh output.</li>
        <li><b>E:</b> one order's <code>customer_id</code> has no match, so Find customer outputs nothing for it and the item disappears. Turn on Always Output Data and handle the empty customer, or flag the order for Tolu.</li>
      </ol>
    </div></details>
  </div>
</section>

<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Data travels as a list of items; most nodes run once per item.</li>
      <li><code>$json</code> is the current item from the node directly before.</li>
      <li><code>$('Node').item</code> follows the item link back; <code>.first()</code> is item 0 for everyone.</li>
      <li>Name nodes clearly before you reference them.</li>
      <li>Format with JavaScript and Luxon; move long logic to a Code node.</li>
      <li>Pin data to build fast; unpin when the data's shape changes.</li>
      <li>Step through every item in the preview, not just the first.</li>
    </ol>

<p class="lede">Money time. Today Harvest Lane's payments confirm themselves: the payment company rings a webhook, Make double-checks the payment with the payment company's own API, remembers which payments it has already handled, and marks the order paid. These three tools, webhooks, HTTP and data stores, let Make talk to almost anything safely.</p>
<div class="outcomes">
  <div><b>01</b><span>Receive instant data with a custom webhook, and reply with a webhook response.</span></div>
  <div><b>02</b><span>Call any API with the HTTP module, storing keys in a keychain.</span></div>
  <div><b>03</b><span>Use a data store to remember things between runs.</span></div>
  <div><b>04</b><span>Make payment handling safe: verify, deduplicate, and check amounts in kobo.</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 20 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Custom webhooks: instant, and free of polling</h3>
    <p>The <b>Webhooks · Custom webhook</b> trigger gives your scenario a URL. When something sends data to it, the scenario runs straight away, with no polling credits wasted (2.1). Send one sample request first so Make learns the data's shape; if the shape changes later, use "Redetermine data structure".</p>
    <div class="vocab">
      <div><b>Queue</b>If the scenario is off or busy, Make stores incoming requests in a queue and processes them later (within limits), so you don't lose them during maintenance.</div>
      <div><b>Webhook response</b>A module that replies to the sender with a status code and body you choose, e.g. 200 "ok".</div>
      <div><b>Headers</b>In the webhook's advanced settings you can include request headers, needed for checking signatures.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>The HTTP module: call any API</h3>
    <p><b>HTTP · Make a request</b> is Make's version of Hoppscotch (0.2) inside a scenario: method, URL, headers, query string, body type (choose raw JSON for most APIs) and a <b>Parse response</b> switch. Turn parsing on and the JSON reply becomes mappable fields.</p>
    <div class="analogy"><b>Keys go in a keychain.</b> Make's HTTP app has versions that handle authentication, such as an API Key Auth request that stores the key in a <b>keychain</b> (Make's credential store). Never type a secret key straight into a header field where anyone viewing the scenario can read it (0.6).</div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Data stores: Make's memory</h3>
    <p>Scenarios forget everything between runs. A <b>data store</b> is a small database inside Make: records with a <b>key</b> and fields you define. Modules let you add or replace, get, search, check whether a key exists, update, delete and count records.</p>
    <div class="why">
      <div class="box"><h5>Good uses</h5><ul><li>"Have I already handled this payment reference?"</li><li>The last ID processed, so the next run starts after it.</li><li>Small lookup lists that change, like this week's holidays.</li></ul></div>
      <div class="box"><h5>Keep using Sheets for</h5><ul><li>Business records people read: orders, customers.</li><li>Anything needing formulas or sharing.</li><li>Large data: data store size depends on your plan.</li></ul></div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Idempotency: handle each event exactly once</h3>
    <p>Payment companies resend a webhook if they don't get a quick 200 reply, and networks occasionally deliver twice. So the same payment can arrive more than once. An <b>idempotent</b> automation produces the same result whether an event arrives once or five times. The tool: check the data store for the payment reference before acting.</p>
    <div class="tablewrap" data-dedupe='[{"time":"09:12:04","ref":"HL-0061-a1","amount":2650000},{"time":"09:12:31","ref":"HL-0061-a1","amount":2650000},{"time":"09:40:10","ref":"HL-0062-b7","amount":1350000},{"time":"10:05:55","ref":"HL-0063-c2","amount":3550000},{"time":"10:06:20","ref":"HL-0063-c2","amount":3550000},{"time":"10:07:02","ref":"HL-0063-c2","amount":3550000}]'>
      <div style="padding:10px 12px"><label class="check"><input id="dd-2-5" type="checkbox"> Check the data store for the reference first</label></div>
      <table class="dt"><thead><tr><th>#</th><th>Arrived</th><th>Reference</th><th class="n">Amount</th><th>What the scenario did</th></tr></thead><tbody></tbody></table>
      <p class="qscore" data-o="sum" style="padding:10px 12px"></p>
    </div>
    <p style="font-size:.88rem;color:var(--muted)">Six webhooks, three real payments. Toggle the check and watch receipts and counted revenue change.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Verify, don't trust</h3>
    <p>Anyone who finds your webhook URL can post a fake "payment succeeded" message (Glitch's trick). Two defences, both described in Paystack's developer documentation:</p>
    <div class="never">
      <div><b>Verify with the API</b>Take the payment reference and call Paystack's Verify Transaction endpoint with your secret key. Trust only what Paystack itself tells you: status and amount.</div>
      <div><b>Check the signature</b>Paystack signs each webhook with an HMAC-SHA512 hash of the body, sent in the <code>x-paystack-signature</code> header. Recompute it with your secret key and compare.</div>
      <div><b>Check the amount in kobo</b>Paystack amounts are in kobo. The order total ₦26,500 must match 2,650,000. Anything less is not a full payment.</div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 40 MIN</span><h2>Solved problem: payments that confirm themselves, safely</h2></div>
  <div class="prose"><p><b>The goal.</b> When Paystack reports a successful payment, mark the matching order Paid and send one receipt, only if Paystack confirms it, only if the amount is right, and only once per payment. Build it in <b>test mode</b> with test keys (0.6). No real money moves.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Create the data store</h4>
      <p>In Make, create a data store <b>processed_payments</b> with fields <code>order_id</code> (text), <code>amount_kobo</code> (number), <code>processed_at</code> (date). The record key will be the payment reference.</p>
    </div></div>

    <div class="step"><div>
      <h4>Add the webhook and teach it the shape</h4>
      <p>New scenario: <b>Webhooks · Custom webhook</b>. Copy its URL into your Paystack <b>test</b> dashboard's webhook URL setting. To teach Make the data structure, send this sample from Hoppscotch (a simplified charge.success event):</p>
<pre class="codebox">{
  "event": "charge.success",
  "data": {
    "reference": "HL-0061-a1",
    "amount": 2650000,
    "currency": "NGN",
    "status": "success",
    "customer": { "email": "customer@example.com" },
    "metadata": { "order_id": "HL-0061" }
  }
}</pre>
      <p style="font-size:.9rem;color:var(--muted)">The <code>metadata.order_id</code> is something you add when creating the payment link or transaction, so the payment can be matched to its order.</p>
    </div></div>

    <div class="step"><div>
      <h4>Reply quickly, then filter the event</h4>
      <p>Add <b>Webhooks · Webhook response</b> right after the trigger: status 200, body <code>ok</code>. A fast reply stops Paystack retrying. Then add a filter on the next link: <code>event</code> equal to <code>charge.success</code>.</p>
    </div></div>

    <div class="step"><div>
      <h4>Stop duplicates with the data store</h4>
      <p>Add <b>Data store · Check the existence of a record</b>, key = <code>1.data.reference</code>. On the next link, filter: continue only if the record does <b>not</b> exist. Duplicate webhooks stop here, before any work or receipts.</p>
    </div></div>

    <div class="step"><div>
      <h4>Ask Paystack if it's real</h4>
      <p>Add an <b>HTTP</b> request with API key authentication. Store your test secret key in a keychain as an <code>Authorization</code> header with the value <code>Bearer sk_test_…</code>. Method GET, URL:</p>
<pre class="codebox">https://api.paystack.co/transaction/verify/{{1.data.reference}}</pre>
      <p>Turn on <b>Parse response</b>. Filter the next link: <code>data.status</code> (from this HTTP module) equal to <code>success</code>. Glitch's fake message fails here, because Paystack has no such successful transaction.</p>
    </div></div>

    <div class="step"><div>
      <h4>Find the order and check the amount</h4>
      <p><b>Google Sheets · Search Rows</b> in Orders where <code>order_id</code> = <code>1.data.metadata.order_id</code>. Filter the next link with a numeric condition:</p>
<pre class="codebox">HTTP data.amount   equal to   {{search.total * 100}}
<span class="c">2650000 = 26500 × 100  ✓</span></pre>
      <p>Add a second route on a router (2.3) for the mismatch case: amount too low → email Tolu "Partial or wrong payment for HL-0061".</p>
    </div></div>

    <div class="step"><div>
      <h4>Mark paid, remember, and send one receipt</h4>
      <p>On the success route: <b>Update a Row</b> (status Paid, paid_at now), <b>Data store · Add/replace a record</b> (key = reference, plus order_id, amount, time), and <b>Gmail · Send</b> the receipt text from 2.2.</p>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Going further: the signature.</b> For a second layer, include request headers in the webhook settings and pass the raw body through, then compare <code>x-paystack-signature</code> with an HMAC-SHA512 of the raw body using your secret key (Make's text functions include SHA hashing with a key). Paystack's docs describe the exact rule. The verify call alone already blocks fake payments; the signature also blocks fake <i>attempts</i> before they cost you a credit.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Test every case</h4>
      <div class="tablewrap"><table class="dt">
        <thead><tr><th>Test</th><th>How</th><th>Expected</th></tr></thead>
        <tbody>
          <tr><td>Real test payment</td><td>Pay a test link with Paystack's test card</td><td>Order Paid, one receipt, one data store record</td></tr>
          <tr><td>Duplicate</td><td>Resend the same webhook (Paystack dashboard or Hoppscotch)</td><td>Stops at the existence check</td></tr>
          <tr><td>Fake</td><td>POST a made-up reference from Hoppscotch</td><td>Stops at the verify filter</td></tr>
          <tr><td>Wrong amount</td><td>Test payment for less than the order total</td><td>Tolu alerted; order not marked Paid</td></tr>
          <tr><td>Other event</td><td>POST event "transfer.success"</td><td>Stops at the event filter</td></tr>
        </tbody>
      </table></div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Instant webhook, no polling credits.</li><li>The data store makes repeats harmless.</li><li>Only Paystack's own API decides what's paid.</li><li>Kobo-to-naira is checked explicitly, so partial payments are caught.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Trusting the webhook body without verifying.</li><li>Comparing kobo to naira.</li><li>Typing the secret key into a visible header field.</li><li>Replying slowly, so the sender retries and duplicates pile up.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 8 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> My payment scenario has five problems. I'm calling them features.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Customers sometimes get two or three receipts for one payment.</td></tr>
        <tr><td>B</td><td>Every payment is flagged "wrong amount", including correct ones.</td></tr>
        <tr><td>C</td><td>A ₦100 order was marked Paid after someone posted a homemade JSON message.</td></tr>
        <tr><td>D</td><td>The HTTP module's output is one long block of text; <code>data.status</code> can't be mapped.</td></tr>
        <tr><td>E</td><td>A new team member could see the secret key while viewing the scenario.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> no deduplication, and a slow reply makes the sender retry. Check the data store first and respond with 200 early.</li>
        <li><b>B:</b> comparing kobo to naira. Multiply the order total by 100 (or divide Paystack's amount).</li>
        <li><b>C:</b> the webhook body was trusted. Verify with the API and/or check the signature.</li>
        <li><b>D:</b> "Parse response" is off.</li>
        <li><b>E:</b> the key was typed into a header field. Use a keychain with API key authentication.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ TAKEAWAYS ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>

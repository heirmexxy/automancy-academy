    <div class="kicker"><span class="pill">3–4 sessions · 6–8 hours</span><span class="pill">300 XP</span><span class="pill">Badge: Self-Hosted</span><span class="pill">Tools: your self-hosted n8n (3.8), Telegram, Google Sheets, an AI provider</span></div>

<p class="lede">Everything from the Forge, in one product customers actually talk to. Harvest Lane's customers send a Telegram message in their own words; the bot understands it, prices it from the real price list, checks stock, asks when something is unclear, waits for a tap to confirm, logs the order, and gives Tolu a report every evening. It runs on your own server, and it tells you when anything breaks.</p>

<!-- ============ BRIEF ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">THE CLIENT BRIEF</span><h2>What the bot must do</h2></div>
  <div class="concept">
    <div class="tablewrap"><table class="dt">
      <tbody>
        <tr><td><b>Channel</b></td><td>A Telegram bot, <code>@HarvestLaneBot</code> (your own name), running on your self-hosted n8n with HTTPS (3.8).</td></tr>
        <tr><td><b>Understand</b></td><td>Free-text orders in everyday Nigerian English, including Pidgin and common local names (tatashe, rodo, ugu). Questions ("what's the price of onions?") get answers from the price list. Anything else goes politely to Tolu.</td></tr>
        <tr><td><b>Price</b></td><td>Prices and stock come <b>only</b> from the Price_List sheet. Delivery ₦1,500, free from ₦30,000. The AI never sets or changes a price.</td></tr>
        <tr><td><b>Confirm</b></td><td>The bot replies with an itemised summary and <b>Confirm / Change</b> buttons. Only a Confirm tap creates the order. Unclear items, unknown products, missing date or area, or too little stock → the bot asks, and creates nothing.</td></tr>
        <tr><td><b>Guardrails</b></td><td>More than 50 units of anything, or orders over ₦500,000 → Tolu approves. Messages that try to change prices or rules are ignored as instructions.</td></tr>
        <tr><td><b>Record</b></td><td>Confirmed orders go to Orders (with the customer's chat ID and an order number), and stock is reduced. Every conversation step is logged.</td></tr>
        <tr><td><b>Report</b></td><td>At 20:00 daily, Tolu gets a Telegram summary: orders, revenue, top products, low stock, and anything waiting for her.</td></tr>
        <tr><td><b>Reliability</b></td><td>Connected to HL · Error alerts (3.6); retries on outside calls; the uptime monitor (3.8) covers n8n being down. Customers always get a reply, even if it's "Tolu will get back to you".</td></tr>
        <tr><td><b>Privacy</b></td><td>Store only what's needed (chat ID, name, phone, orders). Tell customers in the welcome message that orders are processed with AI help and reviewed by Harvest Lane.</td></tr>
      </tbody>
    </table></div>
  </div>
</section>

<!-- ============ DELIVERABLES ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">YOUR MISSION</span><h2>Eight deliverables, three phases</h2></div>
  <div class="steps">
    <div class="step"><div>
      <h4>Phase 1 · D1 · Bot, server and sheets <span class="soon">(3.1, 3.6, 3.8)</span></h4>
      <p>Create the bot with @BotFather and set a description and welcome text. Sheets: <b>Price_List</b> (sku, name, unit, price, stock, aliases, active), <b>Customers</b> (chat_id, name, phone, area, created_at), <b>Pending</b> (pending_id, chat_id, items_json, total, status, created_at), <b>Orders</b> (order_id, chat_id, items_json, subtotal, delivery_fee, total, delivery_date, area, status, created_at), <b>Conversation_Log</b>. Confirm your n8n's webhook URLs show https (3.8).</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 1 · D2 · Trigger, routing and first contact <span class="soon">(3.3, 3.2)</span></h4>
      <p>One <b>Telegram Trigger</b> listening for messages and callback queries. A <b>Switch</b> on update type: text message, button tap, or anything else (photo, voice, sticker → polite reply + forward to Tolu). Look up the customer by <code>chat.id</code>; new customers are asked for name and phone once (use <code>/start</code> as the trigger for that), then the original question is answered.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 2 · D3 · Understanding <span class="soon">(3.7)</span></h4>
      <p>Text Classifier: order · price question · change or cancel · other (with the Other branch on). For orders, an Information Extractor with a JSON Schema returning the shape used in the order brain above: items (product, qty), delivery_date (YYYY-MM-DD; resolve "tomorrow" using today's date in the system prompt), area. Build a 15-message test set and score it before moving on.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 2 · D4 · Pricing as a sub-workflow <span class="soon">(3.5, 3.6)</span></h4>
      <p><code>SUB · Price an order</code>: reads Price_List, matches products by aliases, checks quantities and stock, applies delivery and the 50-unit and ₦500,000 limits, and returns lines, questions and a route, exactly like the order brain. It's a Code node plus a Sheets read. Reused by the confirm step and your tests.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 2 · D5 · Confirm with buttons <span class="soon">(3.2, 3.3)</span></h4>
      <p>"Ready" orders: save a Pending row, then send the summary with an inline keyboard: <b>✅ Confirm</b> (callback data <code>c:&lt;pending_id&gt;</code>) and <b>✏️ Change</b> (<code>x:&lt;pending_id&gt;</code>). On a tap: answer the callback query (stops the spinner), check the Pending row belongs to this chat and is still open, <b>re-check stock</b>, write Orders with a new order ID, reduce stock, mark Pending done, and reply with the order number and delivery day.</p>
      <details class="reveal"><summary>Hint: Telegram limits</summary><div><p>Callback data is limited to 64 bytes, so send a short ID, not the order. Each tap arrives as a <code>callback_query</code> update with <code>callback_query.data</code> and <code>callback_query.message.chat.id</code>.</p></div></details>
    </div></div>
    <div class="step"><div>
      <h4>Phase 3 · D6 · Daily report <span class="soon">(3.3, 3.5)</span></h4>
      <p>At 20:00: today's confirmed orders and revenue, top three products, items with stock below a threshold, pending orders older than two hours, and messages waiting for Tolu, sent to her on Telegram as one tidy message.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 3 · D7 · Reliability and guardrails <span class="soon">(3.4, 3.6, 3.8)</span></h4>
      <p>Retries on AI and Sheets nodes; every workflow connected to HL · Error alerts; if the AI step fails, the customer still gets "Sorry, we'll reply shortly" and Tolu is alerted. Prompt-injection tests from the test set have no effect on prices or limits. Nightly Git backup includes the bot.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 3 · D8 · Test report, cost and demo</h4>
      <p>Run the 15 conversations below. Report expected vs. actual, tokens per message and AI cost per order, and the monthly server cost compared with what n8n Cloud would need for the same volume. Record a 3-minute demo: a real order from message to Orders row to the evening report.</p>
    </div></div>
  </div>

<!-- ============ CURVEBALLS ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">GLITCH'S CURVEBALLS</span><h2>Open one at the start of each phase</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Real customers are my best assistants.</div></div>

  <div class="part-h"><span class="tag">REFERENCE BUILD</span><h2>Compare only after you've finished</h2></div>
  <div class="say"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><div class="bubble"><b>Nodo:</b> Your bot will look different from mine, and that's fine. Check your design against these answers for the parts that matter.</div></div>

  <details class="reveal"><summary>Curveball answers</summary><div>
    <ol>
      <li><b>Testing steals the webhook:</b> a bot sends its updates to one webhook address. Listening for a test event registers the <i>test</i> URL, replacing the production one until you stop listening and the workflow re-registers. Safe routine: create a second bot (<code>@HarvestLaneTestBot</code>) with its own credential for development, and duplicate the workflow for testing. Never debug on the live bot during business hours.</li>
      <li><b>Ambiguous names:</b> don't put "pepper" in any product's aliases. Give the extractor a rule ("copy the product words exactly; don't map them to our catalogue"), and let the pricing code decide. When a word matches no product or several, the bot asks with buttons: "Which pepper? [Rodo] [Tatashe]". The answer can teach a new alias for that customer.</li>
      <li><b>Races and double taps:</b> at Confirm, read the Pending row first. If its status isn't <code>open</code>, reply "Already confirmed: HL-xxxx" and stop. Otherwise immediately mark it <code>processing</code>, re-read stock, and only then write the order and reduce stock. If stock is now too low, mark the Pending row <code>failed_stock</code> and offer what's left. For high volume, move stock to a database with a proper transaction (Postgres); Sheets is fine at Harvest Lane's size if you re-check like this.</li>
    </ol>
  </div></details>

  <details class="reveal"><summary>D4 · Pricing Code node (all items mode)</summary><div>
<pre class="codebox">// Inputs: the Extract output (items, delivery_date, area) and Price_List rows.
// "Run once for all items" mode has no .item; each run handles one message,
// so .first() is that message. (In "each item" mode, use $('Extract').item.)
const ex = $('Extract').first().json.output;
const products = $('Price_List').all().map(i =&gt; i.json).filter(p =&gt; p.active !== 'no');
const find = w =&gt; {
  const s = String(w ?? '').toLowerCase().trim();
  const hits = products.filter(p =&gt;
    String(p.aliases).toLowerCase().split(',').map(a =&gt; a.trim()).some(a =&gt; a &amp;&amp; s.includes(a)));
  return hits.length === 1 ? hits[0] : null;            // 0 or 2+ matches → ask
};
const lines = [], ask = [], human = [];
for (const it of ex.items ?? []) {
  const p = find(it.product), qty = Number(it.qty);
  if (!p) { ask.push(`Which product do you mean by "${it.product}"?`); continue; }
  if (!Number.isInteger(qty) || qty &lt;= 0) { ask.push(`How many ${p.unit}s of ${p.name}?`); continue; }
  if (qty &gt; 50) { human.push(`${qty} × ${p.name}`); continue; }
  if (qty &gt; Number(p.stock)) { ask.push(`Only ${p.stock} ${p.unit}(s) of ${p.name} left. Shall we send ${p.stock}?`); continue; }
  lines.push({ sku: p.sku, name: p.name, unit: p.unit, qty, price: Number(p.price), line_total: qty * Number(p.price) });
}
if (!ex.delivery_date) ask.push('Which day should we deliver?');
if (!ex.area) ask.push('Which area should we deliver to?');
const subtotal = lines.reduce((s, l) =&gt; s + l.line_total, 0);
const delivery_fee = subtotal &gt;= 30000 ? 0 : 1500;
const total = subtotal + delivery_fee;
if (total &gt; 500000) human.push('order above ₦500,000');
const route = human.length ? 'tolu' : ask.length || !lines.length ? 'ask' : 'ready';
return [{ json: { route, lines, ask, human, subtotal, delivery_fee, total,
                  delivery_date: ex.delivery_date, area: ex.area } }];</pre>
    <p>Note: the AI's output is read only for product words, quantities, date and area. Any "price" field it returns is never used.</p>
  </div></details>

  <details class="reveal"><summary>D5 · The inline keyboard</summary><div>
    <p>In the Telegram node (Send Message), set <b>Reply Markup → Inline Keyboard</b> with one row of two buttons: text <code>✅ Confirm</code>, callback data <code>c:{{ $json.pending_id }}</code>; text <code>✏️ Change</code>, callback data <code>x:{{ $json.pending_id }}</code>. On the button-tap route, split the data: <code>{{ $json.callback_query.data.split(':')[0] }}</code> is the action and <code>[1]</code> is the pending ID. Use Telegram · <b>Answer Query</b> with the callback query ID first, so the customer's button stops spinning.</p>
  </div></details>

  <details class="reveal"><summary>D8 · Self-hosted vs. Cloud: how to compare</summary><div>
    <p>Count executions: every incoming Telegram update starts one run of the bot workflow (messages <i>and</i> button taps), plus one daily report run. Sub-workflow runs don't count towards n8n Cloud's monthly execution limits, per n8n's docs. Example: 60 customers × 4 updates a day × 30 days ≈ 7,200 executions a month, which is more than an entry Cloud plan's allowance as of Oct 2026 (2,500 on Starter). On your server, the cost stays a fixed few dollars a month. Add AI token cost (measured, per order) to both. Check n8n's current pricing before you quote.</p>
  </div></details>

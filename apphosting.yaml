# Firebase App Hosting (https://firebase.google.com/docs/app-hosting) — runs this Next.js app.
# Plain settings are written here; every key is a Cloud Secret Manager secret, set once with:
#   firebase apphosting:secrets:set <NAME>      (then grant access when asked)
# Never put a key's value in this file: it's committed to Git.
runConfig:
  minInstances: 0          # scale to zero when idle (lowest cost); set 1 to avoid cold starts
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024
  timeoutSeconds: 300      # the AI review and the daily WhatsApp job can take a couple of minutes

env:
  # ── Plain settings ──
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://automancy.cc
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPPORT_EMAIL
    value: support@automancy.cc
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_PRIVACY_EMAIL
    value: privacy@automancy.cc
    availability: [BUILD, RUNTIME]
  - variable: EMAIL_FROM
    value: "Automancy Academy <hello@automancy.cc>"
  - variable: ADMIN_EMAILS
    value: PLACEHOLDER-your-email@example.com

  # ── Database and login (Supabase) ──
  - variable: NEXT_PUBLIC_SUPABASE_URL
    secret: NEXT_PUBLIC_SUPABASE_URL
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_SUPABASE_ANON_KEY
    secret: NEXT_PUBLIC_SUPABASE_ANON_KEY
    availability: [BUILD, RUNTIME]
  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY

  # ── Add the rest when you have the key ──
  # Every "secret:" listed here must already exist in Secret Manager, or the build fails. So each block stays
  # commented out until you've run `firebase apphosting:secrets:set <NAME>` for it; then remove the "# " and push.
  # The site works without any of them (see the README table "Without it").

  # Payments (Paystack): test keys first, then live keys at launch
  # - variable: PAYSTACK_SECRET_KEY
  #   secret: PAYSTACK_SECRET_KEY
  # - variable: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
  #   secret: NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY
  #   availability: [BUILD, RUNTIME]

  # Email (Resend)
  # - variable: RESEND_API_KEY
  #   secret: RESEND_API_KEY

  # AI reviewer and Sage (Anthropic)
  # - variable: ANTHROPIC_API_KEY
  #   secret: ANTHROPIC_API_KEY

  # Nigerian voices (Azure Speech)
  # - variable: AZURE_SPEECH_KEY
  #   secret: AZURE_SPEECH_KEY
  # - variable: AZURE_SPEECH_REGION
  #   value: westeurope       # the region of your Azure Speech resource

  # Daily WhatsApp job
  # - variable: CRON_SECRET
  #   secret: CRON_SECRET

  # WhatsApp
  # - variable: WHATSAPP_TOKEN
  #   secret: WHATSAPP_TOKEN
  # - variable: WHATSAPP_PHONE_NUMBER_ID
  #   secret: WHATSAPP_PHONE_NUMBER_ID
  # - variable: WHATSAPP_APP_SECRET
  #   secret: WHATSAPP_APP_SECRET
  # - variable: WHATSAPP_VERIFY_TOKEN
  #   secret: WHATSAPP_VERIFY_TOKEN
  # - variable: WHATSAPP_BUSINESS_NUMBER
  #   value: "2348012345678"   # PLACEHOLDER: the business number, digits with country code

<!-- ============ BRIEF ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">THE CLIENT BRIEF</span><h2>Harvest Lane · facts sheet</h2></div>
  <div class="concept">
    <div class="tablewrap"><table class="dt">
      <tbody>
        <tr><td><b>Volume</b></td><td>About 45 orders a day today, 6 days a week. December forecast: about 130 a day, including the hotel.</td></tr>
        <tr><td><b>Order channels</b></td><td>WhatsApp messages about 70%, the order form about 20%, phone calls about 10%.</td></tr>
        <tr><td><b>New hotel client</b></td><td>Grand Palm Hotel: standing daily order Monday–Saturday, delivered by 7 a.m.; changes emailed by 9 p.m. the night before; one invoice every Friday; pays by bank transfer within 14 days.</td></tr>
        <tr><td><b>People</b></td><td>Tolu (owner), one new part-time admin assistant, four riders with basic Android phones and WhatsApp.</td></tr>
        <tr><td><b>Current tools</b></td><td>Business Google Workspace account; the four-table order sheet from 0.4; Paystack payment links (test mode); WhatsApp Business app; AI provider account with a spending cap.</td></tr>
        <tr><td><b>Pain points</b></td><td>Night-time orders missed until morning; payment checking; tomatoes run out on Saturdays; the hotel invoice will take about 3 hours every Friday if done by hand.</td></tr>
        <tr><td><b>Budget</b></td><td>Up to ₦60,000 a month for tools.</td></tr>
        <tr><td><b>Must-haves</b></td><td>Tolu approves every hotel invoice before it's sent. Customer data rules from 0.6 apply. Riders can't be asked to install new apps.</td></tr>
      </tbody>
    </table></div>
  </div>
</section>

<!-- ============ DELIVERABLES ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">YOUR MISSION</span><h2>Seven deliverables, three phases</h2></div>
  <div class="prose"><p>Work in a folder of Google Docs and Sheets, or on paper and photos. Each deliverable draws on one Base Camp module. Use the hint only if you're stuck for more than 15 minutes.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Phase 1 · D1 · Process maps: now and future <span class="soon">(uses 0.1)</span></h4>
      <p>Two swimlane maps for a normal customer order, and one for the hotel's daily cycle (order → change by email → 7 a.m. delivery → Friday invoice). For each, draw today's process, then the future process with automation steps marked.</p>
      <details class="reveal"><summary>Hint</summary><div><p>Lanes to use: Customer or Hotel · Automation · Tolu/Admin · Rider. In the future map, the Automation lane should do most of the copying and checking; humans keep judgment steps and approvals.</p></div></details>
    </div></div>

    <div class="step"><div>
      <h4>Phase 1 · D2 · Priority table and ROI <span class="soon">(uses 0.1)</span></h4>
      <p>Score every step at December volume (130 orders a day). Pick your top 3–5 automations, check dependencies, and estimate weekly hours saved and monthly value.</p>
      <details class="reveal"><summary>Hint</summary><div><p>Rescale runs per week: 130 × 6 = 780 orders. The hotel invoice runs once a week but is 180 minutes with high error cost; don't let its low frequency hide it.</p></div></details>
    </div></div>

    <div class="step"><div>
      <h4>Phase 2 · D3 · Data model <span class="soon">(uses 0.3, 0.4)</span></h4>
      <p>Extend the four-table model to handle the hotel: standing orders, order changes, and weekly invoices. List every table, its ID format, fields and types. Write one complete hotel order as JSON.</p>
      <details class="reveal"><summary>Hint</summary><div><p>You'll probably need a <code>Standing_Orders</code> table (what the hotel gets by default each day) and an <code>Invoices</code> table. How does an order know which invoice it belongs to?</p></div></details>
    </div></div>

    <div class="step"><div>
      <h4>Phase 2 · D4 · Integration inventory <span class="soon">(uses 0.2, 0.6)</span></h4>
      <p>A table with one row per system the automations must talk to: what triggers or is triggered, polling or webhook, how it authenticates, key type (test/live), and where the secret will live.</p>
      <details class="reveal"><summary>Hint</summary><div><p>Rows to consider: WhatsApp, the order form, Gmail (hotel changes), Google Sheets, Paystack, the AI provider, a weather API, a messaging channel for riders.</p></div></details>
    </div></div>

    <div class="step"><div>
      <h4>Phase 3 · D5 · AI step specification <span class="soon">(uses 0.5)</span></h4>
      <p>Pick one AI step (order extraction is fine, or classifying the hotel's change emails). Write the prompt, a 10-message test set with expected outputs, your measured score, and the checks that run after the AI. Estimate monthly cost at December volume.</p>
      <details class="reveal"><summary>Hint</summary><div><p>At 130 orders a day, about 70% via WhatsApp, the AI step runs roughly 91 times a day, or about 2,400 times a month. Plug that into the estimator in 0.5.</p></div></details>
    </div></div>

    <div class="step"><div>
      <h4>Phase 3 · D6 · Security and data plan <span class="soon">(uses 0.6)</span></h4>
      <p>An access register for every tool and person, the one-page policy adapted for December (new admin, four riders, the hotel), and an incident card.</p>
    </div></div>

    <div class="step"><div>
      <h4>Phase 3 · D7 · One-page blueprint summary</h4>
      <p>The page Tolu would read. What gets automated, in what order, what stays human, total hours saved, monthly tool cost against the ₦60,000 budget, and the main risks.</p>
    </div></div>
  </div>
</section>

<!-- ============ CURVEBALLS ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">GLITCH'S CURVEBALLS</span><h2>Open one at the start of each phase</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Real clients change their minds. Open one of my surprises at the start of each phase and update your blueprint to handle it.</div></div>
    <details class="reveal"><summary>Curveball 1 · open at the start of Phase 1</summary><div><p>The hotel's head chef sometimes phones at 6 a.m. to add items to that morning's delivery. Where does a phone call enter your process, and who records it?</p></div></details>
    <details class="reveal"><summary>Curveball 2 · open at the start of Phase 2</summary><div><p>Tomato prices rise 30% in mid-December. Old orders must keep their old prices; the hotel's contract price stays fixed until January; regular customers pay the new price. Does your data model handle all three?</p></div></details>
    <details class="reveal"><summary>Curveball 3 · open at the start of Phase 3</summary><div><p>A rider's phone is stolen, unlocked, with the riders' WhatsApp group and a shared sheet open. What does your incident card say to do, and what would you change so this hurts less next time?</p></div></details>
  </div>
</section>

<!-- ============ RUBRIC ============ -->
<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">SCORING</span><h2>The rubric: 80 points to win</h2></div>
  <div class="tablewrap"><table class="dt">
    <thead><tr><th>Deliverable</th><th>Full marks when…</th><th class="n">Points</th></tr></thead>
    <tbody>
      <tr><td>D1 Process maps</td><td>Current and future maps for both flows; lanes, decisions and handoffs marked; phone calls handled</td><td class="n">15</td></tr>
      <tr><td>D2 Priorities and ROI</td><td>All steps scored at December volume; dependencies checked; top picks justified; weekly hours and monthly value shown</td><td class="n">15</td></tr>
      <tr><td>D3 Data model</td><td>Every table has an ID and typed fields; standing orders, changes and invoices covered; price changes handled; valid JSON example</td><td class="n">20</td></tr>
      <tr><td>D4 Integrations</td><td>Every system listed with trigger type, auth, key type and secret location</td><td class="n">15</td></tr>
      <tr><td>D5 AI step</td><td>Structured prompt with null rule and example; 10-item test set; measured score; post-AI checks; cost estimate</td><td class="n">15</td></tr>
      <tr><td>D6 Security</td><td>Register covers all tools and people; policy updated for December; incident card handles the stolen phone</td><td class="n">10</td></tr>
      <tr><td>D7 Summary</td><td>Fits one page; order of work, what stays human, hours saved, cost vs. budget, top risks</td><td class="n">10</td></tr>
    </tbody>
    <tfoot><tr><td>Total</td><td>Win at 80 or more</td><td class="n">100</td></tr></tfoot>
  </table></div>

    <p>Submission checklist. Copy it into your blueprint folder and tick as you go.</p>

<!-- ============ REFERENCE SOLUTION ============ -->
<section class="part" style="--c:var(--grape)">
  <div class="part-h"><span class="tag">REFERENCE BLUEPRINT</span><h2>Compare only after you've finished</h2></div>
  <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> There's more than one winning blueprint. Use this to spot gaps in yours, not to copy. If yours differs but you can defend the choice, that's a good sign.</div></div>

  <details class="reveal"><summary>D2 · Top automations, in build order</summary><div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>Automation</th><th>Why this position</th><th>Built in</th></tr></thead>
      <tbody>
        <tr><td>1</td><td>Order capture: form and WhatsApp → AI extraction → checks → Orders + Order_Items → reply with total and payment link</td><td>Highest score; every other automation depends on clean order data</td><td>Track 1, then 3</td></tr>
        <tr><td>2</td><td>Payment confirmation: Paystack webhook → mark Paid → receipt</td><td>High volume, high error cost; needs order IDs from #1</td><td>Tracks 1–2</td></tr>
        <tr><td>3</td><td>Hotel daily cycle: standing order created at 8 p.m. → changes email parsed and applied by 9 p.m. → 5 a.m. rider list</td><td>Contract risk: a missed 7 a.m. delivery could lose the client</td><td>Track 2</td></tr>
        <tr><td>4</td><td>Friday hotel invoice: draft from the week's orders → Tolu approves → send</td><td>3 hours weekly, high error cost; approval required by the brief</td><td>Track 2</td></tr>
        <tr><td>5</td><td>Stock alert: daily stock check against Saturday demand → Tolu restocks on Thursday</td><td>Fixes Saturday stock-outs; uses data from #1</td><td>Track 3</td></tr>
      </tbody>
    </table></div>
    <p><b>Kept human:</b> rider routes, customer complaints, pricing decisions, invoice approval, phone calls (logged by the admin through the order form, so they enter the same pipeline; this also answers Curveball 1).</p>
  </div></details>

  <details class="reveal"><summary>D3 · Data model additions</summary><div>
    <div class="schema">
      <div class="tbl" style="--tc:var(--sky)"><h4>Standing_Orders <small>1 row per hotel product</small></h4><ul><li class="pk"><code>standing_id</code><span>SO-001</span></li><li class="fk"><code>customer_id</code><span>→ Customers</span></li><li class="fk"><code>sku</code><span>→ Products</span></li><li><code>qty</code><span>number</span></li><li><code>days</code><span>text · Mon–Sat</span></li><li><code>contract_price</code><span>number</span></li><li><code>valid_until</code><span>date</span></li></ul></div>
      <div class="tbl" style="--tc:var(--sun)"><h4>Order_Changes <small>1 row per change</small></h4><ul><li class="pk"><code>change_id</code><span>CH-0001</span></li><li class="fk"><code>order_id</code><span>→ Orders</span></li><li><code>source</code><span>email · phone · form</span></li><li><code>change_text</code><span>text</span></li><li><code>applied</code><span>checkbox</span></li><li><code>received_at</code><span>date-time</span></li></ul></div>
      <div class="tbl" style="--tc:var(--volt)"><h4>Invoices <small>1 row per invoice</small></h4><ul><li class="pk"><code>invoice_id</code><span>INV-2026-048</span></li><li class="fk"><code>customer_id</code><span>→ Customers</span></li><li><code>week_start</code><span>date</span></li><li class="fx"><code>total</code><span>formula (SUMIFS)</span></li><li><code>status</code><span>Draft · Approved · Sent · Paid</span></li><li><code>due_date</code><span>date</span></li></ul></div>
      <div class="tbl" style="--tc:var(--grape)"><h4>Changes to existing tables</h4><ul><li><code>Orders.invoice_id</code><span>→ Invoices</span></li><li><code>Orders.channel</code><span>whatsapp · form · phone · standing</span></li><li><code>Orders.needs_confirmation</code><span>checkbox</span></li><li><code>Order_Items.unit_price</code><span>stored at sale (Curveball 2)</span></li></ul></div>
    </div>
    <p><b>Curveball 2:</b> stored <code>unit_price</code> protects old orders; the hotel's price comes from <code>Standing_Orders.contract_price</code> until <code>valid_until</code>; everyone else gets <code>Products.price_ngn</code>.</p>
  </div></details>

  <details class="reveal"><summary>D4 · Integration inventory</summary><div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>System</th><th>Role</th><th>Trigger type</th><th>Auth</th><th>Secret lives in</th></tr></thead>
      <tbody>
        <tr><td>Order form</td><td>New orders in</td><td>Instant (webhook / form trigger)</td><td>OAuth (Google)</td><td>Platform connection</td></tr>
        <tr><td>WhatsApp</td><td>Messages in, replies out</td><td>Webhook (Cloud API, Track 5) · manual forward until then</td><td>Access token</td><td>Platform credential</td></tr>
        <tr><td>Gmail</td><td>Hotel change emails</td><td>Polling every 15 min, 8–9 p.m.</td><td>OAuth, read-only on one label</td><td>Platform connection</td></tr>
        <tr><td>Google Sheets</td><td>Database</td><td>Read/write actions</td><td>OAuth</td><td>Platform connection</td></tr>
        <tr><td>Paystack</td><td>Payment links, confirmations</td><td>Webhook (verified)</td><td>Secret key (test → live)</td><td>Platform credential</td></tr>
        <tr><td>AI provider</td><td>Extraction, classification</td><td>Action</td><td>API key, capped</td><td>Platform credential</td></tr>
        <tr><td>Open-Meteo</td><td>Rain check for riders</td><td>Scheduled GET at 6 p.m.</td><td>None</td><td>n/a</td></tr>
        <tr><td>Telegram or WhatsApp group</td><td>Rider and Tolu alerts</td><td>Action</td><td>Bot token</td><td>Platform credential</td></tr>
      </tbody>
    </table></div>
  </div></details>

  <details class="reveal"><summary>D5, D6, D7 · Highlights</summary><div>
    <ul>
      <li><b>D5:</b> v3 extraction prompt from 0.5, extended with the hotel's SKUs and a rule that hotel emails are changes, not new orders. At about 2,400 calls a month with a small model, estimated cost stays a small fraction of the budget.</li>
      <li><b>D6 (Curveball 3):</b> remove the rider from the group and shared sheet immediately, sign out their Google session, rotate any bot token the group used. Change for next time: riders get view access to a separate “Today's deliveries” file holding only today's addresses, never the main sheet. (Google Sheets shares whole files, not single tabs.)</li>
      <li><b>D7:</b> roughly 50–55 hours saved a week at December volume (the 18 hours from 0.1 scaled to nearly triple the orders, plus the Friday invoice); build order 1 → 5 across Tracks 1–3; humans keep approvals, complaints, routes and pricing; top risks are WhatsApp access, AI misreads (mitigated by checks and the confirmation flag) and a single point of failure in Tolu (mitigated by training the admin assistant).</li>
    </ul>
  </div></details>
</section>

<!-- ============ NEXT ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>What happens to your blueprint</h3>
    <ol>
      <li>Track 1 (Zapier) builds order capture and payment confirmation in their simplest form.</li>
      <li>Track 2 (Make) builds the hotel cycle and the Friday invoice with routers, loops and error handling.</li>
      <li>Track 3 (n8n) rebuilds the busiest flows on your own server, with AI nodes and stock alerts.</li>
      <li>Track 4 adds an agent that answers customers from your policies, with human approval.</li>
    </ol>

  </div>
</section>

    <div class="kicker"><span class="pill">≈ 2 hours</span><span class="pill">100 XP</span><span class="pill">Guide: Nodo</span><span class="pill">Tools: n8n (IF, Switch, Merge, Loop Over Items, Wait), Google Sheets, Gmail</span></div>

<p class="lede">Real workflows don't run in a straight line. They make decisions, join data from two places, and slow down so they don't upset the services they talk to. Five nodes do almost all of this in n8n: IF, Switch, Merge, Loop Over Items and Wait.</p>
<div class="outcomes">
  <div><b>01</b><span>Branch with IF and Switch, including a fallback for anything unexpected.</span></div>
  <div><b>02</b><span>Join two data sources with Merge, and choose the right mode for the job.</span></div>
  <div><b>03</b><span>Process items in batches with Loop Over Items and Wait.</span></div>
  <div><b>04</b><span>Know when you <i>don't</i> need a loop, because n8n already runs once per item.</span></div>
</div>

<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 35 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>IF and Switch: decisions</h3>
    <div class="vocab">
      <div><b>IF</b>Two outputs, <b>true</b> and <b>false</b>. Each item goes to one of them. Conditions have a type (string, number, date, boolean…) and can be combined with AND or OR.</div>
      <div><b>Switch</b>Many outputs, one per rule, for routing several kinds of item. By default an item goes to the first rule it matches; an option sends it to every matching output.</div>
      <div><b>Fallback output</b>Switch can add an extra output for items that match no rule. Use it, and send those items to Tolu, so nothing disappears silently (the 1.3 lesson again).</div>
      <div><b>Filter</b>A one-way IF: items that pass continue and the rest are dropped. Use it when the "false" items need no action at all.</div>
    </div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Switch rule (Harvest Lane orders)</th><th>Output goes to</th></tr></thead>
      <tbody>
        <tr><td><code>{{ $json.total }}</code> ≥ 100000</td><td>0 · Bulk: call the customer to confirm</td></tr>
        <tr><td><code>{{ $json.type }}</code> = subscription</td><td>1 · Add to the weekly box list</td></tr>
        <tr><td><code>{{ $json.type }}</code> = pickup</td><td>2 · Pickup slip</td></tr>
        <tr><td><code>{{ $json.type }}</code> = delivery</td><td>3 · Rider list</td></tr>
        <tr><td>Anything else (fallback)</td><td>4 · Email Tolu</td></tr>
      </tbody>
    </table></div>
    <p style="font-size:.9rem;color:var(--muted)">Order matters: a ₦150,000 delivery matches rules 0 and 3, and goes to Bulk because that rule comes first. That's intended here.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Merge: joining two streams</h3>
    <p>Merge waits for two (or more) inputs and combines them. The modes you'll use most:</p>
    <div class="vocab">
      <div><b>Append</b>Input 1's items, then Input 2's. A simple stack.</div>
      <div><b>Combine · matching fields</b>Pair items whose key fields are equal, like a lookup. Then choose what to output: <b>keep matches</b>, <b>keep non-matches</b>, <b>keep everything</b>, or <b>enrich</b> one input with data from the other.</div>
      <div><b>Combine · by position</b>Item 0 with item 0, 1 with 1… Only safe when both lists are in exactly the same order.</div>
      <div><b>Choose branch</b>Wait for both inputs, then pass on just one. Useful to rejoin after an IF.</div>
    </div>
    <p><b>Try it.</b> Input 1 is this month's unpaid <b>Invoices</b>; Input 2 is <b>Payments</b> received. Find the customers who still need a reminder. Then tick Glitch's box, see what breaks, and fix it by choosing the field Payments now uses.</p>
    <div class="msim" data-merge='{"in1":[{"customer_id":"C-014","name":"Mrs Adebayo","amount":34000},{"customer_id":"C-022","name":"Mr Okafor","amount":4000},{"customer_id":"C-009","name":"Iya Basira","amount":21000},{"customer_id":"C-031","name":"Chef Tunde","amount":58000},{"customer_id":"C-040","name":"Mama Nkechi","amount":12500},{"customer_id":"C-052","name":"Hotel Grace","amount":96000}],"in2":[{"customer_id":"C-022","reference":"PSK-88412","paid":4000},{"customer_id":"C-031","reference":"PSK-88430","paid":58000},{"customer_id":"C-052","reference":"PSK-88451","paid":96000}],"goal":["C-014","C-009","C-040"]}'>
      <div class="row">
        <label>Mode<select data-m="mode">
          <option value="append">Append</option>
          <option value="matches" selected>Combine · keep matches</option>
          <option value="non1">Combine · keep non-matches (output from Input 1)</option>
          <option value="nonboth">Combine · keep non-matches (both inputs)</option>
          <option value="everything">Combine · keep everything</option>
          <option value="enrich1">Combine · enrich Input 1</option>
        </select></label>
        <label>Input 1 field (Invoices)<select data-m="f1"><option selected>customer_id</option><option>name</option></select></label>
        <label>Input 2 field (Payments)<select data-m="f2"><option selected>customer_id</option><option>customerId</option><option>reference</option></select></label>
      </div>
      <label class="check"><input type="checkbox" data-m="glitch"> Glitch renames the Payments column to <code>customerId</code></label>
      <span class="jl-status"></span>
      <div class="mout" aria-live="polite"></div>
      <p class="mgoal" data-o="goal"></p>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Do you even need a loop?</h3>
    <p>Usually not. Most n8n nodes already <b>run once per item</b> (3.2). Feed 200 items into a Gmail node and it sends 200 emails, no loop needed. Reach for <b>Loop Over Items</b> only when you need to:</p>
    <div class="vocab">
      <div><b>Pace the work</b>Send in batches with a pause between them, to respect rate limits or avoid looking like spam.</div>
      <div><b>Handle one item fully before the next</b>For example, a chain of API calls where each must finish first.</div>
      <div><b>Work with a node that only handles one item at a time</b>Some nodes read only the first item; their docs say so.</div>
    </div>
    <figure class="fig"><svg viewBox="0 -24 640 234" role="img" aria-label="Loop Over Items has two outputs: loop, which sends a batch through Build message, Send and Wait and back into Loop Over Items; and done, which runs once all batches are finished and leads to a summary email.">
      <defs><marker id="lp1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--ink)"/></marker></defs>
      <g font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="12" text-anchor="middle">
        <rect x="10" y="70" width="120" height="60" rx="12" fill="var(--sky)" stroke="var(--ink)" stroke-width="2.5"/><text x="70" y="96" fill="#fff">Loop Over</text><text x="70" y="112" fill="#fff">Items (20)</text>
        <rect x="190" y="20" width="110" height="50" rx="12" fill="var(--grape)" stroke="var(--ink)" stroke-width="2"/><text x="245" y="50" fill="#fff">Build message</text>
        <rect x="340" y="20" width="110" height="50" rx="12" fill="var(--volt)" stroke="var(--ink)" stroke-width="2"/><text x="395" y="50" fill="#13233A">Send</text>
        <rect x="490" y="20" width="110" height="50" rx="12" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/><text x="545" y="50" fill="#13233A">Wait 60 s</text>
        <rect x="190" y="140" width="150" height="50" rx="12" fill="var(--spark)" stroke="var(--ink)" stroke-width="2"/><text x="265" y="170" fill="#fff">Summary to Tolu</text>
      </g>
      <g stroke="var(--ink)" stroke-width="2.5" fill="none">
        <path d="M132 85 C160 85 160 45 186 45" marker-end="url(#lp1)"/>
        <path d="M301 45 H336" marker-end="url(#lp1)"/><path d="M451 45 H486" marker-end="url(#lp1)"/>
        <path d="M601 45 H625 V-8 H70 V66" stroke-dasharray="6 5" marker-end="url(#lp1)"/>
        <path d="M132 115 C160 115 160 165 186 165" marker-end="url(#lp1)"/>
      </g>
      <g font-family="JetBrains Mono,monospace" font-size="10" fill="var(--muted)"><text x="140" y="70">loop</text><text x="140" y="146">done</text><text x="250" y="-13">back to the loop for the next batch</text></g>
    </svg><figcaption>The loop output carries one batch at a time; the last node in the batch connects back into Loop Over Items. The done output fires once, after the final batch, carrying all processed items.</figcaption></figure>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Wait, and planning the pace</h3>
    <p>The <b>Wait</b> node pauses the run: for a time interval, until a set date and time, or until a webhook or form submission arrives (useful for "wait until Tolu approves", Track 4). On n8n Cloud, a run with waits is still <b>one execution</b>. Plan the pace with numbers, not guesses. The limit below is an example; use your messaging provider's real one.</p>
    <div class="tokcalc" data-batch>
      <h4>Batch planner</h4>
      <div class="row">
        <label>Messages to send<input data-b="n" type="number" value="200" min="1"></label>
        <label>Batch size<input data-b="size" type="number" value="20" min="1"></label>
        <label>Wait between batches (seconds)<input data-b="wait" type="number" value="60" min="0"></label>
        <label>Provider limit (messages per minute)<input data-b="limit" type="number" value="30" min="1"></label>
      </div>
      <div class="stats">
        <div class="stat"><b data-o="batches">–</b><span>batches</span></div>
        <div class="stat"><b data-o="time">–</b><span>total waiting time</span></div>
        <div class="stat"><b data-o="rate">–</b><span>most messages in any one minute (approx.)</span></div>
      </div>
      <p class="mgoal" data-o="verdict"></p>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Edit Fields: the glue</h3>
    <p>Between flow-control nodes you'll constantly reshape items with <b>Edit Fields (Set)</b>: rename a column so two sources share a key, add a computed field, or keep only the fields the next node needs (turn off <b>Include Other Input Fields</b>). Small, tidy items make every Merge and IF easier to read.</p>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><div class="bubble"><b>Nodo:</b> When two sources call the same thing by different names (<code>customer_id</code> and <code>customerId</code>), fix it with Edit Fields <i>before</i> the Merge, or simply pick the right field on each side in the Merge itself. Never rename the sheet's column to suit one workflow; another workflow may depend on it.</div></div>
  </div>
</section>

  <div class="steps">
    <div class="step"><div>
      <h4>Two sources, in parallel</h4>
      <p>Add a <b>Schedule Trigger</b> (weekly, Monday, 09:00). Connect it to two Google Sheets nodes: <b>Invoices</b> (Get Row(s) where <code>status</code> = Unpaid) and <b>Payments</b> (Get Row(s) from the payments log you built in 2.5, or a test sheet). Both run from the same trigger. Pin both outputs.</p>
    </div></div>

    <div class="step"><div>
      <h4>Cross off the payers with Merge</h4>
      <p>Add <b>Merge</b>. Connect Invoices to <b>Input 1</b> and Payments to <b>Input 2</b>. Mode: <b>Combine</b> → by <b>matching fields</b>, <code>customer_id</code> on both sides. Output type: <b>keep non-matches</b>, with output data from <b>Input 1</b>. Result: invoices with no matching payment, exactly the simulator's goal in Card 2.</p>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#weave"/></svg><p><b>A Weave-style alternative:</b> Merge with "enrich Input 1", then an IF on "reference is empty". It's one node longer, but it lets you also catch <i>partial</i> payments (paid &lt; amount) in a third branch. Choose the one you can explain.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Set aside the ones you can't reach</h4>
      <p>Add <b>IF</b>: <code>{{ $json.phone }}</code> · String · <b>is not empty</b>. The <b>false</b> output goes to Google Sheets · Append Row on a <b>Fix list</b> sheet, so Tolu can collect missing numbers. Nothing is silently dropped.</p>
    </div></div>

    <div class="step"><div>
      <h4>Batch, send, wait, loop back</h4>
      <p>From IF's <b>true</b> output, add <b>Loop Over Items</b> with batch size <b>20</b>. From its <b>loop</b> output:</p>
      <ol>
        <li><b>Edit Fields · Build message</b>: <code>Good morning {{ $json.name }}, a gentle reminder that invoice {{ $json.invoice_id }} for ₦{{ Number($json.amount).toLocaleString('en-NG') }} is due. Pay here: {{ $json.pay_link }}. Thank you for buying from Harvest Lane!</code></li>
        <li><b>Google Sheets · Append Row · Send (log)</b>: customer_id, phone, message, and <code>sent_at</code> = <code>{{ $now.toFormat('HH:mm:ss') }}</code>.</li>
        <li><b>Wait</b>: 60 seconds.</li>
        <li>Drag a connection from Wait's output <b>back into Loop Over Items</b>.</li>
      </ol>
      <p>Test with pinned data and a batch size of 2 and a wait of 5 seconds (so you're not waiting 10 minutes). The Sent log's <code>sent_at</code> times should come in clusters, one per batch.</p>
    </div></div>

    <div class="step"><div>
      <h4>One summary at the end</h4>
      <p>From the <b>done</b> output, add <b>Gmail · Send</b> to Tolu: <code>Reminders sent: {{ $input.all().length }}</code>. The done output carries <i>all</i> processed items, so Gmail would send one email per item. In the Gmail node's <b>Settings</b>, turn on <b>Execute Once</b>. Then set the batch back to 20 and the wait to 60, save and publish.</p>
      <div class="stats">
        <div class="stat"><b>10</b><span>batches for 200 reminders</span></div>
        <div class="stat"><b>≈9 min</b><span>of waiting, never more than 20 a minute</span></div>
        <div class="stat"><b>1</b><span>execution on n8n Cloud for the whole run</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Merge on a real key removes payers before a single message is built.</li><li>Every item ends somewhere visible: sent, on the Fix list, or in the summary.</li><li>The batch size and wait come from the provider's limit, calculated rather than guessed.</li><li>Testing with tiny batches and short waits makes the loop quick to check.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Adding a loop where n8n already runs once per item.</li><li>Forgetting to connect the last node back into Loop Over Items.</li><li>Putting the Wait after "done" instead of inside the loop.</li><li>Sending a summary per item instead of once.</li><li>Matching on name instead of an ID: two "Mrs Adebayo"s exist.</li></ul></div>
  </div>
</section>

<!-- ============ TAKEAWAYS ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>IF splits in two; Switch routes many ways. Always give Switch a fallback.</li>
      <li>Merge joins streams: append, or combine on a shared key (and pick what to keep).</li>
      <li>Match on IDs, never on names.</li>
      <li>You rarely need a loop. Use Loop Over Items to pace work or handle items one at a time.</li>
      <li>Wire the end of the batch back into the loop; put Wait inside it.</li>
      <li>"done" carries every item: use Execute Once for a single summary.</li>
    </ol>
  </div>

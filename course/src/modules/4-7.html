    <span class="eyebrow">Track 4 · Sage's Tower (Agentic AI) · Lesson 4.7</span>
    <h1>Multi-Agent Systems</h1>
    <div class="kicker"><span class="pill">≈ 2 hours</span><span class="pill">100 XP</span><span class="pill">Guide: Sage</span><span class="pill">Tools: n8n AI Agent and AI Agent Tool nodes, Google Sheets, Gmail</span></div>
  </div>
  <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#sage"/></svg>
</header>
<p class="lede">One agent with one brief does one job well. Some work is really several jobs: research, then writing, then editing. Splitting it across specialist agents can raise quality, but every extra agent adds cost, delay and new ways to fail. This module covers the main team shapes, when a team beats a single agent, and how to stop agents passing work back and forth forever.</p>
<div class="outcomes">
  <div><b>01</b><span>Recognise the main patterns: pipeline, router, orchestrator–workers and reviewer loop.</span></div>
  <div><b>02</b><span>Decide when several agents beat one, using cost and quality, not excitement.</span></div>
  <div><b>03</b><span>Build a researcher → writer → editor team in n8n with a capped review loop.</span></div>
  <div><b>04</b><span>Pass clean, structured hand-offs between agents.</span></div>
</div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>When is a team worth it?</h3>
    <p>Anthropic's write-up of its own multi-agent research system reports that, in its data, agents used about <b>4×</b> the tokens of a chat, and multi-agent systems about <b>15×</b>. The same article says teams suit work that splits into independent parallel parts, or that's too big for one context, and fit poorly where every agent needs the same shared context.</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Use a team when…</th><th>Stay with one agent (or a workflow) when…</th></tr></thead>
      <tbody>
        <tr><td>Jobs need different instructions, tools or models (a strict fact-checker vs. a warm writer)</td><td>One brief covers the whole job</td></tr>
        <tr><td>Parts can run in parallel (research five markets at once)</td><td>Each step depends tightly on the previous one</td></tr>
        <tr><td>A separate reviewer clearly catches mistakes the author misses</td><td>A checklist in code would catch them more cheaply</td></tr>
        <tr><td>The value of better output is high (a client newsletter, a report)</td><td>The task is quick and cheap (classify one email)</td></tr>
      </tbody>
    </table></div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Hand-offs are contracts</h3>
    <p>Agents fail at the joins. Pass <b>structured</b> data between them, not chat:</p>
<pre class="codebox"><span class="c">// Researcher → Writer: facts only, every number sourced</span>
{ "week": "2026-10-05",
  "items": [ { "product": "Tomatoes", "price_now": 12500, "price_last_week": 10400,
               "change_pct": 20.2, "source": "Agro Depot price list, 5 Oct" } ],
  "notes": ["Rainy week: leafy greens wilting faster"] }

<span class="c">// Editor → Writer (or → human): a verdict, not an essay</span>
{ "approved": false,
  "issues": ["Ugu price 15,000 doesn't match research (1,500)",
             "Paragraph 3 over 60 words"] }</pre>
    <p>Use structured output (an Output Parser or Information Extractor with a schema) so each hand-off can be checked by code: are all prices present, is every change sourced, is <code>approved</code> a real true/false?</p>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Count the cost of a team</h3>
    <p>Change the settings and watch what a newsletter team costs, and what happens without a cap on review rounds. The price is a placeholder; use your provider's current rate.</p>
    <div class="tokcalc" data-team>
      <div class="row">
        <label>Researcher model calls<input data-tm="res" type="number" value="6" min="0"></label>
        <label>Average tokens per call<input data-tm="tok" type="number" value="6000" min="0" step="500"></label>
        <label>Editor approves a draft (%)<input data-tm="p" type="number" value="60" min="0" max="100"></label>
        <label>Max review rounds<select data-tm="cap" style="font-family:var(--mono);font-size:.9rem;border:1.5px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--paper);color:var(--ink);width:100%"><option value="0">0 (no review)</option><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="none">No cap (Glitch's)</option></select></label>
        <label>Price, $ per million tokens (placeholder)<input data-tm="price" type="number" value="3" min="0" step="0.5"></label>
      </div>
      <div class="stats">
        <div class="stat"><b data-o="calls">–</b><span>expected model calls per issue</span></div>
        <div class="stat"><b data-o="tok">–</b><span>expected tokens per issue</span></div>
        <div class="stat"><b data-o="cost">–</b><span>cost per issue / per month (4 issues)</span></div>
      </div>
      <p class="mgoal" data-o="verdict"></p>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Building teams in n8n</h3>
    <div class="vocab">
      <div><b>Fixed pipeline</b>Several AI Agent (or LLM Chain) nodes in a row, each with its own system message and model. The workflow, not an agent, decides the order. Most predictable; start here.</div>
      <div><b>Agents as tools</b>The <b>AI Agent Tool</b> sub-node lets a lead agent call specialist agents as tools, on one canvas. Or use Call n8n Workflow tools that each run an agent workflow.</div>
      <div><b>Different models per role</b>A small, cheap model for the researcher's lookups; a stronger one for writing; a careful one for editing.</div>
      <div><b>Caps everywhere</b>Max iterations on every agent, a fixed number of review rounds, and a timeout on the workflow.</div>
      <div><b>Code frameworks</b>CrewAI and LangGraph build the same patterns in Python (4.8). The ideas transfer.</div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 45 MIN</span><h2>Solved problem: the newsletter team</h2></div>
  <div class="prose"><p><b>The goal.</b> Every Monday at 06:00, a three-agent pipeline produces "This week at the market": price moves from Harvest Lane's own data, a short readable note, and an edit pass, with at most two revision rounds. The result lands in Gmail as a <b>draft</b> for Tolu to send.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>The researcher: facts in a fixed shape</h4>
      <p><b>Schedule Trigger</b> (Monday 06:00) → <b>AI Agent · Researcher</b> with read-only tools: <code>get_price_history</code> (the 3.4 Supplier prices sheet, this week vs. last) and <code>get_top_sellers</code> (Orders, last 7 days). A small model, temperature 0, and a <b>Structured Output Parser</b> requiring the Card 3 research shape. System message: <i>"Collect facts only. Every price must come from a tool result, with its source. No opinions, no advice."</i></p>
    </div></div>

    <div class="step"><div>
      <h4>Check the hand-off in code</h4>
      <p>A <b>Code</b> node checks the research: every item has <code>price_now</code>, <code>price_last_week</code> and <code>source</code>; <code>change_pct</code> is recalculated in code and overwritten. Anything missing → stop and alert Tolu (3.6). Facts must be right before anyone writes.</p>
    </div></div>

    <div class="step"><div>
      <h4>The writer: voice and brevity</h4>
      <p><b>AI Agent · Writer</b>, no tools, a stronger model. It receives the checked research and a short style guide: <i>"Warm, practical, Nigerian English; 180–250 words; headline, three 'cheaper this week' and three 'dearer this week' items with naira prices, one tip for restaurants. Use only numbers from the research."</i></p>
    </div></div>

    <div class="step"><div>
      <h4>The editor, and a hard cap</h4>
      <p><b>AI Agent · Editor</b> with a checklist and a structured verdict (<code>approved</code>, <code>issues</code>): every number matches the research, the length is within range, there's no advice beyond buying tips, and the tone is right. Then:</p>
      <ol>
        <li><b>IF</b> approved → draft. Otherwise → <b>Writer (revision 1)</b> gets the draft plus the issues → <b>Editor</b> again.</li>
        <li><b>IF</b> approved → draft. Otherwise → <b>Writer (revision 2)</b> → <b>Editor</b>.</li>
        <li>After round 2, whatever the verdict: <b>Gmail · Create a draft</b> to Tolu. If still not approved, the subject starts with "⚠ Needs a human look", and the editor's issues are listed at the top.</li>
      </ol>
      <p>Unrolling the rounds as nodes makes the cap impossible to miss. Set Max Iterations on each agent and a workflow timeout too.</p>
      <div class="stats">
        <div class="stat"><b>3</b><span>agents, each with one job and one brief</span></div>
        <div class="stat"><b>2</b><span>review rounds maximum, then a human</span></div>
        <div class="stat"><b>3 h → 5 min</b><span>Tolu's Sunday night, now a Monday read-through</span></div>
      </div>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Nodo's test:</b> build a single-agent version too, and compare five weeks' newsletters on accuracy (numbers correct), Tolu's edit time and token cost. If the team doesn't clearly win, use the single agent. That decision is the skill.</p></div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Each agent has one job, one brief and the right model.</li><li>Structured hand-offs let code catch errors between agents.</li><li>Prices are verified in code before writing starts.</li><li>The review loop is capped, and ends with a human.</li><li>The output is a draft, never an automatic send.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>A team where one agent would do.</li><li>Agents chatting in free text instead of structured hand-offs.</li><li>An editor with no checklist ("make it better").</li><li>No cap on review rounds.</li><li>Every agent on the most expensive model.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> More agents, more places to hide. Five finds.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>The writer and editor exchanged 37 drafts overnight. The workflow timed out and the bill jumped.</td></tr>
        <tr><td>B</td><td>The newsletter says ugu costs ₦15,000. The research said ₦1,500.</td></tr>
        <tr><td>C</td><td>The editor approves everything, including a 600-word draft full of advice.</td></tr>
        <tr><td>D</td><td>The writer can't find the prices: the researcher returned a friendly paragraph.</td></tr>
        <tr><td>E</td><td>The team version costs 12× more than one agent, and Tolu edits both versions about equally.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> no cap on review rounds, and an editor told never to be satisfied. Cap rounds at 1–2, then hand to a person.</li>
        <li><b>B:</b> nobody checked numbers against the research. Give the editor that check, and better still, check numbers in code after writing.</li>
        <li><b>C:</b> a vague editor brief. Give a concrete checklist and a structured verdict.</li>
        <li><b>D:</b> an unstructured hand-off. Require a schema (Output Parser) for the research.</li>
        <li><b>E:</b> the team doesn't earn its cost. Go back to one agent (or a workflow with one AI step). Not every job needs a team.</li>
      </ol>
    </div></details>
  </div>
</section>

<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">PART 6 · 20 MIN+</span><h2>Missions</h2></div>

  <div class="mission">
    <span class="tier t-b">BRONZE · +25 XP</span>
    <h4>A router with two specialists</h4>
    <ul><li>Build a front-desk agent that hands customer messages to one of two specialists through AI Agent Tool nodes: an orders agent (4.2 tools) and a policy agent (4.4 search).</li><li>Test with ten messages, five for each.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>At least nine of ten reach the right specialist (check the execution trace), and the front desk never answers policy questions itself.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-s">SILVER · +50 XP</span>
    <h4>Add a reviewer to something you've built</h4>
    <ul><li>Take an AI step from an earlier module (the 3.7 draft replies, or the 4.4 policy answers) and add a reviewer agent with a checklist and a structured verdict.</li><li>Cap it at one revision round. Run 10 cases with and without the reviewer.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>Your log shows the error count with and without the reviewer, the extra cost per case, and a keep-or-remove decision.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-g">GOLD · +100 XP</span>
    <h4>A multi-agent design for a real client</h4>
    <ul><li>On paper, design a team for a real client task: roles, models, tools, hand-off schemas, caps, human checkpoints and an estimated cost per run (use Card 4).</li><li>Write the single-agent alternative and explain which you'd recommend, and why.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>The design fits on one page, every hand-off has a schema, every loop has a cap, and the recommendation is backed by the cost and quality trade-off.</li></ul>
  </div>
</section>

<!-- ============ TAKEAWAYS ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Four shapes: pipeline, router, orchestrator–workers, reviewer loop.</li>
      <li>Teams cost far more; use them when parts are independent or roles truly differ.</li>
      <li>Hand-offs are contracts: structured, and checked by code.</li>
      <li>One job, one brief, and the right-sized model per agent.</li>
      <li>Cap every loop, then hand to a human.</li>
      <li>Compare against one agent, and keep the simpler setup unless the team clearly wins.</li>
    </ol>

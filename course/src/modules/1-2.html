    <h1>Multi-Step Zaps &amp; Formatter</h1>
    <div class="kicker"><span class="pill">≈ 100 minutes</span><span class="pill">100 XP</span><span class="pill">Guide: Bolt</span><span class="pill">Needs: multi-step Zaps (paid plan or trial)</span></div>
  </div>
  <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#bolt"/></svg>

<p class="lede">Real orders arrive messy: phone numbers in five styles, dates in three, prices nowhere. Today you build one Zap that cleans the order, looks up the price, adds the delivery fee, calculates the total, saves it and tells Tolu, in nine steps.</p>
<div class="outcomes">
  <div><b>01</b><span>Chain several steps, using any earlier step's data in later ones.</span></div>
  <div><b>02</b><span>Clean phone numbers, dates, text and money with Formatter.</span></div>
  <div><b>03</b><span>Look values up in a table or a sheet, with a safe fallback.</span></div>
  <div><b>04</b><span>Keep machine values (35500) separate from display values (₦35,500).</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 20 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Multi-step Zaps: data flows downhill</h3>
    <p>A multi-step Zap has one trigger and any number of actions. Each step can use the output of <b>any step above it</b>, not just the one directly above. Steps are numbered, and pills show which step they came from (for example "2. Output").</p>
    <div class="analogy"><b>Think of a production line.</b> The order enters at the top. Each station does one job and passes the tray down. Any station can look at what every earlier station added to the tray.</div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#bolt"/></svg><div class="bubble"><b>Bolt:</b> Multi-step Zaps need a paid plan. New accounts usually get a free trial of paid features; check your account. If you're on the free plan, read along and use the chaining trick from 1.1, or come back when you're ready to upgrade.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Formatter: Zapier's cleaning station</h3>
    <p><b>Formatter by Zapier</b> is a built-in app. Pick an event (Text, Numbers, Date/Time or Utilities), then a <b>transform</b>. Formatter steps don't use tasks.</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Family</th><th>Useful transforms</th><th>Harvest Lane example</th></tr></thead>
      <tbody>
        <tr><td><b>Text</b></td><td>Capitalize, Trim Whitespace, Replace, Split Text, Extract Pattern, Default Value</td><td>"mrs ADEBAYO " → "Mrs Adebayo"</td></tr>
        <tr><td><b>Numbers</b></td><td>Format Phone Number, Format Currency, Format Number, Spreadsheet-Style Formula</td><td>0803… → +234803…; qty × price + fee</td></tr>
        <tr><td><b>Date/Time</b></td><td>Format (with time zones), Add/Subtract Time</td><td>"6/10/2026" → "2026-10-06"; delivery = order + 1 day</td></tr>
        <tr><td><b>Utilities</b></td><td>Lookup Table, Line Itemizer, Pick from List</td><td>Area → delivery fee</td></tr>
      </tbody>
    </table></div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Dates and time zones, again</h3>
    <p>Most data from apps carries a time zone, and Zapier converts using your account's time zone setting unless you say otherwise. Set your Zapier account time zone to <b>Africa/Lagos</b> first; then, in a Date/Time Format step, set the output format to <code>YYYY-MM-DD</code> for dates you'll store (Module 0.3).</p>
    <div class="analogy"><b>A quick sanity test:</b> submit a test form at a time you note down, then check the timestamp Zapier shows. If it's an hour off, the time zone setting is the culprit.</div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Lookups: a table inside the Zap, or a sheet outside it</h3>
    <div class="why">
      <div class="box"><h5>Formatter Lookup Table</h5><ul><li>A small key → value list typed into the step.</li><li>Always set a <b>fallback</b> for unknown keys.</li><li>Best for short lists that rarely change: area → delivery fee.</li></ul></div>
      <div class="box"><h5>Google Sheets · Lookup Spreadsheet Row</h5><ul><li>Searches a column in your sheet and returns the whole row.</li><li>Best for data that changes: product prices, stock.</li><li>Tolu updates the sheet; the Zap always uses today's price.</li></ul></div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Store for machines, format for humans</h3>
    <p>Remember from 0.3: money is stored as a plain number. So calculate and save <code>35500</code>, and only create <code>₦35,500.00</code> with Format Currency for the email a person reads. Store the formatted version and the sheet can't add it up.</p>
    <div class="vocab">
      <div><b>Delay by Zapier</b>Wait a set time, or until a date, before continuing. E.g. a thank-you message the day after delivery.</div>
      <div><b>Digest by Zapier</b>Collect items over time and release them together, e.g. one 6 p.m. summary instead of 40 alerts. Check it's included in your plan.</div>
      <div><b>Name your steps</b>Rename "Formatter" to "Clean phone". Future-you will read this Zap at midnight.</div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 35 MIN</span><h2>Solved problem: the one-Zap order line</h2></div>
  <div class="prose"><p><b>The goal.</b> A customer submits the order form. One Zap cleans the data, looks up the product's price in the Products sheet, adds the delivery fee for their area, calculates the total, saves a clean row to Orders, and emails Tolu a readable summary. Use the form from 1.1 Bronze, with an <b>Area</b> dropdown added.</p></div>

  <figure class="fig"><svg viewBox="0 0 440 460" style="min-width:0" role="img" aria-label="The nine-step Zap as a vertical flow: form response; clean phone; clean date; look up product in sheet; delivery fee lookup table; total formula; format currency; create Orders row; send email to Tolu. Steps 4, 8 and 9 use tasks.">
    <g font-family="Atkinson Hyperlegible,sans-serif" font-size="13">
      <g><rect x="0" y="8" width="340" height="40" rx="10" fill="var(--glitch)" opacity=".9"/><text x="12" y="33" fill="#fff" font-weight="700">1 · Google Forms · New Form Response</text></g>
      <g><rect x="0" y="58" width="340" height="40" rx="10" fill="var(--sun)"/><text x="12" y="83" fill="#13233A">2 · Formatter · Numbers · Format Phone Number</text></g>
      <g><rect x="0" y="108" width="340" height="40" rx="10" fill="var(--sun)"/><text x="12" y="133" fill="#13233A">3 · Formatter · Date/Time · Format</text></g>
      <g><rect x="0" y="158" width="340" height="40" rx="10" fill="var(--volt)"/><text x="12" y="183" fill="#13233A">4 · Sheets · Lookup Spreadsheet Row (Products)</text></g>
      <g><rect x="0" y="208" width="340" height="40" rx="10" fill="var(--sun)"/><text x="12" y="233" fill="#13233A">5 · Formatter · Utilities · Lookup Table (fee)</text></g>
      <g><rect x="0" y="258" width="340" height="40" rx="10" fill="var(--sun)"/><text x="12" y="283" fill="#13233A">6 · Formatter · Numbers · Spreadsheet Formula</text></g>
      <g><rect x="0" y="308" width="340" height="40" rx="10" fill="var(--sun)"/><text x="12" y="333" fill="#13233A">7 · Formatter · Numbers · Format Currency</text></g>
      <g><rect x="0" y="358" width="340" height="40" rx="10" fill="var(--volt)"/><text x="12" y="383" fill="#13233A">8 · Sheets · Create Spreadsheet Row (Orders)</text></g>
      <g><rect x="0" y="408" width="340" height="40" rx="10" fill="var(--volt)"/><text x="12" y="433" fill="#13233A">9 · Gmail · Send Email to Tolu</text></g>
    </g>
    <g font-family="JetBrains Mono,monospace" font-size="11" fill="var(--muted)">
      <text x="350" y="83">no task</text><text x="350" y="133">no task</text><text x="350" y="183" fill="var(--volt)">app step</text><text x="350" y="233">no task</text><text x="350" y="283">no task</text><text x="350" y="333">no task</text><text x="350" y="383" fill="var(--volt)">app step</text><text x="350" y="433" fill="var(--volt)">app step</text>
    </g>
    <text x="0" y="456" font-family="JetBrains Mono,monospace" font-size="11" fill="var(--muted)">yellow = Formatter (no tasks) · green = app steps</text>
  </svg><figcaption>Nine steps, but only the app steps count toward your task allowance. Check exact task counting for searches on Zapier's pricing page.</figcaption></figure>

  <div class="steps">
    <div class="step"><div>
      <h4>Trigger and a real test response</h4>
      <p>Trigger: <b>Google Forms · New Form Response</b>. Submit a deliberately messy test: name "mrs ADEBAYO ", phone "0803 123 4567", product "Tomatoes (crate)", quantity 2, date 6 October, area Bodija. Messy test data proves your cleaning steps work.</p>
    </div></div>

    <div class="step"><div>
      <h4>Clean the phone number</h4>
      <p>Add <b>Formatter · Numbers · Format Phone Number</b>. Input: the phone pill. Country code: Nigeria (NG). Output format: the international format without spaces (shown as E.164 or similar, e.g. <code>+2348031234567</code>). Rename the step "Clean phone".</p>
    </div></div>

    <div class="step"><div>
      <h4>Clean the delivery date</h4>
      <p>Add <b>Formatter · Date/Time · Format</b>. Input: the date pill. To Format: <code>YYYY-MM-DD</code>. To Timezone: Africa/Lagos. Result: <code>2026-10-06</code>. Rename it "Clean date".</p>
    </div></div>

    <div class="step"><div>
      <h4>Look up today's price in the Products sheet</h4>
      <p>Add <b>Google Sheets · Lookup Spreadsheet Row</b>. Spreadsheet: your 0.4 workbook; Worksheet: Products; Lookup column: <code>name</code>; Lookup value: the product pill. The step returns the whole row, so you now have <code>sku</code> and <code>price_ngn</code> (12500). Tick the option to stop or flag the Zap if nothing is found, so an unknown product never slips through with no price.</p>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#weave"/></svg><p><b>Why the sheet, not a lookup table?</b> Prices change. Tolu edits one cell in Products, and every future order uses the new price, while old orders keep what they paid (0.4).</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Delivery fee from a lookup table</h4>
      <p>Add <b>Formatter · Utilities · Lookup Table</b>. Lookup key: the Area pill.</p>
      <div class="tablewrap"><table class="dt" style="min-width:0"><thead><tr><th>Key</th><th class="n">Value</th></tr></thead><tbody>
        <tr><td>Bodija</td><td class="n">1500</td></tr><tr><td>Mokola</td><td class="n">1500</td></tr><tr><td>Ring Road</td><td class="n">1500</td></tr><tr><td>Challenge</td><td class="n">2000</td></tr><tr><td><i>Fallback value</i></td><td class="n">2500</td></tr>
      </tbody></table></div>
      <p>The fallback charges a safe default for any new area instead of leaving the fee blank.</p>
    </div></div>

    <div class="step"><div>
      <h4>Calculate the total</h4>
      <p>Add <b>Formatter · Numbers · Spreadsheet-Style Formula</b>. Build it from pills:</p>
<pre class="codebox">[quantity pill] * [price_ngn pill from step 4] + [value pill from step 5]
<span class="c">→ 2 * 12500 + 1500 = 26500</span></pre>
    </div></div>

    <div class="step"><div>
      <h4>Make a display version of the total</h4>
      <p>Add <b>Formatter · Numbers · Format Currency</b>. Input: step 6's output. Currency: NGN, locale English (Nigeria) if listed. Result: something like <code>₦26,500.00</code>. This is only for the email.</p>
    </div></div>

    <div class="step"><div>
      <h4>Save the clean row</h4>
      <p>Add <b>Google Sheets · Create Spreadsheet Row</b> into Orders. Map the <i>clean</i> values: phone from step 2, date from step 3, sku and unit price from step 4, fee from step 5, <b>total from step 6</b> (the plain number), status "New".</p>
    </div></div>

    <div class="step"><div>
      <h4>Tell Tolu, then publish</h4>
      <p>Add <b>Gmail · Send Email</b>. Subject: <code>New order · [name] · [date from step 3] · [currency from step 7]</code>. Body: each field on its own line. Test each step top to bottom, name the Zap <b>HL · Form order → Sheet + alert</b>, and publish.</p>
      <div class="stats">
        <div class="stat"><b>1 Zap</b><span>instead of two chained ones</span></div>
        <div class="stat"><b>0</b><span>manual steps from form to sheet to alert</span></div>
        <div class="stat"><b>26500</b><span>stored as a number; ₦26,500 shown to Tolu</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Cleaning happens once, at the top, so every later step gets good data.</li><li>Prices come from the sheet Tolu controls.</li><li>Fallbacks mean new areas and typos never create blank fees.</li><li>Machine and human versions of the total are kept apart.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Mapping the raw phone pill (step 1) instead of the cleaned one (step 2).</li><li>Saving the currency-formatted total in the sheet.</li><li>No fallback in the lookup table.</li><li>Leaving steps named "Formatter", "Formatter", "Formatter".</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 8 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I copied your Zap and "tidied" it. Five rows came out wrong. Diagnose each.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>Field in the Orders sheet</th><th>What's there</th><th>Expected</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>created_at</td><td>2026-10-06 07:14</td><td>2026-10-06 08:14</td></tr>
        <tr><td>B</td><td>phone</td><td>0803 123 4567</td><td>+2348031234567</td></tr>
        <tr><td>C</td><td>total</td><td>₦26,500.00</td><td>26500</td></tr>
        <tr><td>D</td><td>delivery_fee</td><td>(blank) for area "Apete"</td><td>2500</td></tr>
        <tr><td>E</td><td>unit_price</td><td>12500 for an order placed after Tolu raised tomatoes to 14000</td><td>14000</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> one hour behind: the Zapier account time zone isn't Africa/Lagos, or the Format step's To Timezone is UTC.</li>
        <li><b>B:</b> the raw phone pill from step 1 was mapped instead of step 2's output.</li>
        <li><b>C:</b> the display value from Format Currency (step 7) was saved instead of step 6's plain number.</li>
        <li><b>D:</b> the lookup table has no fallback value.</li>
        <li><b>E:</b> Glitch swapped the Sheets lookup for a lookup table with prices typed in, so price changes in the sheet are ignored.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ MISSIONS ============ -->
<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">PART 6 · 20 MIN+</span><h2>Missions</h2></div>

  <div class="mission">
    <span class="tier t-b">BRONZE · +25 XP</span>
    <h4>A name-cleaning line</h4>
    <ul><li>Add Formatter steps to your 1.1 Bronze Zap (or a new one) that trim spaces and capitalise names, then split them into first and last name.</li><li>Test with "  mrs ADEBAYO ", "tunde bakare", and "MAMA KEMI".</li></ul>
    <span class="crit">Done when</span>
    <ul><li>All three come out neatly capitalised with no stray spaces, in separate first and last name columns.</li></ul>
    <details class="reveal"><summary>Hint</summary><div><p>Order matters: Trim Whitespace, then Capitalize, then Split Text on a space. For "Split Text", choose which segment you want (first or last) in each step, or return all segments.</p></div></details>
  </div>

  <div class="mission">
    <span class="tier t-s">SILVER · +50 XP</span>
    <h4>Rebuild the solved Zap and prove the maths</h4>
    <ul><li>Build the nine-step Zap with your own products and areas.</li><li>Submit three test orders: a normal one, one from a new area (fallback fee), and one after you change a price in Products.</li><li>Check each total by hand, and confirm the sheet stores numbers while the email shows naira.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>All three totals are correct, and the price change shows up only in the order placed after it.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-g">GOLD · +100 XP</span>
    <h4>The 6 p.m. summary</h4>

  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Any step can use data from any step above it.</li>
      <li>Clean data once, near the top, and map the cleaned version afterwards.</li>
      <li>Formatter: Text, Numbers, Date/Time, Utilities. Built-in, and free of tasks.</li>
      <li>Short, stable lists go in a lookup table with a fallback; changing data comes from the sheet.</li>
      <li>Store 35500; show ₦35,500.</li>
      <li>Name every step so the Zap reads like a recipe.</li>

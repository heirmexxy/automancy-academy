<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 20 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Copilot: describe it, then audit it</h3>
    <p>Zapier's <b>Copilot</b> builds a draft Zap (or fixes a step) from a plain-language description. It's fast, and it's a draft: it can pick the wrong trigger, the wrong sheet, or a text pill where a file is needed.</p>
    <div class="vocab">
      <div><b>Describe precisely</b>Name apps, labels, folders and fields: "Gmail label Invoices → Drive folder Supplier invoices, file name = sender + subject".</div>
      <div><b>Audit every step</b>Check each card with the four questions from 1.1: app, event, account, fields.</div>
      <div><b>Test before publishing</b>Use real test data, then read Zap history.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Zapier Agents: a teammate with tools</h3>
    <p>A Zap follows fixed steps. A <b>Zapier Agent</b> gets <b>instructions</b> (its job and rules), <b>tools</b> (actions it may take in your apps), <b>knowledge</b> (documents or tables it can read) and <b>triggers</b> (what wakes it up), then decides for itself which tools to use for each request. This is the agent loop you'll study deeply in Track 4.</p>
    <div class="analogy"><b>Usage is counted in activities, not tasks.</b> Each trigger, action, knowledge lookup, web search or browse counts as one activity. Zapier's help centre (Oct 2026) lists 400 activities a month on the free Agents plan (testing counts) and 1,500 on Agents Pro (testing doesn't count). Check current limits before you plan a client build.</div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> Give an agent the <i>fewest</i> tools that do the job, and never a tool that can't be undone without a person approving it. Reading prices: fine. Sending refunds: ask a human.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Zapier MCP: your AI assistant, with hands</h3>
    <p>The <b>Model Context Protocol (MCP)</b> is an open standard for connecting AI assistants to tools. <b>Zapier MCP</b> lets an assistant such as Claude, ChatGPT, Cursor or VS Code use actions in your connected apps. You can let tools be added automatically, or choose a fixed, tightly scoped set, which is the safer choice.</p>
    <figure class="fig"><svg viewBox="0 0 640 170" role="img" aria-label="An AI assistant sends a tool call through Zapier MCP, which runs one approved action (look up an order row) in Google Sheets and returns the result.">
      <defs><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--ink)"/></marker></defs>
      <rect x="10" y="50" width="150" height="70" rx="14" fill="var(--grape)" stroke="var(--ink)" stroke-width="2"/><text x="85" y="82" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="14" fill="#fff">AI assistant</text><text x="85" y="102" text-anchor="middle" font-family="Atkinson Hyperlegible,sans-serif" font-size="11" fill="#fff">"Status of HL-0043?"</text>
      <path d="M160 72 H236" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#h1)"/><text x="198" y="62" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="var(--muted)">tool call</text>
      <rect x="240" y="30" width="170" height="110" rx="14" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/><text x="325" y="56" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="14" fill="#13233A">Zapier MCP</text>
      <g font-family="JetBrains Mono,monospace" font-size="10" fill="#13233A"><text x="254" y="82">✓ Sheets: lookup row</text><text x="254" y="100">✓ Gmail: create draft</text><text x="254" y="118" opacity=".5">✗ Gmail: send</text><text x="254" y="134" opacity=".5">✗ Sheets: delete row</text></g>
      <path d="M410 72 H486" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#h1)"/>
      <rect x="490" y="50" width="140" height="70" rx="14" fill="var(--volt)" stroke="var(--ink)" stroke-width="2"/><text x="560" y="90" text-anchor="middle" font-family="Bricolage Grotesque,sans-serif" font-weight="800" font-size="14" fill="#13233A">Google Sheets</text>
      <path d="M486 104 H414" stroke="var(--spark)" stroke-width="2.5" marker-end="url(#h1)"/><path d="M236 104 H164" stroke="var(--spark)" stroke-width="2.5" marker-end="url(#h1)"/><text x="198" y="124" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="10" fill="var(--muted)">result</text>
    </svg><figcaption>Only the ticked tools exist for the assistant. Read and draft: yes. Send and delete: not without you.</figcaption></figure>
    <p style="font-size:.9rem;color:var(--muted)">Per Zapier's help centre, Zapier MCP runs on your existing plan (including Free), and each successful tool call uses two tasks; failed calls use none.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Three ways platforms count</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th></th><th>What's counted</th><th>One Harvest Lane order costs roughly…</th></tr></thead>
      <tbody>
        <tr><td><b>Zapier</b></td><td>Tasks: each successful action (built-in tools like Formatter and Paths are free)</td><td>3–4 tasks (lookups, two sheet writes, an email)</td></tr>
        <tr><td><b>Make</b> (Track 2)</td><td>Credits: each module action counts, once per bundle; filters and routers are free per Make's help centre (some guides disagree: check a run's credit count), and a polling trigger costs a credit even when it finds nothing</td><td>6–8 credits (most modules count)</td></tr>
        <tr><td><b>n8n</b> (Track 3)</td><td>Cloud: executions (one per workflow run, however many steps). Self-hosted: your server cost</td><td>1 execution, or a share of a fixed server bill</td></tr>
      </tbody>
    </table></div>
    <div class="analogy"><b>The pattern:</b> Zapier is quickest to build and charges per useful action. Make charges less per unit but counts more of them (and counts polling checks). n8n charges per run, or almost nothing if you host it, in exchange for more setup and maintenance. Always check each platform's current pricing page before advising a client.</div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>When to move off Zapier</h3>
    <div class="why">
      <div class="box"><h5>Stay on Zapier when</h5><ul><li>Volume is modest and the task bill is comfortable.</li><li>Speed of building matters more than cost.</li><li>You need a niche app only Zapier connects to.</li><li>The client wants the simplest thing to maintain.</li></ul></div>
      <div class="box"><h5>Consider Make or n8n when</h5><ul><li>Many steps × high volume makes the task bill painful.</li><li>You need loops over lists, complex branching or detailed error handling.</li><li>Data must stay on your own server (n8n self-hosted).</li><li>Heavy AI work runs thousands of times a month.</li></ul></div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 40 MIN</span><h2>Solved problem: three new helpers, and a cost decision</h2></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Part A · Rebuild the invoice Zap with Copilot</h4>
      <p>Open Copilot and type: <i>"When an email with an attachment arrives in Gmail with the label Invoices, upload the attachment to the Google Drive folder Supplier invoices, naming the file with the sender name, subject and attachment name."</i></p>
      <p>Compare the draft with your hand-built Zap from 1.1, card by card. Typical things to fix: the trigger event (New Email instead of New Attachment), the File field mapped to a name instead of the file, or no <code>-in:sent</code>. Fix, test, and only then publish.</p>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#bolt"/></svg><p><b>The lesson:</b> Copilot saves typing, not thinking. Because you built this Zap by hand in 1.1, you can spot what's wrong in seconds. That's why this module comes last.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Part B · A price-and-delivery agent that drafts, never sends</h4>
      <p>Create a Zapier Agent called <b>HL Customer Helper</b>.</p>
<pre class="codebox"><span class="c"># INSTRUCTIONS</span>
You answer customer questions for Harvest Lane, a produce delivery
business in Ibadan. Answer only about prices, delivery areas, fees and
delivery days.
- Get prices ONLY from the Products table. Never guess a price.
- Get delivery fees and areas ONLY from the Delivery Areas table.
- If a question is about a refund, complaint or anything else,
  write "HANDOVER" and a one-line summary for staff.
- Write a short, friendly draft reply. Do not send anything.
- Save the draft to HL Inbox with status "Draft ready" (add this option to the status dropdown from 1.5).

<span class="c"># TRIGGER</span>   New HL Inbox record where category = question
<span class="c"># TOOLS</span>     Tables: find record (Products, Delivery Areas)
            Tables: update record (HL Inbox)
<span class="c"># NOT GIVEN</span> Gmail send · Sheets delete · anything payment-related</pre>
      <p>Test it with 10 questions from your 0.5 Silver list (the "question" ones plus a refund request). Check that every price matches the table, the refund becomes a HANDOVER, and nothing is sent. Kemi approves drafts with the button from 1.5 Gold.</p>
      <p style="font-size:.9rem;color:var(--muted)">Activity estimate: 1 trigger + 1–2 lookups + 1 update ≈ 3–4 activities per question. 10 questions a day ≈ 1,000 a month, so plan for a paid Agents allowance at that volume.</p>
    </div></div>

    <div class="step"><div>
      <h4>Part C · Let an AI assistant act through Zapier MCP</h4>
      <p>Set up a Zapier MCP server with a <b>fixed</b> set of just two tools: <b>Google Sheets · Lookup Spreadsheet Row</b> (Orders) and <b>Gmail · Create Draft</b>. Connect it to your AI assistant using the steps Zapier shows for that client. Then ask:</p>
      <div class="bubble"><b>Tolu:</b> What's the status of order HL-0043? Draft a short update email to the customer, but don't send it.</div>
      <p>The assistant calls the lookup tool, reads the row, and creates a Gmail draft. Two successful tool calls = four tasks. Open Gmail: the draft is waiting for you to check and send.</p>
    </div></div>

    <div class="step"><div>
      <h4>Part D · Do the December maths</h4>
      <p>At about 3,000 orders a month, how much does each platform count? Change the numbers to match your own workflow; add prices from each platform's current pricing page for a rough cost.</p>
      <div class="tokcalc" data-plat>
        <div class="row">
          <label>Workflow runs per month<input id="plat-runs" data-p="runs" type="number" value="3000" min="0"></label>
          <label>Zapier tasks per run<input id="plat-zt" data-p="zt" type="number" value="4" min="0"></label>
          <label>Make credits per run<input id="plat-mo" data-p="mo" type="number" value="7" min="0"></label>
          <label>n8n executions per run<input id="plat-ne" data-p="ne" type="number" value="1" min="0"></label>
          <label>Zapier $ per 1,000 tasks (optional)<input id="plat-zp" data-p="zp" type="number" value="" min="0" step="0.5" placeholder="from pricing page"></label>
          <label>Make $ per 1,000 credits (optional)<input id="plat-mp" data-p="mp" type="number" value="" min="0" step="0.5" placeholder="from pricing page"></label>
          <label>n8n Cloud $ per 1,000 executions (optional)<input id="plat-np" data-p="np" type="number" value="" min="0" step="0.5" placeholder="from pricing page"></label>
          <label>Self-hosted server $ per month (optional)<input id="plat-vps" data-p="vps" type="number" value="" min="0" step="1" placeholder="e.g. a small VPS"></label>
        </div>
        <div class="stats"></div>
      </div>
      <p>For Harvest Lane, 12,000 Zapier tasks a month is a real cost, and the order line is exactly the kind of multi-step, high-volume flow that Make and n8n handle cheaply. The decision: keep simple, low-volume Zaps (invoices, the MCP helper) on Zapier; rebuild the order line in Make (Track 2) and later n8n (Track 3), and compare.</p>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Copilot drafts; your 1.1–1.5 skills audit.</li><li>The agent reads data it's given and drafts; people approve.</li><li>A fixed MCP tool set keeps the assistant's reach small.</li><li>Counting units per platform turns "Zapier is expensive" into a decision with numbers.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Publishing a Copilot draft without testing it.</li><li>Giving an agent "send" or "delete" tools on day one.</li><li>Letting MCP add any tool automatically on a business account.</li><li>Comparing platforms by monthly plan price instead of units needed.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 8 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> I gave my agents and assistants everything they could possibly need. Why is everyone upset?</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>Glitch's setup</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Agent instructions: "Help customers however you can."</td><td>It promised a 20% discount and free delivery.</td></tr>
        <tr><td>B</td><td>Agent tools include Gmail · Send and Paystack refunds.</td><td>A polite-sounding message got a ₦40,000 refund, sent automatically.</td></tr>
        <tr><td>C</td><td>MCP set to add tools automatically, on the owner's main account.</td><td>The assistant deleted old rows while "tidying" the Orders sheet.</td></tr>
        <tr><td>D</td><td>A Copilot-built Zap published straight away.</td><td>Orders went into last year's sheet.</td></tr>
        <tr><td>E</td><td>Budget assumed MCP calls are free.</td><td>The task allowance ran out mid-month.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> vague instructions. State the job, the allowed topics, where facts come from, and what to hand over.</li>
        <li><b>B:</b> an irreversible, money-moving tool with no human approval. Remove it; draft and hand over instead (Track 4.5 goes deep on this).</li>
        <li><b>C:</b> unscoped tools. Use a fixed tool set, read-and-draft only, ideally on a business account with limited sheet access.</li>
        <li><b>D:</b> no audit. Check every card and test with real data before publishing.</li>
        <li><b>E:</b> each successful MCP tool call uses two tasks. Include it in the budget.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ MISSIONS ============ -->
<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">PART 6 · 20 MIN+</span><h2>Missions</h2></div>

  <div class="mission">
    <span class="tier t-b">BRONZE · +25 XP</span>
    <h4>Copilot audit</h4>
    <ul><li>Describe one of your earlier Zaps (1.2 or 1.3) to Copilot in two sentences.</li><li>List every difference between its draft and your hand-built version.</li><li>Fix the draft until it passes your original tests.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>You have a list of at least three differences and a working, tested Copilot version.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-s">SILVER · +50 XP</span>
    <h4>Build and test the HL Customer Helper</h4>
    <ul><li>Build the agent from Part B with Products and Delivery Areas tables.</li><li>Test with 12 questions: 8 about prices or delivery, 2 complaints, 1 refund request, 1 in Pidgin.</li><li>Record correct answers, correct handovers, and activities used.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>Every price and fee matches the tables, all 3 non-price messages are handed over, and nothing was sent automatically.</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-g">GOLD · +100 XP</span>
    <h4>Your own MCP helper and a platform recommendation</h4>
    <ul><li>Connect Zapier MCP to an AI assistant with 2–3 read-or-draft tools from your own work.</li><li>Complete five real tasks through it, logging tools called and tasks used.</li><li>Use the calculator with your busiest workflow and real prices from each pricing page. Write a half-page recommendation: which platform for which workflow, and why.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>No tool can send, delete or pay, and your recommendation cites units per month and current prices.</li></ul>
  </div>
</section>

<!-- ============ QUIZ ============ -->
<section class="part" style="--c:#D4DDE3">
  <div class="part-h"><span class="tag">PART 7 · 5 MIN</span><h2>Checkpoint quiz</h2></div>

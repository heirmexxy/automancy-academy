    <div class="kicker"><span class="pill">≈ 110 minutes</span><span class="pill">100 XP</span><span class="pill">Guides: Weave and Sage</span><span class="pill">Tools: Make, an AI provider, Google Drive</span></div>

<p class="lede">Every supplier sends invoices in a different layout: neat PDFs, phone photos, even handwritten slips. Today Sage reads them all inside a Make scenario, pulls out every line, and Weave checks the arithmetic before anything reaches the books. Then you'll meet Make's AI agents, which decide for themselves which tools to use.</p>
<div class="outcomes">
  <div><b>01</b><span>Choose between Make's built-in AI, a provider app, and an AI agent.</span></div>
  <div><b>02</b><span>Extract structured data from documents, including scanned ones.</span></div>
  <div><b>03</b><span>Check AI output with rules, and send doubtful results to a person.</span></div>
  <div><b>04</b><span>Build a read-only Make AI Agent that answers questions using your scenarios as tools.</span></div>
</div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 20 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Three ways to use AI in Make</h3>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>Option</th><th>What it is</th><th>How it's paid for</th><th>Best for</th></tr></thead>
      <tbody>
        <tr><td><b>Make's built-in AI</b></td><td>Make AI tools (extract, categorise, summarise…) and the AI Content Extractor for documents, using Make's own AI provider</td><td>Credits, including extra credits based on token use</td><td>Quick starts with no separate AI account</td></tr>
        <tr><td><b>Provider apps</b></td><td>OpenAI, Anthropic (Claude), Google Gemini and others, connected with your own API key</td><td>The provider bills tokens; Make charges the module's credit</td><td>Control over the model, and predictable token billing</td></tr>
        <tr><td><b>Make AI Agents</b></td><td>An agent with instructions, a model and tools (modules, scenarios, MCP), run from a scenario</td><td>Credits for the agent's work plus model usage</td><td>Tasks where the steps vary each time</td></tr>
      </tbody>
    </table></div>
    <p style="font-size:.88rem;color:var(--muted)">Billing summary from Make's help centre (Oct 2026). Make AI Agents is in open beta: Make's own AI provider works on every plan, while connecting another provider to an agent needs a paid plan. Check current credit usage for AI before quoting a client.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Structured output in Make</h3>
    <p>Same idea as 0.5 and 1.5: the AI must return JSON in a fixed shape. In Make, two habits make it mappable:</p>
    <div class="vocab">
      <div><b>Use JSON mode or structured output</b>if the provider module offers it, so the model is held to valid JSON.</div>
      <div><b>Parse it with a data structure</b>Add <b>JSON · Parse JSON</b> and define a data structure (or generate one from a sample). Now <code>supplier</code>, <code>total</code> and <code>lines[]</code> appear as fields you can map and iterate (2.4).</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Getting text out of documents</h3>
    <div class="why">
      <div class="box"><h5>Text PDFs</h5><ul><li>Generated by software; the text is inside the file.</li><li>Extraction is reliable; any capable model can then structure it.</li></ul></div>
      <div class="box"><h5>Scans and photos</h5><ul><li>Pictures of text. They need OCR (optical character recognition) or a model that reads images.</li><li>Expect more mistakes, especially handwriting. Check harder.</li></ul></div>
    </div>
    <div class="analogy"><b>Privacy check (0.6):</b> invoices contain supplier bank details and prices. Send only the files you need, use a provider whose API data terms you've read, and never paste invoices into a free chat app to test.</div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Rules check the AI</h3>
    <p>Invoices carry their own proof: the numbers must add up. Run these rules after every extraction, and only save automatically when all pass:</p>
    <div class="never">
      <div><b>Each line</b>qty × unit price = line total (within ₦1 for rounding).</div>
      <div><b>The sum</b>Line totals add up to the subtotal, and subtotal + VAT = total.</div>
      <div><b>The basics</b>Supplier, invoice number and an ISO date are present; the supplier is on your supplier list.</div>
    </div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#weave"/></svg><div class="bubble"><b>Weave:</b> VAT in Nigeria is 7.5%, but not every supplier charges it. I flag "VAT isn't 7.5%" as a note for Tolu, not an error. Rules should match how your business really works.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Make AI Agents</h3>
    <p>An agent in Make has a <b>system prompt</b> (its job and rules), a <b>model connection</b>, and <b>tools</b>: Make modules, whole scenarios, or MCP toolboxes. A scenario runs it with the <b>Run an agent</b> module; a <b>thread ID</b> lets it remember a conversation; it can return structured output; and it can use knowledge files you attach.</p>
    <div class="why">
      <div class="box"><h5>Use a scenario when</h5><ul><li>The steps are the same every time (invoice extraction).</li><li>You need predictable cost and easy testing.</li></ul></div>
      <div class="box"><h5>Use an agent when</h5><ul><li>Requests vary: "How much did we spend on tomatoes last month?" vs "Which supplier raised prices?"</li><li>The agent can pick from safe, read-only tools.</li></ul></div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 40 MIN</span><h2>Solved problem: invoices into the books, checked</h2></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Watch the invoice folder</h4>
      <p>Trigger: <b>Google Drive · Watch Files in a Folder</b> on "Supplier invoices" (the folder your 1.1 Zap fills). Then <b>Google Drive · Download a File</b>. Schedule hourly in business hours (2.1).</p>
    </div></div>

    <div class="step"><div>
      <h4>Ask the AI for the invoice as JSON</h4>
      <p>Use a provider module that accepts files or images (or extract the text first with Make's AI Content Extractor). Prompt:</p>
<pre class="codebox">You extract supplier invoices for Harvest Lane, a produce business in
Nigeria. Read the attached invoice (it may be a PDF, a photo or handwritten).
Return ONLY JSON in exactly this shape:
{ "supplier": string, "invoice_number": string|null,
  "invoice_date": "YYYY-MM-DD"|null, "currency": "NGN",
  "lines": [ { "description": string, "qty": number,
               "unit_price": number, "line_total": number } ],
  "subtotal": number|null, "vat": number|null, "total": number|null,
  "unreadable_parts": [string] }
Rules: numbers without ₦ or commas. If a value is unclear or missing,
use null and describe it in unreadable_parts. Never guess a number.</pre>
      <p>Then <b>JSON · Parse JSON</b> with a data structure generated from the clean sample in the playground.</p>
    </div></div>

    <div class="step"><div>
      <h4>Check the arithmetic</h4>
      <p><b>Iterator</b> on <code>lines</code>, then a <b>Numeric aggregator</b> (SUM of line_total, source = iterator). In the same iterator section, a <b>Set variable</b> or text aggregator collects any line where <code>qty * unit_price</code> differs from <code>line_total</code> by more than 1 (2.2 maths in a field). After the aggregators, one <b>router</b> (2.3):</p>
      <div class="tablewrap"><table class="dt" style="min-width:0"><thead><tr><th>Route</th><th>Filter</th><th>Action</th></tr></thead><tbody>
        <tr><td>Auto-save</td><td>no bad lines AND sum = subtotal (±1) AND subtotal + vat = total (±1) AND invoice_number exists AND unreadable_parts is empty</td><td>Add rows to Supplier_Invoices and Invoice_Lines</td></tr>
        <tr><td>Fallback · Review</td><td>anything else</td><td>Add to Needs_Review with the reasons and the Drive link; email Tolu</td></tr>
      </tbody></table></div>
    </div></div>

    <div class="step"><div>
      <h4>Protect the AI step</h4>
      <p>Add an error handler on the AI module (2.6): alert, then <b>Break</b> with two retries. If the provider is down, invoices wait instead of disappearing.</p>
    </div></div>

    <div class="step"><div>
      <h4>Test with five real-world layouts</h4>
      <div class="tablewrap"><table class="dt">
        <thead><tr><th>Invoice</th><th>Type</th><th>Expected route (example result)</th></tr></thead>
        <tbody>
          <tr><td>Farmgate Supplies</td><td>Software PDF</td><td>Auto-save</td></tr>
          <tr><td>Ibadan Onion Co.</td><td>Software PDF, two pages</td><td>Auto-save</td></tr>
          <tr><td>Green Basket</td><td>Scanned PDF</td><td>Auto-save</td></tr>
          <tr><td>Hotel produce co-op</td><td>Photo of printed invoice</td><td>Auto-save</td></tr>
          <tr><td>Mama Bisi Farm</td><td>Photo of handwritten slip</td><td>Review (no invoice number, unclear digit)</td></tr>
        </tbody>
      </table></div>
      <div class="stats">
        <div class="stat"><b>4 of 5</b><span>saved automatically (example result)</span></div>
        <div class="stat"><b>1</b><span>sent to Tolu with exact reasons</span></div>
        <div class="stat"><b>≈ 3 h → 20 min</b><span>month-end typing, now reviewing exceptions</span></div>
      </div>
    </div></div>

    <div class="step"><div>
      <h4>Bonus: an "Ask Weave" agent over the invoice data</h4>
      <p>Create a Make AI Agent with this system prompt: <i>"You answer Tolu's questions about supplier spending using only the tools provided. Never change data. If the tools can't answer, say so."</i> Give it one tool: a small scenario that searches Invoice_Lines by supplier, product and date range and returns totals. Run it from a scenario triggered by Telegram messages from Tolu's account only, with the chat ID as thread ID.</p>
      <div class="bubble"><b>Tolu:</b> How much did we spend on tomatoes from Farmgate in October? <br><b>Agent:</b> ₦540,000 across 3 invoices (FG-0188, FG-0192, FG-0197).</div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>The AI reads; arithmetic checks prove what it read.</li><li>"null plus a reason" turns guesses into review items.</li><li>Only clean invoices skip a human; exceptions arrive explained.</li><li>The agent is read-only, scoped to one tool, and to Tolu's account.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Saving AI output with no arithmetic check.</li><li>Asking for totals but not line items (nothing to verify against).</li><li>Skipping Parse JSON, so fields aren't mappable.</li><li>Giving an agent tools that can write or delete.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 8 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> My invoice robot is "nearly perfect". Five issues to find.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>The books were ₦9,000 off for a month before anyone noticed.</td></tr>
        <tr><td>B</td><td>The AI's answer arrived as one long text field; nothing could be mapped.</td></tr>
        <tr><td>C</td><td>A handwritten slip was saved with invoice number "INV-001", which doesn't exist.</td></tr>
        <tr><td>D</td><td>The "Ask Weave" agent deleted a duplicate invoice row when asked to "clean up".</td></tr>
        <tr><td>E</td><td>A staff member tested by uploading 40 real invoices to a free chat website.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> no arithmetic check, so a misread digit went straight to the books.</li>
        <li><b>B:</b> no Parse JSON with a data structure after the AI step.</li>
        <li><b>C:</b> no "use null, never guess" rule; the model invented a plausible number.</li>
        <li><b>D:</b> the agent had a write/delete tool. Give agents read-only tools unless a human approves changes.</li>
        <li><b>E:</b> real supplier data in an unapproved tool (0.6). Practise with samples; use the provider API with known data terms.</li>
      </ol>
    </div></details>
  </div>
</section>

  <div class="part-h"><span class="tag">PART 7 · 5 MIN</span><h2>Checkpoint quiz</h2></div>
  <div class="quiz">
    <div class="q" data-ans="b"><p>1. After an AI module returns invoice JSON, what makes its fields mappable in Make?</p><div class="opts">
      <button type="button" data-opt="a">A router</button><button type="button" data-opt="b">JSON · Parse JSON with a data structure</button><button type="button" data-opt="c">A webhook</button><button type="button" data-opt="d">Formatting it as currency</button></div>
      <p class="fb" hidden data-why="Parse JSON turns text into fields and arrays you can map and iterate."></p></div>
    <div class="q" data-ans="d"><p>2. What's the best proof that the AI read an invoice correctly?</p><div class="opts">
      <button type="button" data-opt="a">The AI says it's confident</button><button type="button" data-opt="b">Using the most expensive model</button><button type="button" data-opt="c">A longer prompt</button><button type="button" data-opt="d">Line totals, subtotal, VAT and total all add up</button></div>

  <div><b>03</b><span>Handle numbers, phone numbers and dates without silent errors.</span></div>

<!-- ============ CONCEPTS ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 30 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>What goes in, what must come out</h3>
    <p>The Code node has two modes:</p>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th></th><th>Run Once for All Items (default)</th><th>Run Once for Each Item</th></tr></thead>
      <tbody>
        <tr><td>Runs</td><td>Once, with every item</td><td>Once per item</td></tr>
        <tr><td>Read input</td><td><code>$input.all()</code> → a list of items, each <code>{ json: {...} }</code></td><td><code>$json</code> (or <code>$input.item.json</code>) → this item's fields</td></tr>
        <tr><td>Return</td><td>A <b>list</b> of items: <code>return [{ json: {...} }, …]</code></td><td><b>One</b> item: <code>return { json: {...} }</code></td></tr>
        <tr><td>Use for</td><td>Totals, grouping, de-duplicating, sorting: anything that compares items</td><td>Cleaning or reshaping each item on its own</td></tr>
      </tbody>
    </table></div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><div class="bubble"><b>Nodo:</b> The one strict rule: in all-items mode, return an array of objects. Not a number, not a list of names, not nothing. If you see "Code doesn't return items properly", check your <code>return</code> line first.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Four patterns that do most of the work</h3>
<pre class="codebox"><span class="c">// 1. Loop: visit every item</span>
<span class="k">for (const item of $input.all()) { const o = item.json; … }</span>

<span class="c">// 2. map: one new item for each old one</span>
<span class="k">return $input.all().map(i =&gt; ({ json: { name: i.json.name.trim() } }));</span>

<span class="c">// 3. filter: keep only some</span>
<span class="k">return $input.all().filter(i =&gt; Number(i.json.total) &gt;= 30000);</span>

<span class="c">// 4. Group with an object (the key is what you group by)</span>
<span class="k">const byArea = {};</span>
<span class="k">for (const { json: o } of $input.all()) {</span>
<span class="k">  byArea[o.area] ??= { area: o.area, orders: 0, total: 0 };</span>
<span class="k">  byArea[o.area].orders += 1;</span>
<span class="k">  byArea[o.area].total += Number(o.total) || 0;</span>
<span class="k">}</span>
<span class="k">return Object.values(byArea).map(a =&gt; ({ json: a }));</span></pre>
    <p><code>reduce</code> can do the same as pattern 4 in one expression; use whichever you can read. <code>??=</code> means "set it only if it isn't set yet". Note that <code>filter</code> returns the original items, already in <code>{ json }</code> shape, so they can be returned directly.</p>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Numbers, phones and dates: the silent bugs</h3>
    <div class="vocab">
      <div><b>Numbers that are text</b>Sheets and forms often send <code>"45000"</code>. <code>0 + "45000"</code> gives <code>"045000"</code>, not 45000. Always convert: <code>Number(o.total) || 0</code>.</div>
      <div><b>One phone, many formats</b>Strip non-digits, then normalise: <code>0803…</code> and <code>234803…</code> both become <code>+234803…</code>. Only then compare or group.</div>
      <div><b>ISO dates compare as text</b><code>"2026-09-14" &gt; "2026-08-19"</code> is true, because <code>YYYY-MM-DD</code> sorts correctly. Other formats (<code>14/09/26</code>) don't: convert first.</div>
      <div><b>Luxon in code</b><code>DateTime</code> works in the Code node too: <code>DateTime.fromISO(o.date).diffNow('days').days</code> gives days since an order (negative for the past).</div>
      <div><b>Money</b>Do the maths in whole naira (or kobo); round only for display.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Python, limits, and your AI pair programmer</h3>
    <div class="vocab">
      <div><b>Python</b>The Code node also runs Python. In n8n 2.x it uses native Python; the older browser-based (Pyodide) version was removed. Native Python reads items through <code>_items</code> (all-items mode) or <code>_item</code> (each-item mode), and doesn't support most of the <code>$</code> helpers. If you know Python, use it; otherwise JavaScript has more examples.</div>
      <div><b>What code can't do</b>The Code node can't read files or make HTTP requests. Let HTTP Request and app nodes do the talking; let code calculate. On n8n Cloud, only a couple of libraries (such as <code>crypto</code>) are available; self-hosted n8n can allow more.</div>
      <div><b>Asking an AI to write it</b>Describe the input (paste two <i>fake</i> sample items), the exact output you want, the mode, and the n8n return shape. Then run it against messy test data, read every line, and ask the AI to explain anything you don't understand.</div>
    </div>
<pre class="codebox"><span class="c">A prompt that works:</span>
<span class="k">Write JavaScript for an n8n Code node, mode "Run Once for All Items".
Input items look like: { json: { name, phone, total, date } } (sample below, fake data).
Output: one item per unique phone number, normalised to +234 format,
with fields phone, name, orders, lifetime_value (number), last_order (YYYY-MM-DD).
Treat total as possibly text. Skip rows with no phone.
Return an array of { json: {...} }. Explain each line in a comment.</span></pre>

  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 45 MIN</span><h2>Solved problem: one row per customer, ranked by value</h2></div>
  <div class="prose"><p><b>The goal.</b> From the Orders sheet (every order ever, messy names and phone formats), produce a <b>Customers</b> sheet with one row per real customer: normalised phone, latest name, number of orders, lifetime value, first and last order dates, and a rank. Rows with no phone go to a separate check.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Read the orders and pin them</h4>
      <p><b>Manual Trigger</b> → <b>Google Sheets · Get Row(s)</b> on Orders (all rows). Pin the output, and add the 12 sample rows from the sandbox to it if your sheet is still small.</p>
    </div></div>

    <div class="step"><div>
      <h4>Write the Code node</h4>
      <p>Add a <b>Code</b> node, JavaScript, <b>Run Once for All Items</b>:</p>
<pre class="codebox" id="cs-solved" data-mode="all">// 1. One phone format for everyone
const normPhone = p =&gt; {
  const d = String(p ?? '').replace(/\D/g, '');       // keep digits only
  if (!d) return null;
  if (d.startsWith('234')) return '+' + d;
  if (d.startsWith('0')) return '+234' + d.slice(1);
  return '+234' + d;
};

// 2. Group orders by phone
const byPhone = {};
for (const item of $input.all()) {
  const o = item.json;
  const phone = normPhone(o.phone);
  if (!phone) continue;                               // no phone: handled by an IF before this node
  const c = byPhone[phone] ??= {
    phone, name: String(o.name).trim(), orders: 0,
    lifetime_value: 0, first_order: o.date, last_order: o.date,
  };
  c.orders += 1;
  c.lifetime_value += Number(o.total) || 0;           // "45000" → 45000
  if (o.date &lt; c.first_order) c.first_order = o.date;
  if (o.date &gt; c.last_order) { c.last_order = o.date; c.name = String(o.name).trim(); }
}

// 3. Rank by value and return items
return Object.values(byPhone)
  .sort((a, b) =&gt; b.lifetime_value - a.lifetime_value)
  .map((c, i) =&gt; ({ json: { ...c, rank: i + 1 } }));</pre>
      <p>Try it in the sandbox above (the <b>Solution</b> button loads this code). Twelve rows in, six customers out: Chef Tunde first with ₦164,000 over three orders.</p>
    </div></div>

    <div class="step"><div>
      <h4>Catch the rows with no phone</h4>
      <p>Code that silently skips data is a trap. Put an <b>IF</b> before the Code node: phone is not empty → Code; false → append to a <b>Fix list</b> sheet (the 3.3 pattern). The <code>continue</code> stays as a safety net.</p>
    </div></div>

    <div class="step"><div>
      <h4>Save, and answer the investor</h4>
      <p><b>Google Sheets · Append or Update Row</b> on Customers, matching on <code>phone</code>. Then the top ten is simply the first ten rows by rank. Schedule it nightly, and the Customers sheet stays current for every later workflow, including the AI agents in Track 4.</p>
      <div class="stats">
        <div class="stat"><b>12 → 6</b><span>rows in, real customers out (sample)</span></div>
        <div class="stat"><b>1</b><span>Code node instead of about 10 nodes</span></div>
        <div class="stat"><b>₦164,000</b><span>top lifetime value: Chef Tunde</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Normalising phones before grouping turns three "customers" into one.</li><li><code>Number(…) || 0</code> protects every sum from text and blanks.</li><li>ISO dates compare correctly as text, so first and last orders need no library.</li><li>The return is a ranked array of <code>{ json }</code> items: exactly what n8n expects.</li><li>An IF in front means nothing disappears without a trace.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Returning names or numbers instead of objects.</li><li>Putting <code>return</code> inside the loop.</li><li>Grouping by the raw phone or the name.</li><li>Adding text numbers without converting them.</li><li>Using all-items code in each-item mode (or the reverse).</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Load my version in the sandbox. Then explain these six results.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>"Code doesn't return items properly: item 0 is "Mrs Adebayo", not an object."</td></tr>
        <tr><td>B</td><td>The same error, with "nothing was returned".</td></tr>
        <tr><td>C</td><td>Chef Tunde's lifetime value is <code>"11900045000"</code>.</td></tr>
        <tr><td>D</td><td>Mrs Adebayo appears three times, Mr Okafor twice.</td></tr>
        <tr><td>E</td><td>Only one customer comes out, though the loop clearly runs.</td></tr>
        <tr><td>F</td><td>In "Run Once for Each Item" mode, the code outputs 12 identical totals.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> <code>.map(c =&gt; c.name)</code> returns a list of strings. Return objects: <code>.map(c =&gt; ({ json: c }))</code>.</li>
        <li><b>B:</b> the code has no <code>return</code> statement (or it's inside an <code>if</code> that didn't run).</li>
        <li><b>C:</b> one total arrived as the text <code>"45000"</code>, so <code>+=</code> joined text instead of adding. Use <code>Number(o.total) || 0</code>.</li>
        <li><b>D:</b> grouped by the raw phone, so <code>0803 123 4567</code> and <code>+2348031234567</code> look different. Normalise first.</li>
        <li><b>E:</b> the <code>return</code> is inside the loop, so the code stops after the first customer. Move it after the loop.</li>
        <li><b>F:</b> all-items code (<code>$input.all()</code> plus a total) is running once per item. Switch the mode to Run Once for All Items.</li>
      </ol>
    </div></details>
  </div>
</section>

    <ol>
      <li>All-items mode for comparing items; each-item mode for changing one item.</li>
      <li>Return an array of <code>{ json }</code> objects (or one object in each-item mode).</li>
      <li>Four patterns: loop, map, filter, group with an object.</li>
      <li><code>Number(x) || 0</code> before any maths; normalise phones before grouping.</li>
      <li>ISO dates compare as text; other formats need converting.</li>
      <li>Code calculates; HTTP Request and app nodes do the talking.</li>

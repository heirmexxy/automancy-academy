<!-- ============ BRIEF ============ -->
<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">THE CLIENT BRIEF</span><h2>What Kora's CRM must do at go-live</h2></div>
  <div class="concept">
    <div class="tablewrap"><table class="dt">
      <tbody>
        <tr><td><b>Capture</b></td><td>Every website, portal and Instagram enquiry becomes a contact and a deal in the right pipeline, with no typing, no duplicates and the message logged (7.5).</td></tr>
        <tr><td><b>Own</b></td><td>Every enquiry has one owner within 5 minutes in office hours: returning clients to their owner, then rentals, luxury budget and office rules, rotating among available agents; re-route if untouched after 60 minutes (7.4).</td></tr>
        <tr><td><b>Move</b></td><td>Sales, Lettings and Landlord pipelines with exit rules and required fields per stage; one follow-up task per customer action; stuck-deal alerts once (7.2, 7.4).</td></tr>
        <tr><td><b>Protect</b></td><td>Agents see and edit their own records, managers their team, owner and admin everything; commissions, ID documents and bank details stay out of the CRM; only owner and admin export (7.2).</td></tr>
        <tr><td><b>Remember</b></td><td>Active people, available properties and open deals migrated with owners and links; old sheets frozen and archived; zero reconciliation differences (7.3).</td></tr>
        <tr><td><b>Talk</b></td><td>WhatsApp through the business number with an approved acknowledgement template to opted-in contacts; agents' emails logged to contacts (7.5).</td></tr>
        <tr><td><b>Get paid</b></td><td>A Paystack holding deposit, verified twice and matched by reference, moves the deal to "Legal and payment" and notifies accounts; never sets Won (7.5).</td></tr>
        <tr><td><b>Show</b></td><td>Agent, manager and owner dashboards; weighted forecast; adoption report every week for four weeks (7.6).</td></tr>
        <tr><td><b>Stay healthy</b></td><td>An implementation agent that diffs the CRM against the signed design, validates import files and writes a monthly health report; changes only through approved, hash-checked plans (7.7).</td></tr>
      </tbody>
    </table></div>
  </div>
</section>

<!-- ============ DELIVERABLES ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">YOUR MISSION</span><h2>Ten deliverables, four phases</h2></div>
  <div class="steps">
    <div class="step"><div><h4>Phase 1 · D1 · Requirements document</h4><p>Process map with leaks, MoSCoW requirements (musts ≤ half), data audit, success measures, platform and plan with a dated yearly cost, out of scope, risks. Role-play the workshops with classmates or use the sample notes provided by your facilitator. <span class="soon">(7.1)</span></p></div></div>
    <div class="step"><div><h4>Phase 1 · D2 · Solution design</h4><p>Objects and labelled associations, data dictionary, pipelines with exit rules and required fields, teams and permission matrix, assignment rules, naming conventions, what stays out. <span class="soon">(7.2)</span></p></div></div>
    <div class="step"><div><h4>Phase 2 · D3 · Configured CRM</h4><p>The design built in a trial or sandbox (applied through the D9 agent's approved plans where you can), with two test users proving the permission matrix. <span class="soon">(7.2, 7.7)</span></p></div></div>
    <div class="step"><div><h4>Phase 2 · D4 · Migration</h4><p>Mapping sheet, repeatable cleaning workflow, rejects with reasons, de-duplication on strong keys, test loads, full load with external IDs, reconciliation log, cutover and rollback plan. Use the sample Kora files (at least 2,000 messy rows). <span class="soon">(7.3)</span></p></div></div>
    <div class="step"><div><h4>Phase 3 · D5 · Automations</h4><p>Routing (all branches), re-route timer, stage follow-ups, stuck-deal alert, ticket escalation; tested with TEST records; automation register. <span class="soon">(7.4)</span></p></div></div>
    <div class="step"><div><h4>Phase 3 · D6 · Integrations</h4><p>Idempotent upsert-enquiry sub-workflow; website form (secret), portal email parser, WhatsApp acknowledgement template, Paystack deposit (test mode); integration log; error alerts and the daily count check. <span class="soon">(7.5)</span></p></div></div>
    <div class="step"><div><h4>Phase 4 · D7 · UAT and training</h4><p>UAT scripts for every must-have with results; defect and change-request lists; role-based training plan; three 2–3-minute training videos. <span class="soon">(7.6)</span></p></div></div>
    <div class="step"><div><h4>Phase 4 · D8 · Dashboards and adoption</h4><p>Agent, manager and owner dashboards (each chart with its question); weighted forecast; a simulated four-week adoption report with targets and actions. <span class="soon">(7.6)</span></p></div></div>
    <div class="step"><div><h4>Phase 4 · D9 · Implementation agent</h4><p>Read-only tools, plan with dry run and hash, Telegram approval, separate apply workflow, change log, first monthly health report. <span class="soon">(7.7)</span></p></div></div>
    <div class="step"><div><h4>Phase 4 · D10 · Handover and demo</h4><p>Handover pack and a 5-minute demo: an enquiry arriving from a portal email and owned in minutes; a returning buyer going to their agent; an agent who can't see a colleague's deal; a deposit moving a deal; the owner dashboard; one approved agent plan applied and verified.</p></div></div>
  </div>

<!-- ============ CURVEBALLS ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">GLITCH'S CURVEBALLS</span><h2>Open one at the start of Phases 2, 3 and 4</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Clients change their minds. Data surprises you. People resist. Let's practise all three.</div></div>
    <details class="reveal"><summary>Curveball 1 · open at the start of Phase 2</summary><div><p>Halfway through the design, Mrs Adeyemi announces a short-let business (furnished flats by the night) launching next month, and wants it "in the CRM from day one". Budget and timeline don't change. What do you do with the design, the plan tier and the scope?</p></div></details>
    <details class="reveal"><summary>Curveball 2 · open at the start of Phase 3</summary><div><p>During the test load you discover that one senior agent's sheet (1,900 rows) holds clients he says are "his personal clients" and refuses to put into the CRM. Two of them have open deals worth ₦600m. How do you handle the data, the people and the project?</p></div></details>
    <details class="reveal"><summary>Curveball 3 · open at the start of Phase 4</summary><div><p>Three weeks after go-live, the adoption report shows the Ibadan office at 3 of 5 agents active and 41% of their deals without a next step. Lekki is fine. Mrs Adeyemi asks whether the CRM "works for Ibadan at all". Diagnose and respond with numbers.</p></div></details>
  </div>
</section>

<!-- ============ RUBRIC ============ -->

  <div class="tablewrap"><table class="dt">
    <thead><tr><th>Area</th><th>Full marks when…</th><th class="n">Points</th></tr></thead>
    <tbody>
      <tr><td>Discovery and design</td><td>Leaks become requirements; musts ≤ half; numeric success measures; design complete enough to rebuild from; within plan limits</td><td class="n">15</td></tr>
      <tr><td>Migration</td><td>Scripted cleaning, strong-key de-duplication, external IDs, zero reconciliation differences, real rollback plan</td><td class="n">15</td></tr>
      <tr><td>Automation</td><td>Routing on facts with fair rotation and returning-owner rule; single, owned follow-ups; no loops; register complete</td><td class="n">15</td></tr>
      <tr><td>Integrations</td><td>Idempotent upsert; secrets on server; verified webhooks; WhatsApp within rules; payments matched by reference; monitoring catches silent failures</td><td class="n">15</td></tr>
      <tr><td>Security and permissions</td><td>Least privilege proven; sensitive data out; exports restricted; agent has no route to delete, change access or move money</td><td class="n">10</td></tr>
      <tr><td>Launch and adoption</td><td>UAT from requirements; role-based training; dashboards tied to decisions; adoption measured and acted on; handover pack and client admins</td><td class="n">15</td></tr>
      <tr><td>Implementation agent</td><td>Read-only tools, plans with dry run and hash, separate apply, verified change log, useful health report</td><td class="n">10</td></tr>
      <tr><td>Curveballs</td><td>All three handled</td><td class="n">5</td></tr>
    </tbody>
    <tfoot><tr><td>Total</td><td>Win at 80 or more, with every must-have in the go-live check passing</td><td class="n">100</td></tr></tfoot>
  </table></div>
</section>

<!-- ============ REFERENCE ============ -->
<section class="part" style="--c:var(--rose)">
  <div class="part-h"><span class="tag">REFERENCE BUILD</span><h2>Compare only after you've finished</h2></div>
  <div class="say"><svg viewBox="0 0 120 120"><use href="#echo"/></svg><div class="bubble"><b>Echo:</b> Different designs can win. Use these to find gaps, not to copy.</div></div>

  <details class="reveal"><summary>Curveball answers</summary><div>
    <ol>
      <li><b>Short-lets mid-design:</b> treat it as a change request, not a quiet addition. Short-lets follow the Lettings stages closely, so the cheapest fit is a <i>Deal type</i> value (Short-let) in the Lettings pipeline plus two properties (nightly rate, minimum stay), added to the data dictionary and re-signed. Check the plan's property and pipeline limits. Write the impact (2 extra days of build, no change to launch date by moving a "should" to month two) and get it approved in writing.</li>
      <li><b>The "personal clients" sheet:</b> the data belongs to the business, but this is a people problem first. Meet the agent and Mrs Adeyemi together: explain that permissions mean only he (and his manager) will see his clients, and show him in the sandbox. Migrate his clients owned by him. If the business decides otherwise, that's the owner's call, recorded in the decision log; you don't migrate around him secretly. Open deals are a must: the two ₦600m deals go in.</li>
      <li><b>Ibadan adoption:</b> compare by office: activity per agent, next-step gaps, time to first reply, logins from mobile. Typical findings: Ibadan joined late and missed the in-person training; the champion left; network issues make the web app slow, so the mobile app wasn't installed. Respond with a half-day on-site session on their own deals, a new champion, mobile app set-up, and the office manager running the Monday review from the dashboard. Report the same numbers two weeks later.</li>
    </ol>
  </div></details>

  <details class="reveal"><summary>D2 · Permission matrix and pipelines (reference)</summary><div>

agent            | own (edit)  | own (edit)  | all (view) | own (edit)  | no

(change request #4) scheduled for month two.</pre>

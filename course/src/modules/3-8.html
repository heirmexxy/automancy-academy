<p class="lede">Your laptop was a fine workshop. It's a terrible factory: it sleeps, travels and runs out of battery. Harvest Lane now depends on n8n, so it needs a home that's always on, reachable over HTTPS, backed up every night, watched from outside, and documented well enough that someone else could fix it.</p>
<div class="outcomes">
  <div><b>01</b><span>Deploy n8n on a small server with Docker Compose, a domain and automatic HTTPS.</span></div>
  <div><b>02</b><span>Set the environment variables that matter: public webhook URL, encryption key, timezone and a pinned version.</span></div>
  <div><b>03</b><span>Back up the data, the key and the workflows (to Git), and prove you can restore.</span></div>
  <div><b>04</b><span>Monitor from outside, update safely, and write a runbook for when things go wrong.</span></div>
</div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Backups: three things, off the server</h3>
    <div class="vocab">
      <div><b>1 · The encryption key</b>In your password manager, not only on the server. Without it, n8n's docs warn, a restored database or credential export can't be decrypted.</div>
      <div><b>2 · The data</b>The <code>n8n_data</code> volume (the <code>.n8n</code> folder, with the database and config). Turn on your provider's automatic server backups, and export nightly with n8n's CLI:<br><code>docker compose exec n8n n8n export:workflow --backup --output=/home/node/.n8n/backups/workflows/</code><br><code>docker compose exec n8n n8n export:credentials --backup --output=/home/node/.n8n/backups/credentials/</code><br>(<code>--backup</code> exports all, one readable file each. Credential exports stay encrypted unless you add <code>--decrypted</code>, which you shouldn't for routine backups.)</div>
      <div><b>3 · The workflows, in Git</b>A private GitHub repository holding every workflow's JSON gives you history: what changed, when, and the ability to roll back. The solved problem builds this with n8n itself.</div>
      <div><b>A backup you haven't restored is a hope</b>Once a quarter, restore onto a fresh test server and check a workflow runs.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Watch it, update it, document it</h3>
    <div class="vocab">
      <div><b>Monitor from outside</b>Your error workflow (3.6) can't send an alert if n8n itself is down. Point a free uptime monitor (such as UptimeRobot) at <code>https://your-domain/healthz</code>, which n8n's docs say is always enabled on the main server, and have it alert you by email or Telegram.</div>
      <div><b>Update on purpose</b>Pin the version. Monthly: read the release notes (especially breaking changes), back up, change the number, <code>docker compose pull &amp;&amp; docker compose up -d</code>, and test your key workflows.</div>
      <div><b>Lock the doors</b>Firewall open only on 22, 80 and 443; SSH keys instead of passwords; a strong owner password with two-factor login; separate n8n accounts for each person.</div>
      <div><b>Runbook</b>One page: where n8n runs, how to log in to the server, how to restart, restore and roll back, who to call, and where the key is. Written for a tired person at 3 a.m.</div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 60 MIN+</span><h2>Solved problem: Harvest Lane's n8n goes live</h2></div>
  <div class="prose"><p><b>The goal.</b> n8n running on a small server at <code>https://n8n.harvestlane.example</code>, with automatic HTTPS, nightly backups, workflows versioned in GitHub, an outside uptime check, and every Track 3 workflow moved over and working.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Server, domain, firewall</h4>
      <p>Create an Ubuntu LTS server (2 GB RAM) with your SSH key, and turn on the provider's automatic backups. In your domain's DNS, add an <b>A record</b> for <code>n8n</code> pointing to the server's IP. On the server: update packages, install Docker, and allow only SSH, HTTP and HTTPS:</p>
<pre class="codebox">sudo apt update &amp;&amp; sudo apt upgrade -y
curl -fsSL https://get.docker.com | sudo sh
sudo ufw allow OpenSSH &amp;&amp; sudo ufw allow 80 &amp;&amp; sudo ufw allow 443 &amp;&amp; sudo ufw enable</pre>
      <p><i>Read any script before you pipe it into a shell. Docker's convenience script is widely used, but the habit matters.</i></p>
    </div></div>

    <div class="step"><div>
      <h4>Start n8n</h4>
      <p>Make a folder (<code>mkdir ~/n8n &amp;&amp; cd ~/n8n</code>), create the three files from Card 3 with a pinned version and a generated key, and save the key in your password manager. Then:</p>
<pre class="codebox">docker compose up -d
docker compose logs -f n8n      <span class="c"># wait for "Editor is now accessible", then Ctrl+C</span></pre>
      <p>Open <code>https://n8n.harvestlane.example</code>: a padlock, and the owner set-up screen. Create the owner account with a strong password and turn on two-factor login.</p>
    </div></div>

    <div class="step"><div>
      <h4>Move the workflows</h4>
      <p>On the laptop: export each workflow (⋮ → Download), or use the CLI export from Card 4. On the server: import them, then <b>recreate the credentials</b> (they're encrypted with the laptop's key, so they don't travel). Open each Webhook or Telegram node and confirm the URL now starts with <code>https://n8n.harvestlane.example/</code>. Publish the workflows and switch off the laptop copies, so nothing runs twice.</p>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><p><b>Glitch's trap, defused:</b> if webhook URLs still show <code>http://localhost:5678</code>, n8n doesn't know its public address. Set <code>N8N_WEBHOOK_URL</code> (or <code>WEBHOOK_URL</code> on versions before 2.35) and <code>N8N_PROXY_HOPS=1</code>, run <code>docker compose up -d</code>, and re-publish workflows that use webhooks so they register the new URL.</p></div>
    </div></div>

    <div class="step"><div>
      <h4>Nightly workflow backup to GitHub</h4>
      <p>Create a <b>private</b> GitHub repo <code>harvestlane-n8n</code> and a fine-grained token limited to that repo (contents: read and write). In n8n: <b>Settings → n8n API</b> → create an API key. Then build <b>HL · Backup workflows → GitHub</b>:</p>
      <ol>
        <li><b>Schedule Trigger</b>: daily, 02:00.</li>
        <li><b>n8n node · Get many workflows</b> (n8n API credential): every workflow as an item.</li>
        <li><b>Code</b> (each item): <code>return { json: { path: `workflows/${$json.name.replace(/[^\w-]+/g, '_')}.json`, content: JSON.stringify($json, null, 2) } };</code></li>
        <li><b>GitHub · Edit a file</b> at that path, commit message <code>nightly backup {{ $now.toISODate() }}</code>. Settings → On Error: <b>Continue (using error output)</b>.</li>
        <li>Error output → <b>GitHub · Create a file</b> with the same fields (for workflows that are new since last night).</li>
      </ol>
      <p>Workflow JSON contains credential <i>names and IDs</i>, not the secrets themselves. Keep the repo private anyway. Connect the workflow to HL · Error alerts.</p>
    </div></div>

    <div class="step"><div>
      <h4>Watch from outside, and write the runbook</h4>
      <p>In UptimeRobot (free plan), add an HTTP monitor for <code>https://n8n.harvestlane.example/healthz</code> every 5 minutes, alerting by email (and Telegram, if you link it). Test it: <code>docker compose stop n8n</code>, wait for the alert, then <code>docker compose start n8n</code>. Finally, fill in the runbook template in Mission Gold.</p>
      <div class="stats">
        <div class="stat"><b>24/7</b><span>workflows run whether the laptop is open or not</span></div>
        <div class="stat"><b>3</b><span>kinds of backup: server, data export, Git</span></div>
        <div class="stat"><b>2</b><span>alarms: inside (error workflow) and outside (uptime)</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Only the proxy faces the internet; n8n's port stays private.</li><li>A pinned version means no surprise updates.</li><li>The key lives in two places, so backups can always be decrypted.</li><li>Git gives history and rollback for every workflow.</li><li>An outside monitor catches the one failure the error workflow can't: n8n being down.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Opening port 5678 to the internet.</li><li>Running the <code>latest</code> image and being surprised by a breaking change.</li><li>Keeping the only copy of the encryption key on the server.</li><li>Leaving workflows active on both laptop and server.</li><li>Committing the <code>.env</code> file to GitHub.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Production gives me so many new toys. Six incidents. Name the cause.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Webhooks worked on the laptop. On the server, Telegram and Paystack never reach n8n, and the Webhook node shows <code>http://localhost:5678/webhook/…</code>.</td></tr>
        <tr><td>B</td><td>After restoring last night's backup to a new server, every credential fails to decrypt.</td></tr>
        <tr><td>C</td><td>A Monday restart pulled a new major version, and two workflows broke.</td></tr>
        <tr><td>D</td><td>Customers got every payment receipt twice for a week.</td></tr>
        <tr><td>E</td><td>n8n was down for six hours on Sunday. The error workflow sent nothing.</td></tr>
        <tr><td>F</td><td>A security scan finds the n8n login page open on <code>http://server-ip:5678</code>.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> n8n doesn't know its public address. Set <code>N8N_WEBHOOK_URL=https://your-domain/</code> (older versions: <code>WEBHOOK_URL</code>) and <code>N8N_PROXY_HOPS=1</code>, restart, and re-publish webhook workflows.</li>
        <li><b>B:</b> the new server generated its own encryption key. Set <code>N8N_ENCRYPTION_KEY</code> to the original key, from the password manager, before starting n8n.</li>
        <li><b>C:</b> the image was <code>latest</code>. Pin a version and update deliberately after reading the release notes, with a backup ready.</li>
        <li><b>D:</b> the workflows were still published on the laptop as well as the server, so both ran. Unpublish (or delete) the old copies after moving.</li>
        <li><b>E:</b> an error workflow runs inside n8n, so it can't report n8n being down. Add an outside uptime monitor on <code>/healthz</code>.</li>
        <li><b>F:</b> port 5678 was published to the internet (<code>-p 5678:5678</code> or a firewall gap). Remove the port mapping so only Caddy can reach n8n, and close it in the firewall.</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ TAKEAWAYS ============ -->
<section class="part" style="--c:var(--teal)">
  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>Production means always on, HTTPS, backed up, watched and documented.</li>
      <li>Only the reverse proxy faces the internet; n8n's port stays private.</li>
      <li>Tell n8n its public address: <code>N8N_WEBHOOK_URL</code> (older: <code>WEBHOOK_URL</code>).</li>
      <li>The encryption key lives off the server too, or backups are useless.</li>
      <li>Workflows in Git give history and rollback.</li>
      <li>Error workflow inside, uptime monitor outside.</li>
      <li>Pin versions; update deliberately; keep a runbook.</li>

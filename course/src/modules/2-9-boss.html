<!-- ============ BRIEF ============ -->

        <tr><td><b>Inputs</b></td><td>Supplier invoices (the Drive folder from 1.1) and expense receipts forwarded to a <b>Receipts</b> Gmail label: PDFs, phone photos, some handwritten. About 120 documents a month.</td></tr>

<!-- ============ DELIVERABLES ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">YOUR MISSION</span><h2>Eight deliverables, three phases</h2></div>
  <div class="steps">
    <div class="step"><div>
      <h4>Phase 1 · D1 · The books tables <span class="soon">(0.4)</span></h4>
      <p><b>Expenses</b> (expense_id, doc_date, supplier, invoice_number, category, amount_ex_vat, vat, total, source_link, dedupe_key, added_at), <b>Expense_Lines</b>, <b>Needs_Review</b> (same fields + review_reason, status: New · Approved · Rejected), <b>Errors</b>, and <b>Monthly_PL</b>. Validation on category and status.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 1 · D2 · Extraction and checks <span class="soon">(2.4, 2.7)</span></h4>
      <p>Iterate attachments from both sources; extract with your 2.7 prompt (add a <code>doc_type</code> field: invoice, receipt, or not_a_receipt); parse; check line maths, subtotal + VAT = total, and required fields.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 2 · D3 · Never count twice <span class="soon">(2.5)</span></h4>
      <p>Build a dedupe key from the supplier and invoice number (lower-cased), check it in a data store before saving, and store it after. Receipts without numbers need a different key (Curveball 1).</p>
      <details class="reveal"><summary>Hint</summary><div><p><code>md5(lower(trim(supplier)) + "|" + lower(trim(invoice_number)))</code> gives a short, consistent key. For receipts with no number, try supplier + date + total.</p></div></details>
    </div></div>
    <div class="step"><div>
      <h4>Phase 2 · D4 · Categories: rules first, AI second <span class="soon">(2.2)</span></h4>
      <p>Known suppliers get their category from a <code>switch()</code> rule (Farmgate → Cost of goods; TotalEnergies or NNPC stations → Fuel). Only unknown suppliers use the AI's suggested category, and those go to review the first time.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 2 · D5 · The review loop <span class="soon">(2.3)</span></h4>
      <p>Tolu corrects a Needs_Review row and sets status Approved. Scenario 2 moves Approved rows into Expenses (with dedupe) and marks them done; Rejected rows are logged and left out.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 3 · D6 · The monthly P&amp;L <span class="soon">(2.2, 2.4)</span></h4>
      <p>On the 1st at 07:00: search last month's paid orders and expenses, aggregate by category, calculate, and send a readable table plus a Monthly_PL row.</p>
      <details class="reveal"><summary>Hint: last month's date range</summary><div>
<pre class="codebox">first of this month:  formatDate(setDate(now; 1); "YYYY-MM-DD")
first of last month:  formatDate(addMonths(setDate(now; 1); -1); "YYYY-MM-DD")
filter: doc_date &gt;= first of last month  AND  doc_date &lt; first of this month</pre>
      </div></details>
    </div></div>
    <div class="step"><div>
      <h4>Phase 3 · D7 · Reliability <span class="soon">(2.6)</span></h4>
      <p>Handlers on every external module: AI and HTTP calls → alert + Break with retries; one bad attachment → log + Ignore. All errors go to the Errors tab.</p>
    </div></div>
    <div class="step"><div>
      <h4>Phase 3 · D8 · Test report, credit budget and demo</h4>
      <p>Run the 12 test documents below. Report expected vs. actual route, credits used, and AI cost per document. Estimate the month at 120 documents. Record a 3-minute demo ending with the P&amp;L email.</p>
    </div></div>
  </div>

<section class="part" style="--c:#FF9FA4">

  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Books are where small mistakes become big ones. Enjoy.</div></div>
    <details class="reveal"><summary>Curveball 1 · open at the start of Phase 1</summary><div><p>Fuel receipts have no invoice number, and Tolu fills up at the same station twice on the same day for the same amount. Your dedupe key must not merge two real purchases, but must still catch a receipt forwarded twice.</p></div></details>
    <details class="reveal"><summary>Curveball 2 · open at the start of Phase 2</summary><div><p>A supplier sends one PDF containing two separate invoices. Your AI step returns one invoice. How do you get two correct Expenses rows (and catch it if the AI misses one)?</p></div></details>

<!-- ============ REFERENCE ============ -->
<section class="part" style="--c:var(--grape)">
  <div class="part-h"><span class="tag">REFERENCE BUILD</span><h2>Compare only after you've finished</h2></div>
  <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> Different designs can all win. Use this to find the gaps in yours.</div></div>

  <details class="reveal"><summary>Curveball answers</summary><div>
    <ol>
      <li><b>Receipts without numbers:</b> use supplier + doc_date + total + an md5 of the attachment's content as the key. A forwarded copy carries the same file, so its key matches and it is stopped; two genuine fill-ups for the same amount are different photos or PDFs, so their keys differ and both are kept. (Don't use the email's message ID: a forward arrives as a new email with a new ID.)</li>
      <li><b>Two invoices in one PDF:</b> change the prompt to return an <i>array</i> of invoices (<code>{"invoices": [ … ]}</code>) and iterate over it (2.4). Add a check: if the PDF has more pages than invoices returned and pages contain "Invoice No", send it to review.</li>
      <li><b>Accountant's format:</b> store amount_ex_vat and vat separately from the start (D1 already does). The P&amp;L scenario reads last month's Monthly_PL row to compute change: <code>(this − last) / last × 100</code>, rounded to one decimal place.</li>
    </ol>
  </div></details>

  <details class="reveal"><summary>D4 · Category rules</summary><div>
<pre class="codebox">switch(lower(supplier);
  "farmgate supplies"; "Cost of goods";
  "ibadan onion co.";  "Cost of goods";
  "mama bisi farm";    "Cost of goods";
  "packright ltd";     "Packaging";
  "mtn";               "Airtime &amp; data";
  ifempty(ai_category; "Other"))</pre>
    <p>Fuel stations vary by name, so a second rule checks <code>contains(lower(supplier); "fuel")</code> or known station names. New suppliers get the AI's category but are sent to review once; after Tolu approves, add them to the rules.</p>
  </div></details>

  <details class="reveal"><summary>D8 · Rough credit estimate at 120 documents a month</summary><div>
    <div class="tablewrap"><table class="dt" style="min-width:0"><thead><tr><th>Part</th><th>Estimate</th></tr></thead><tbody>
      <tr><td>Intake polling: hourly, 14 hours, 2 sources</td><td>≈ 840 credits</td></tr>

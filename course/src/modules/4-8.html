<p class="lede">n8n is a great home for agents, but some clients need the agent inside their own app: a website, a mobile backend, an internal tool. Then you write the agent in code. Good news: an agent is just the loop you've been watching all track. About 60 lines of Python reproduce it exactly, and once you've written that loop yourself, every framework makes sense.</p>
<div class="outcomes">
  <div><b>01</b><span>Set up a small Python project safely: virtual environment, packages and an API key in the environment.</span></div>
  <div><b>02</b><span>Write the tool-use loop yourself with the Anthropic SDK: definitions, calls, results, a turn limit.</span></div>
  <div><b>03</b><span>Handle tool errors so the agent recovers instead of crashing.</span></div>
  <div><b>04</b><span>Know when to reach for the Claude Agent SDK, OpenAI Agents SDK, LangGraph or CrewAI, and use AI coding assistants responsibly.</span></div>
</div>

<section class="part" style="--c:#9FD3F7">
  <div class="part-h"><span class="tag">PART 2 · 35 MIN</span><h2>Concept cards</h2></div>

  <div class="concept">
    <span class="num">CARD 1 OF 5</span>
    <h3>Just enough Python</h3>
    <div class="vocab">
      <div><b>A project folder and a virtual environment</b>Keeps this project's packages separate: <code>python3 -m venv .venv</code>, then <code>source .venv/bin/activate</code> (Windows: <code>.venv\Scripts\activate</code>).</div>
      <div><b>Packages</b><code>pip install anthropic</code> installs the official SDK.</div>
      <div><b>Secrets in the environment</b>The SDK reads <code>ANTHROPIC_API_KEY</code> from the environment. Set it in your terminal or a <code>.env</code> file that is in <code>.gitignore</code>. Never type a key into the code.</div>
      <div><b>The Python you need</b>Functions (<code>def</code>), dictionaries (<code>{"price": 12500}</code>), lists, <code>for</code> loops, <code>json.dumps</code>, and <code>try / except</code> for errors. Python for Everybody covers all of it, free.</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Watch the messages list grow</h3>
    <p>The whole agent is one list of messages that you keep adding to and sending back. Step through one question:</p>
    <div class="msgstep" data-msgs="ms-4-8">
      <div class="btns"><button type="button" class="btn" data-mnext>▶ Start</button><button type="button" class="btn ghost" data-mreset>Reset</button><span class="crit">Messages in the list: <b data-o="mcount">0</b></span></div>
      <p class="mnote" aria-live="polite"></p>
      <ol class="mlist"></ol>
    </div>
    <script type="application/json" id="ms-4-8">[
{"role":"user","inList":true,"label":"1 · Your code adds the question","json":{"role":"user","content":"How much for 3 crates of tomatoes?"},"note":"The list starts with the customer's question. Your code sends it, together with the system prompt and the two tool definitions."},
{"role":"assistant","inList":true,"label":"2 · The model replies: a tool request","json":{"stop_reason":"tool_use","role":"assistant","content":[{"type":"text","text":"Let me check today's price."},{"type":"tool_use","id":"toolu_01AbC…","name":"get_price","input":{"product":"tomatoes"}}]},"note":"stop_reason is \"tool_use\": the model wants get_price. It hasn't answered yet. Your code must append this whole reply to the list, unchanged."},
{"role":"code","inList":false,"label":"3 · Your code runs the tool","json":{"get_price(product=\"tomatoes\")":{"found":true,"name":"Tomatoes","unit":"crate","price":12500,"stock":14}},"note":"Your code, not the model, runs the function. Nothing is added to the list yet: the result still has to be sent back."},
{"role":"user","inList":true,"label":"4 · Your code sends the result back","json":{"role":"user","content":[{"type":"tool_result","tool_use_id":"toolu_01AbC…","content":"{\"found\": true, \"name\": \"Tomatoes\", \"unit\": \"crate\", \"price\": 12500, \"stock\": 14}"}]},"note":"The result goes back as a user message containing a tool_result block, with the same tool_use_id, so the model knows which request it answers."},
{"role":"assistant","inList":true,"label":"5 · The model answers","json":{"stop_reason":"end_turn","role":"assistant","content":[{"type":"text","text":"Tomatoes are ₦12,500 per crate today, so 3 crates come to ₦37,500. Delivery is free on orders of ₦30,000 or more."}]},"note":"stop_reason is no longer tool_use, so the loop ends and you show the text. For money, give the model a quote or calculator tool (4.2) rather than trusting its arithmetic."}
]</script>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Errors are messages, not crashes</h3>
    <p>When a tool fails (timeout, bad input, unknown product), don't let the program die. Catch the error and send it back as a tool result marked <code>is_error</code>. The model can then apologise, try different input, or tell the customer to wait. Also cap the number of turns, exactly like Max Iterations in n8n.</p>
<pre class="codebox"><span class="k">try:</span>
    out = RUN[block.name](**block.input)
    results.append({"type": "tool_result", "tool_use_id": block.id, "content": json.dumps(out)})
<span class="k">except Exception as e:</span>
    results.append({"type": "tool_result", "tool_use_id": block.id,
                    "content": f"Tool error: {e}", "is_error": True})</pre>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Frameworks at a glance</h3>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>Using AI coding assistants safely</h3>
    <p>Claude Code, Cursor and similar tools can write most of this module for you. Use them like a fast junior developer you supervise:</p>
    <div class="vocab">
      <div><b>Commit first</b>Put the project in Git and commit before asking for changes, so you can see and undo every edit.</div>
      <div><b>Read every diff</b>Ask it to explain anything you don't understand before accepting.</div>
      <div><b>Keep secrets out</b>Never paste keys or real customer data into prompts. Keep <code>.env</code> out of the repository.</div>
      <div><b>Make it prove it</b>Ask for small tests (unknown product, tool error, turn limit) and run them yourself.</div>
      <div><b>Approve commands</b>Read terminal commands before letting a coding agent run them, especially anything that installs, deletes or deploys.</div>
    </div>

<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 60 MIN</span><h2>Solved problem: a terminal agent with two tools</h2></div>
  <div class="prose"><p><b>The goal.</b> A Python agent, run from the terminal, that answers price and order-status questions using two tools, recovers from tool errors, and never loops more than six turns. Sample data lives in the file for now; Mission Silver connects it to the real sheet or your n8n workflows.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Set up the project</h4>
<pre class="codebox">mkdir harvest-agent &amp;&amp; cd harvest-agent
python3 -m venv .venv &amp;&amp; source .venv/bin/activate
pip install anthropic
export ANTHROPIC_API_KEY="sk-ant-…"      <span class="c"># Windows PowerShell: $env:ANTHROPIC_API_KEY="sk-ant-…"</span></pre>
      <p>Create an API key in the Claude Console, set a monthly spend limit there first, and keep the key out of the code.</p>
    </div></div>

    <div class="step"><div>
      <h4>Write agent.py</h4>
<pre class="codebox" id="agent-py-4-8">import json
import anthropic

client = anthropic.Anthropic()        # reads ANTHROPIC_API_KEY from the environment
MODEL = "claude-sonnet-5-5"           # check the models page; Haiku is cheaper for simple agents

# --- Sample data (replace with your sheet or n8n webhooks later) ---
PRICES = {
    "tomato":  ("Tomatoes", "crate", 12500, 14),
    "tatashe": ("Tatashe pepper", "big bag", 9000, 6),
    "onion":   ("Onions", "bag", 4000, 20),
}
ORDERS = {"HL-0042": {"status": "Out for delivery", "rider": "Musa", "eta": "before 2 p.m."}}

# --- Tools: plain Python functions that return small dictionaries ---
def get_price(product: str) -&gt; dict:
    p = product.lower().strip()
    for key, (name, unit, price, stock) in PRICES.items():
        if key in p:
            return {"found": True, "name": name, "unit": unit, "price": price, "stock": stock}
    return {"found": False, "suggestions": [v[0] for v in PRICES.values()]}

def get_order_status(order_id: str) -&gt; dict:
    oid = order_id.upper().strip()
    if oid not in ORDERS:
        return {"found": False}
    return {"found": True, "order_id": oid, **ORDERS[oid]}

TOOLS = [
    {"name": "get_price",
     "description": "Returns today's Harvest Lane price and stock for ONE product. "
                    "Use before giving any price. If found is false, ask which product they mean.",
     "input_schema": {"type": "object",
                      "properties": {"product": {"type": "string",
                                     "description": "One product as the customer wrote it, e.g. tatashe"}},
                      "required": ["product"]}},
    {"name": "get_order_status",
     "description": "Returns status, rider and ETA for one order. Use when asked about a specific order.",
     "input_schema": {"type": "object",
                      "properties": {"order_id": {"type": "string",
                                     "description": "Order number, format HL-0000, e.g. HL-0042"}},
                      "required": ["order_id"]}},
]
RUN = {"get_price": get_price, "get_order_status": get_order_status}

SYSTEM = ("You are Harvest Lane's assistant, a fresh-produce delivery business in Ibadan. "
          "Be brief and warm. Only state prices and order details that come from your tools. "
          "If a tool returns an error, apologise and say Tolu will follow up. Never invent data.")

def ask(question: str, max_turns: int = 6) -&gt; str:
    messages = [{"role": "user", "content": question}]
    for _ in range(max_turns):
        resp = client.messages.create(model=MODEL, max_tokens=800, system=SYSTEM,
                                      tools=TOOLS, messages=messages)
        messages.append({"role": "assistant", "content": resp.content})
        if resp.stop_reason != "tool_use":
            return "".join(b.text for b in resp.content if b.type == "text")
        results = []
        for block in resp.content:
            if block.type == "tool_use":
                print(f"  → {block.name}({block.input})")
                try:
                    out = RUN[block.name](**block.input)
                    results.append({"type": "tool_result", "tool_use_id": block.id,
                                    "content": json.dumps(out)})
                except Exception as e:
                    results.append({"type": "tool_result", "tool_use_id": block.id,
                                    "content": f"Tool error: {e}", "is_error": True})
        messages.append({"role": "user", "content": results})
    return "Sorry, I couldn't finish that. Tolu will follow up shortly."

if __name__ == "__main__":
    while True:
        q = input("You: ").strip()
        if not q:
            break
        print("Agent:", ask(q))</pre>
      <div><button type="button" class="btn ghost" data-copy="agent-py-4-8">Copy agent.py</button></div>
    </div></div>

    <div class="step"><div>
      <h4>Run it, and read the trace</h4>
<pre class="codebox">python agent.py
You: How much is tatashe today?
  → get_price({'product': 'tatashe'})
Agent: Tatashe pepper is ₦9,000 per big bag today, and we have 6 in stock.
You: Where is HL-0042?
  → get_order_status({'order_id': 'HL-0042'})
Agent: HL-0042 is out for delivery with Musa, arriving before 2 p.m.</pre>
      <p>(Your wording will differ; the tool calls and facts should match.)</p>
    </div></div>

    <div class="step"><div>
      <h4>Prove the safety nets</h4>
      <ul>
        <li><b>Tool error:</b> temporarily add <code>raise ConnectionError("price sheet unavailable")</code> at the top of <code>get_price</code>. Ask for a price: the agent apologises; the program keeps running.</li>
        <li><b>Unknown product:</b> "Do you have yam?" The tool returns <code>found: false</code> with suggestions, and the agent asks rather than inventing.</li>
        <li><b>Turn limit:</b> set <code>max_turns=1</code> and ask a two-part question. You get the polite fallback, not an endless loop.</li>
      </ul>
      <div class="stats">
        <div class="stat"><b>~60</b><span>lines for a complete agent loop</span></div>
        <div class="stat"><b>2</b><span>tools, same design rules as n8n</span></div>
        <div class="stat"><b>0</b><span>crashes when a tool fails</span></div>
      </div>
      <div class="insight"><svg viewBox="0 0 120 120"><use href="#nodo"/></svg><p><b>Nodo's bridge:</b> your tools don't have to be Python. A tool function can call an n8n webhook with <code>requests.post(…)</code> and return its JSON. Then the client's app gets the agent, and your tested n8n workflows still do the real work.</p></div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Writing the loop yourself shows exactly what every framework hides.</li><li>Tools are small functions with clear descriptions and schemas.</li><li>Errors go back to the model as messages, so the agent recovers.</li><li>A turn limit guarantees the loop ends.</li><li>The key lives in the environment, never in the code.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Not appending the assistant's tool request before sending results (the API rejects the mismatch).</li><li>Returning results without the matching <code>tool_use_id</code>.</li><li>No try/except around tools.</li><li>No turn limit.</li><li>Hard-coding the API key and pushing it to GitHub.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Code gives me new hiding places. Five bugs.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>When the price sheet is briefly down, the script crashes with a traceback and the app shows an error page.</td></tr>
        <tr><td>B</td><td>The API returns an error saying the tool_result doesn't match a tool_use in the previous message.</td></tr>
        <tr><td>C</td><td>The code ran fine on Tolu's laptop. On the server: "authentication error".</td></tr>
        <tr><td>D</td><td>An API key appears in the project's public GitHub history.</td></tr>
        <tr><td>E</td><td>A confusing question made the script call tools 40 times and run up a bill.</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> no try/except around the tool call. Catch the error and return it as a tool_result with <code>is_error: True</code>.</li>
        <li><b>B:</b> the assistant message containing the tool_use wasn't appended to <code>messages</code> before the results (or the IDs don't match). Append <code>resp.content</code> unchanged, then reply with the same <code>tool_use_id</code>.</li>
        <li><b>C:</b> <code>ANTHROPIC_API_KEY</code> isn't set on the server. Set it in the server's environment or secret manager, not in the code.</li>
        <li><b>D:</b> the key was hard-coded or a <code>.env</code> file was committed. Revoke the key in the Console immediately, create a new one, remove it from the repo, and add <code>.env</code> to <code>.gitignore</code>.</li>
        <li><b>E:</b> no turn limit. Cap the loop (<code>max_turns</code>) and set a spend limit in the Console.</li>
      </ol>
    </div></details>
  </div>
</section>

  <div class="takeaways">
    <h3>Remember this</h3>
    <ol>
      <li>An agent in code is a loop over a growing messages list.</li>
      <li>Tool request → run → tool_result with the same ID → call again.</li>
      <li>Errors go back to the model as results, never as crashes.</li>
      <li>Cap the turns; set a spend limit.</li>
      <li>Keys in the environment, never in code or Git.</li>
      <li>Frameworks hide the loop; choose them for what they add.</li>
      <li>AI coding assistants: commit, read, test, and keep secrets out.</li>
    </ol>

<header class="lh">
  <div>
    <span class="eyebrow">Track 4 · Sage's Tower (Agentic AI) · Lesson 4.4</span>
    <h1>RAG: Answering From Your Documents</h1>
    <div class="kicker"><span class="pill">≈ 2–3 hours</span><span class="pill">100 XP</span><span class="pill">Guide: Sage</span><span class="pill">Tools: n8n vector store nodes, Supabase (pgvector), an embeddings model, Google Drive</span></div>
  </div>
  <svg viewBox="0 0 120 120" aria-hidden="true"><use href="#sage"/></svg>
</header>
<p class="lede">Models know a lot about the world and nothing about Harvest Lane's refund policy. <b>Retrieval-augmented generation (RAG)</b> fixes that: before answering, the agent searches your documents, pulls out the few passages that matter, and answers from them, citing where the answer came from. Done right, it's the difference between "I think…" and "Section 2 says…".</p>
<div class="outcomes">
  <div><b>01</b><span>Explain embeddings, chunks and vector search in plain words.</span></div>
  <div><b>02</b><span>Load a document into a vector store with sensible chunk size, overlap and metadata.</span></div>
  <div><b>03</b><span>Give an agent a retrieval tool that answers with the source section.</span></div>
  <div><b>04</b><span>Make the agent say "I don't know" when the documents don't say.</span></div>
</div>

  <div class="concept">
    <span class="num">CARD 2 OF 5</span>
    <h3>Embeddings, in plain words</h3>
    <p>An <b>embeddings model</b> turns a piece of text into a long list of numbers that captures its <i>meaning</i>. Texts with similar meaning get similar numbers, even with different words: "my order came late" lands near "delivery arrived after the agreed window". A <b>vector store</b> (Supabase with pgvector, Pinecone, Qdrant…) stores those lists and quickly finds the ones nearest to a question's list.</p>
    <div class="vocab">
      <div><b>Chunk</b>A piece of a document small enough to be about one thing. You search and retrieve chunks, not whole documents.</div>
      <div><b>Chunk size and overlap</b>How long each piece is, and how much text consecutive pieces share, so a rule split across a boundary isn't lost.</div>
      <div><b>Metadata</b>Labels stored with each chunk: source file, section, version date, product. Used to filter and to cite.</div>
      <div><b>Top-k</b>How many chunks to retrieve per question (often 3–5).</div>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 3 OF 5</span>
    <h3>Try it: chunk size decides what the agent reads</h3>
    <p>Below is a short version of Harvest Lane's policy. Adjust the chunking and ask a question to see which chunks would be retrieved. Start with Glitch's 1,000 characters and no overlap, then shrink.</p>
    <div class="raglab" data-rag>
      <label>Document<textarea spellcheck="false">## Refunds for damaged produce
If produce arrives damaged or spoiled, send a photo within 24 hours of delivery. We refund the value of the damaged items in full, or replace them on the next delivery, whichever you prefer. Refunds are paid within 3 working days to the original payment method. Delivery fees are not refunded for damaged items.
## Refunds for late delivery
If your delivery arrives more than 2 hours after the agreed window, we refund the delivery fee. Lateness alone does not qualify for a refund of the goods. Repeated lateness, three times in one month, earns a ₦5,000 credit on your next order.
## Cancellations
You can cancel free of charge until 6 p.m. the day before delivery. After that, cancellations are charged 50% of the order value, because produce is bought fresh for you each morning. Bulk orders over ₦200,000 can only be cancelled 48 hours ahead.
## Substitutions
If an item is unavailable, we call before substituting. We never substitute without your agreement. If we cannot reach you, we leave the item out and refund it.
## Hotels and restaurants
Business customers on a weekly plan pay by invoice within 7 days. Price changes are announced one week ahead by email. Weekly plan customers get priority delivery before 9 a.m.</textarea></label>
      <div class="row">
        <label><span>Chunk size: <b data-o="sizev"></b> characters</span><input type="range" data-rg="size" min="150" max="1200" step="50" value="1000"></label>
        <label><span>Overlap: <b data-o="ovv"></b> characters</span><input type="range" data-rg="ov" min="0" max="200" step="25" value="0"></label>
        <label>Top-k<select data-rg="k"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
      </div>
      <label>Customer question<input type="text" data-rg="q" value="My delivery came 3 hours late. Can I get a refund for the tomatoes?"></label>
      <div class="stats"><div class="stat"><b data-o="nch">–</b><span>chunks</span></div></div>
      <p class="mgoal" data-o="verdict"></p>
      <ol class="chunks" data-o="chunks" aria-live="polite"></ol>
      <p style="font-size:.84rem;color:var(--muted)">A teaching model: here, retrieval scores shared words, which stands in for real embeddings (those match on meaning, not just words). The chunking lesson is the same.</p>
    </div>
  </div>

  <div class="concept">
    <span class="num">CARD 4 OF 5</span>
    <h3>Answer from the source, or say "I don't know"</h3>
    <div class="vocab">
      <div><b>Ground the answer</b>Instruct: answer only from retrieved text; name the section; if the text doesn't answer the question, say so and offer to ask a person.</div>
      <div><b>Quote the rule</b>For money and promises (refunds, cancellations), quote the exact sentence. Paraphrases drift.</div>
      <div><b>Keep documents current</b>Store a version date in metadata. When the policy changes, delete the old chunks and load the new version, or old rules come back to haunt you.</div>
      <div><b>RAG isn't a database</b>"How much are tomatoes today?" is a lookup (4.2), not a document search. RAG is for text: policies, manuals, FAQs, contracts.</div>
    </div>
    <div class="say"><svg viewBox="0 0 120 120"><use href="#sage"/></svg><div class="bubble"><b>Sage:</b> "I don't know, but I'll ask Tolu" is a good answer. A confident wrong answer about refunds costs real money and trust. Test me with questions the documents <i>don't</i> answer, and check I admit it.</div></div>
  </div>

  <div class="concept">
    <span class="num">CARD 5 OF 5</span>
    <h3>RAG nodes in n8n</h3>
    <div class="vocab">
      <div><b>Vector store node</b>(Supabase, Pinecone, Qdrant, PGVector, or the in-memory Simple Vector Store for testing). Modes include <i>Insert Documents</i>, <i>Get Many</i>, and <i>Retrieve Documents (As Tool for AI Agent)</i>, which gives the agent a search tool with a name, description and result limit.</div>
      <div><b>Embeddings sub-node</b>Choose one model (e.g. from OpenAI, Google or Cohere, or a local Ollama model) and use the <b>same</b> one for inserting and retrieving.</div>
      <div><b>Default Data Loader</b>Reads text or a binary file (such as a PDF) and attaches metadata.</div>
      <div><b>Text splitter</b>The Recursive Character Text Splitter sets chunk size and overlap, and tries to split at paragraph and sentence boundaries first.</div>
      <div><b>Supabase setup</b>Supabase needs a table and a matching function (usually <code>match_documents</code>). Copy the SQL from Supabase's LangChain guide, and set the vector size to your embeddings model's size.</div>
    </div>
  </div>
</section>

<!-- ============ GUIDED BUILD ============ -->
<section class="part" style="--c:#8FE0B5">
  <div class="part-h"><span class="tag">PART 4 · 60 MIN</span><h2>Solved problem: the policy assistant</h2></div>
  <div class="prose"><p><b>The goal.</b> Load Harvest Lane's policy PDF into Supabase, then give the support agent a <code>search_policies</code> tool so it answers refund, cancellation and substitution questions with the exact section, and says "I don't know" when the policy is silent.</p></div>

  <div class="steps">
    <div class="step"><div>
      <h4>Prepare Supabase</h4>
      <p>In your Supabase project, open the SQL editor and run the setup from Supabase's LangChain guide: enable the <code>vector</code> extension, create the <code>documents</code> table and the <code>match_documents</code> function. Set the vector size to match your embeddings model (for example, OpenAI's <code>text-embedding-3-small</code> produces 1,536 numbers). In n8n, add a <b>Supabase</b> credential (project URL and service role key: keep it in the credential only; it bypasses row-level security).</p>
    </div></div>

    <div class="step"><div>
      <h4>Build the loading workflow</h4>
      <p><b>HL · Load policies</b>: Manual Trigger → <b>Google Drive · Download</b> the policy PDF → <b>Supabase Vector Store · Insert Documents</b> (table <code>documents</code>), with sub-nodes:</p>
      <ul>
        <li><b>Embeddings</b>: your chosen model.</li>
        <li><b>Default Data Loader</b>: type Binary; metadata <code>source = policies-v3.pdf</code>, <code>version = 2026-10-01</code>.</li>
        <li><b>Recursive Character Text Splitter</b>: chunk size ≈ <b>500</b>, overlap ≈ <b>80</b>. Start there and test (Card 3).</li>
      </ul>
      <p>Run it once. In Supabase's table editor you should see rows with content, metadata and an embedding.</p>
    </div></div>

    <div class="step"><div>
      <h4>Give the agent a search tool</h4>
      <p>On your support agent, add <b>Supabase Vector Store</b> in <b>Retrieve Documents (As Tool for AI Agent)</b> mode, with the same embeddings model. Name: <code>search_policies</code>. Limit: 4. Description: <i>"Searches Harvest Lane's official customer policies (refunds, late delivery, cancellations, substitutions, business accounts). Use it before answering any question about what a customer is entitled to. Returns the most relevant policy passages."</i></p>
    </div></div>

    <div class="step"><div>
      <h4>Ground the answers</h4>
<pre class="codebox">Policies: for any question about refunds, cancellations, substitutions or business accounts,
call search_policies first.
Answer ONLY from the passages returned. Name the policy section you used.
For money (refunds, charges, credits), quote the exact sentence from the policy.
If the passages don't answer the question, say: "I'm not sure the policy covers that.
I'll ask Tolu and get back to you." Never guess.
You can explain policies, but you cannot approve or promise a refund yourself.</pre>
    </div></div>

    <div class="step"><div>
      <h4>Test with answerable and unanswerable questions</h4>
<pre class="codebox" id="rag-tests-4-4">1  My delivery came 3 hours late. Can I get my money back for the tomatoes?
2  Half the eggs were broken. What happens now?
3  Can I cancel tomorrow's order? It's 8 p.m.
4  You swapped my tatashe for rodo without asking!
5  We're a hotel on the weekly plan. When do we pay?
6  Do you deliver to Abuja?                         (not in the policy)
7  Can I get a refund in cash?                      (not covered: should admit it)
8  My order was late 3 times this month. Anything for me?</pre>
      <div><button type="button" class="btn ghost" data-copy="rag-tests-4-4">Copy the 8 questions</button></div>
      <p>Expected for question 1: <i>"Our late-delivery policy refunds the delivery fee: 'Lateness alone does not qualify for a refund of the goods.' I've noted the delay for Tolu."</i> Questions 6 and 7 must end with "I'll ask Tolu", not invented rules.</p>
      <div class="stats">
        <div class="stat"><b>~500 / 80</b><span>chunk size / overlap to start from</span></div>
        <div class="stat"><b>4</b><span>passages retrieved per question</span></div>
        <div class="stat"><b>8/8</b><span>target: correct, cited, or honestly "not sure"</span></div>
      </div>
    </div></div>
  </div>

  <div class="why">
    <div class="box"><h5>Why this approach works</h5><ul><li>Chunks small enough to hold one rule stop policies blending.</li><li>Overlap keeps rules that cross a boundary intact.</li><li>The same embeddings model for loading and searching keeps the search meaningful.</li><li>Quoting and naming sections makes answers checkable.</li><li>"I'm not sure" is an allowed, tested answer.</li></ul></div>
    <div class="box"><h5>Common mistakes to avoid</h5><ul><li>Huge chunks "for more context".</li><li>Different embeddings models for loading and searching.</li><li>Loading v4 of the policy without deleting v3's chunks.</li><li>Using RAG for live data like prices (use a lookup tool).</li><li>Testing only questions the document answers.</li></ul></div>
  </div>
</section>

<!-- ============ GLITCH HUNT ============ -->
<section class="part" style="--c:#FF9FA4">
  <div class="part-h"><span class="tag">PART 5 · 10 MIN</span><h2>Glitch hunt</h2></div>
  <div class="glitchlab">
    <div class="say"><svg viewBox="0 0 120 120"><use href="#glitch"/></svg><div class="bubble"><b>Glitch:</b> Five ways to make a smart agent read the wrong page.</div></div>
    <div class="tablewrap"><table class="dt">
      <thead><tr><th>#</th><th>What happened</th></tr></thead>
      <tbody>
        <tr><td>A</td><td>Answers mix the damaged-produce refund with the late-delivery rule.</td></tr>
        <tr><td>B</td><td>Search returns nonsense for every question after Tolu "upgraded the embeddings model" in the agent.</td></tr>
        <tr><td>C</td><td>The agent quotes the old 24-hour cancellation rule, which changed last month.</td></tr>
        <tr><td>D</td><td>Asked "do you deliver to Abuja?", the agent says yes, confidently.</td></tr>
        <tr><td>E</td><td>A rule split across two chunks comes back half-finished: "…are charged 50% of".</td></tr>
      </tbody>
    </table></div>
    <details class="reveal"><summary>Reveal the answers</summary><div>
      <ol>
        <li><b>A:</b> chunks too big, so both rules land in one chunk. Shrink the chunk size (or split on headings) and re-load.</li>
        <li><b>B:</b> the agent's embeddings model no longer matches the one used for loading. Use the same model, or re-load everything with the new one.</li>
        <li><b>C:</b> old version chunks are still in the store. Delete by the <code>version</code> or <code>source</code> metadata before loading the new version.</li>
        <li><b>D:</b> no "I don't know" rule, and the model filled the gap. Instruct it to answer only from passages, and test unanswerable questions.</li>
        <li><b>E:</b> no overlap between chunks. Add overlap (about 10–20% of the chunk size).</li>
      </ol>
    </div></details>
  </div>
</section>

<!-- ============ MISSIONS ============ -->
<section class="part" style="--c:#FFC59E">
  <div class="part-h"><span class="tag">PART 6 · 30 MIN+</span><h2>Missions</h2></div>

  <div class="mission">
    <span class="tier t-b">BRONZE · +25 XP</span>
    <h4>RAG over one PDF</h4>
    <ul><li>Write a two-page policy document for Harvest Lane (or a business you know), with clear headings.</li><li>Load it into a vector store (Supabase, or the Simple Vector Store to start) and build an agent with a search tool.</li><li>Run the 8 test questions, adapted to your document.</li></ul>
    <span class="crit">Done when</span>
    <ul><li>At least 5 of the 6 answerable questions are correct and cite a section, and both unanswerable questions get an honest "not sure".</li></ul>
  </div>

  <div class="mission">
    <span class="tier t-s">SILVER · +50 XP</span>
    <h4>Metadata filters</h4>

    <h3>Remember this</h3>
    <ol>
      <li>RAG = search your documents, then answer from what you found.</li>
      <li>Two pipelines: load once per version; retrieve on every question.</li>
      <li>One chunk, one topic; overlap so rules aren't cut in half.</li>
      <li>Same embeddings model for loading and searching.</li>
      <li>Metadata for filtering, citing and versioning.</li>
      <li>Answer only from passages, quote money rules, and say "not sure" when needed.</li>
      <li>RAG for documents; lookup tools for live data.</li>
